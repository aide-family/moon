<!doctype html>
<html lang="zh-CN" data-brand="sunset" class="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alioth · 巡检检查项编辑器原型</title>
<style>
  /* ============================================================
     1. 设计令牌：与 web/src/styles/theme/*.css 同名同值（sunset 品牌）
     ============================================================ */
  :root {
    color-scheme: light;
    --background: #f8fafc;
    --foreground: #0f172a;
    --card: rgb(255 255 255 / 0.85);
    --popover: #ffffff;
    --popover-foreground: #0f172a;
    --secondary: #f1f5f9;
    --secondary-foreground: #0f172a;
    --muted: #f1f5f9;
    --muted-foreground: #64748b;
    --accent: #e2e8f0;
    --border: rgb(15 23 42 / 0.1);
    --input: rgb(15 23 42 / 0.12);
    --overlay: rgb(15 23 42 / 0.32);

    --brand-fill: #db7a0e;
    --brand-fill-fg: #171717;
    --brand-fill-hover: #ac6012;
    --brand-ink: #8c4d0d;
    --brand-ring: #8c4d0d;

    --primary: var(--brand-fill);
    --primary-foreground: var(--brand-fill-fg);
    --primary-hover: var(--brand-fill-hover);
    --primary-ink: var(--brand-ink);
    --primary-soft: color-mix(in oklab, var(--brand-fill) 12%, #ffffff);
    --ring: var(--brand-ring);

    --success: #047857;
    --success-soft: color-mix(in oklab, var(--success) 12%, #ffffff);
    --success-border: color-mix(in oklab, var(--success) 32%, transparent);
    --warning: #a34a06;
    --warning-soft: color-mix(in oklab, var(--warning) 12%, #ffffff);
    --warning-border: color-mix(in oklab, var(--warning) 32%, transparent);
    --danger: #b42318;
    --danger-strong: #b42318;
    --danger-strong-foreground: #ffffff;
    --danger-soft: color-mix(in oklab, var(--danger) 10%, #ffffff);
    --danger-border: color-mix(in oklab, var(--danger) 32%, transparent);
    --info: #0369a1;
    --info-soft: color-mix(in oklab, var(--info) 12%, #ffffff);
    --info-border: color-mix(in oklab, var(--info) 32%, transparent);
    --violet: #6d28d9;
    --violet-soft: color-mix(in oklab, var(--violet) 12%, #ffffff);
    --violet-border: color-mix(in oklab, var(--violet) 32%, transparent);

    --sidebar: #ffffff;
    --sidebar-foreground: #0f172a;
    --sidebar-accent: #f1f5f9;
    --sidebar-border: rgb(15 23 42 / 0.08);

    --radius: 0.625rem;
    --font-sans: "Inter", "Geist Variable", -apple-system, "PingFang SC", system-ui, sans-serif;
    --font-heading: "IBM Plex Sans", "Geist Variable", "PingFang SC", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

    --app-gradient:
      radial-gradient(ellipse 80% 50% at 50% -20%, color-mix(in oklab, var(--brand-fill) 12%, transparent), transparent),
      radial-gradient(ellipse 60% 40% at 100% 0%, color-mix(in oklab, var(--brand-400, #f0891f) 10%, transparent), transparent);
  }

  .dark {
    color-scheme: dark;
    --background: #0b1120;
    --foreground: #e2e8f0;
    --card: rgb(17 24 39 / 0.75);
    --popover: #111827;
    --popover-foreground: #e2e8f0;
    --secondary: #1e293b;
    --secondary-foreground: #e2e8f0;
    --muted: #1e293b;
    --muted-foreground: #94a3b8;
    --accent: #334155;
    --border: rgb(148 163 184 / 0.15);
    --input: rgb(148 163 184 / 0.2);
    --overlay: rgb(2 6 23 / 0.62);

    --primary: #f0891f;
    --primary-foreground: #171717;
    --primary-hover: #f8ad72;
    --primary-ink: #f8ad72;
    --primary-soft: color-mix(in oklab, #f0891f 14%, #0b1120);
    --ring: #f8ad72;

    --success: #34d399;
    --success-soft: color-mix(in oklab, var(--success) 14%, #0b1120);
    --success-border: color-mix(in oklab, var(--success) 32%, transparent);
    --warning: #fbbf24;
    --warning-soft: color-mix(in oklab, var(--warning) 14%, #0b1120);
    --warning-border: color-mix(in oklab, var(--warning) 32%, transparent);
    --danger: #fca5a5;
    --danger-strong: #dc2626;
    --danger-strong-foreground: #ffffff;
    --danger-soft: color-mix(in oklab, var(--danger) 12%, #0b1120);
    --danger-border: color-mix(in oklab, var(--danger) 32%, transparent);
    --info: #38bdf8;
    --info-soft: color-mix(in oklab, var(--info) 14%, #0b1120);
    --info-border: color-mix(in oklab, var(--info) 32%, transparent);
    --violet: #c4b5fd;
    --violet-soft: color-mix(in oklab, var(--violet) 14%, #0b1120);
    --violet-border: color-mix(in oklab, var(--violet) 32%, transparent);

    --sidebar: #0f172a;
    --sidebar-foreground: #e2e8f0;
    --sidebar-accent: #1e293b;
    --sidebar-border: rgb(148 163 184 / 0.15);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.45;
    color: var(--foreground);
    background-color: var(--background);
    background-image: var(--app-gradient);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .mono { font-family: var(--font-mono); }

  /* ============================================================
     2. 外壳：侧边栏 + 顶栏 + 内容区
     ============================================================ */
  .shell { display: flex; height: 100vh; overflow: hidden; }
  .sidebar {
    width: 16rem; flex: none; display: flex; flex-direction: column;
    background: var(--sidebar); color: var(--sidebar-foreground);
    border-right: 1px solid var(--sidebar-border);
  }
  .brand { display: flex; align-items: center; gap: 8px; padding: 14px 12px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 9px; flex: none;
    background: linear-gradient(140deg, #f8ad72, #db7a0e 55%, #ac6012);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
    font-family: var(--font-heading);
  }
  .brand-name { font-family: var(--font-heading); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .nav { display: flex; flex-direction: column; gap: 2px; padding: 0 8px 8px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px;
    border: 0; background: transparent; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: inherit; text-align: left; width: 100%;
    border-left: 2px solid transparent; transition: background .12s ease;
  }
  .nav-item:hover { background: var(--sidebar-accent); }
  .nav-item .chev { margin-left: auto; color: var(--muted-foreground); transition: transform .15s ease; }
  .nav-item[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .nav-sub { display: flex; flex-direction: column; gap: 2px; margin: 2px 0 6px 14px; padding-left: 10px; border-left: 1px solid var(--border); }
  .nav-sub .nav-item { height: 28px; font-size: 13.5px; }
  .nav-item.active {
    background: var(--sidebar-accent); color: var(--primary-ink);
    border-left-color: var(--primary); font-weight: 500;
  }
  .nav-item .icon { flex: none; display: inline-flex; opacity: .85; }
  .nav-sub .nav-item .icon { opacity: .7; }
  .sidebar-foot { margin-top: auto; padding: 8px 12px 12px; font-size: 11px; color: var(--muted-foreground); }

  .inset { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 48px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 16px; border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent);
    background: color-mix(in oklab, var(--background) 80%, transparent);
    backdrop-filter: blur(6px);
  }
  .icon-btn {
    width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px;
    border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--muted-foreground);
  }
  .icon-btn:hover { background: var(--muted); color: var(--foreground); }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .tenant-chip {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--popover);
    font-size: 13px; cursor: pointer;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 9999px; display: grid; place-items: center;
    background: var(--primary-soft); color: var(--primary-ink); font-size: 12px; font-weight: 600;
    border: 1px solid color-mix(in oklab, var(--primary) 30%, transparent);
  }

  .content { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px 32px; }
  .page { display: flex; flex-direction: column; gap: 24px; }
  .page[hidden] { display: none; }
  .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .page-title { margin: 0; font-family: var(--font-heading); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .page-desc { margin: 4px 0 0; font-size: 14px; color: var(--muted-foreground); }
  .page-head-actions { display: flex; align-items: center; gap: 8px; padding-top: 2px; }

  /* ============================================================
     3. 基础控件
     ============================================================ */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 10px; border-radius: 10px; border: 1px solid transparent;
    background: transparent; font-size: 14px; font-weight: 500; white-space: nowrap;
    cursor: pointer; transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .btn svg { width: 16px; height: 16px; }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline { border-color: var(--border); background: var(--background); color: var(--foreground); }
  .btn-outline:hover { background: var(--muted); }
  .btn-ghost { color: var(--foreground); }
  .btn-ghost:hover { background: var(--muted); }
  .btn-secondary { background: var(--secondary); color: var(--secondary-foreground); }
  .btn-secondary:hover { background: var(--accent); }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12.8px; border-radius: 10px; }
  .btn-sm svg { width: 14px; height: 14px; }
  .btn-icon { width: 28px; height: 28px; padding: 0; }
  .btn-danger { background: color-mix(in oklab, var(--danger) 10%, transparent); color: var(--danger); }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .link-btn { border: 0; background: transparent; padding: 0; font-size: 13px; color: var(--primary-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in oklab, var(--primary-ink) 35%, transparent); }
  .link-btn:hover { text-decoration-color: currentColor; }

  .input, .select, .textarea {
    width: 100%; height: 32px; padding: 0 10px; font-size: 14px; font-family: inherit;
    color: var(--foreground); background: var(--popover);
    border: 1px solid var(--input); border-radius: 10px; outline: none;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .input::placeholder, .textarea::placeholder { color: color-mix(in oklab, var(--muted-foreground) 85%, transparent); }
  .input:focus, .select:focus, .textarea:focus { border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring); }
  .textarea { height: auto; min-height: 76px; padding: 8px 10px; line-height: 1.5; resize: vertical; }
  .select {
    appearance: none; cursor: pointer; padding-right: 28px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center;
  }
  .input-sm, .select-sm { height: 28px; font-size: 12.8px; border-radius: 8px; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
  .field .req { color: var(--danger); }
  .field .hint { font-size: 11.5px; line-height: 1.5; color: var(--muted-foreground); }
  .field .err { font-size: 12px; color: var(--danger); }
  .field.invalid .input { border-color: var(--danger); box-shadow: 0 0 0 3px color-mix(in oklab, var(--danger) 18%, transparent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .span2 { grid-column: 1 / -1; }
  .inline { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }

  /* 状态/类型标签 */
  .badge {
    display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px;
    border-radius: 9999px; border: 1px solid transparent; font-size: 12px; font-weight: 500;
    white-space: nowrap; line-height: 1;
  }
  .badge svg { width: 12px; height: 12px; }
  .tone-success { border-color: var(--success-border); background: var(--success-soft); color: var(--success); }
  .tone-warning { border-color: var(--warning-border); background: var(--warning-soft); color: var(--warning); }
  .tone-danger { border-color: var(--danger-border); background: var(--danger-soft); color: var(--danger); }
  .tone-info { border-color: var(--info-border); background: var(--info-soft); color: var(--info); }
  .tone-violet { border-color: var(--violet-border); background: var(--violet-soft); color: var(--violet); }
  .tone-primary { border-color: color-mix(in oklab, var(--primary-ink) 35%, transparent); background: var(--primary-soft); color: var(--primary-ink); }
  .tone-neutral { border-color: var(--border); background: color-mix(in oklab, var(--muted) 60%, transparent); color: var(--muted-foreground); }
  .dot { width: 6px; height: 6px; border-radius: 9999px; background: currentColor; flex: none; }

  /* 分段切换（与历史告警页的 2 段式同构） */
  .segmented {
    display: inline-grid; grid-auto-flow: column; gap: 2px; height: 32px; padding: 2px; border-radius: 10px;
    border: 1px solid color-mix(in oklab, var(--border) 70%, transparent);
    background: color-mix(in oklab, var(--muted) 40%, transparent);
  }
  .segmented button {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    height: 26px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent;
    font-size: 12.8px; color: var(--muted-foreground); cursor: pointer; white-space: nowrap;
  }
  .segmented button:hover { color: var(--foreground); }
  .segmented button[aria-pressed="true"] {
    background: var(--popover); color: var(--foreground); font-weight: 500;
    box-shadow: 0 1px 3px rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
  }
  .segmented .count { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }

  /* ============================================================
     4. 列表页
     ============================================================ */
  .rules-grid { display: grid; grid-template-columns: 288px minmax(0, 1fr); gap: 24px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
  .card {
    display: flex; flex-direction: column; overflow: hidden; border-radius: 14px;
    background: var(--card); border: 1px solid color-mix(in oklab, var(--border) 50%, transparent);
    backdrop-filter: blur(4px);
  }
  .control-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 48px; flex: none; padding: 0 12px; border-bottom: 1px solid var(--border);
    background: var(--background);
  }
  .control-bar .total { font-family: var(--font-mono); font-size: 13px; color: var(--muted-foreground); }
  .card-body { padding: 16px; min-height: 0; }
  .group-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; }
  .group-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .group-btn {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
    height: auto; padding: 8px; border: 0; border-radius: 8px; background: transparent;
    text-align: left; cursor: pointer; transition: background .12s ease;
  }
  .group-btn:hover { background: var(--muted); }
  .group-btn.selected { background: var(--secondary); }
  .group-btn .name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13.5px;
  }

  .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .tbl-wrap { overflow: auto; margin: -4px; padding: 4px; }
  table.tbl { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
  table.tbl th {
    height: 40px; text-align: left; font-size: 13px; font-weight: 500; color: var(--foreground);
    padding: 0 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
    position: sticky; top: 0; background: color-mix(in oklab, var(--card) 92%, var(--background)); backdrop-filter: blur(4px);
  }
  table.tbl td { padding: 10px 8px; border-bottom: 1px solid color-mix(in oklab, var(--border) 60%, transparent); vertical-align: top; }
  table.tbl tr:hover td { background: color-mix(in oklab, var(--muted) 50%, transparent); }
  table.tbl tr:last-child td { border-bottom: 0; }
  .col-type { width: 96px; }
  .col-level { width: 74px; }
  .col-status { width: 68px; }
  .col-actions { width: 84px; text-align: right; }
  .cell-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cell-name { font-weight: 500; }
  .cell-sub { font-size: 12px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .code-line {
    font-family: var(--font-mono); font-size: 12px; line-height: 1.5; color: var(--foreground);
    background: color-mix(in oklab, var(--muted) 70%, transparent);
    border-radius: 6px; padding: 2px 6px; display: -webkit-box; max-width: 100%;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all;
  }
  .code-line.one { display: block; white-space: nowrap; text-overflow: ellipsis; word-break: normal; }
  .targets { display: flex; flex-direction: column; gap: 3px; }
  .target-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .up { color: var(--success); }
  .down { color: var(--danger); }
  .level-badges { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .row-actions { display: inline-flex; align-items: center; gap: 10px; justify-content: flex-end; white-space: nowrap; }
  .pager { display: inline-flex; align-items: center; gap: 8px; }
  .pager span { font-family: var(--font-mono); font-size: 13px; color: var(--muted-foreground); }

  /* ============================================================
     5. 对话框（三段式外框：header / body / footer）
     ============================================================ */
  .overlay {
    position: fixed; inset: 0; z-index: 40; background: var(--overlay);
    backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 16px;
    animation: fade .12s ease;
  }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .dialog {
    position: relative; display: flex; flex-direction: column; gap: 16px;
    width: min(calc(100% - 2rem), 44rem); max-width: calc(100vw - 2rem);
    max-height: 82vh; padding: 16px;
    background: var(--popover); color: var(--popover-foreground);
    border-radius: 14px; box-shadow: 0 0 0 1px color-mix(in oklab, var(--foreground) 10%, transparent), 0 24px 60px -12px rgb(2 6 23 / .35);
    animation: zoom .12s ease;
  }
  @keyframes zoom { from { transform: scale(.97); opacity: .6 } to { transform: scale(1); opacity: 1 } }
  .dialog.wide { width: min(calc(100% - 2rem), 48rem); max-width: calc(100vw - 2rem); }
  .dialog-head { display: flex; flex-direction: column; gap: 8px; flex: none; min-width: 0; }
  .dialog-title { margin: 0; font-family: var(--font-heading); font-size: 16px; font-weight: 600; }
  .dialog-sub { font-size: 12.5px; color: var(--muted-foreground); }
  .dialog-close { position: absolute; top: 10px; right: 10px; }
  .dialog-body { min-height: 0; flex: 1; overflow: auto; overscroll-behavior: contain; display: grid; align-content: start; gap: 16px; padding-right: 2px; }
  .dialog-footer {
    margin: -16px; margin-top: 0; padding: 16px; flex: none; display: flex; flex-direction: row;
    align-items: center; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border);
    background: color-mix(in oklab, var(--muted) 50%, transparent); border-radius: 0 0 14px 14px;
  }

  /* 步骤条 */
  .steps { display: flex; align-items: center; gap: 6px; min-width: 0; overflow-x: auto; padding-bottom: 2px; }
  .step { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
  .step .num {
    width: 18px; height: 18px; border-radius: 9999px; display: grid; place-items: center;
    font-size: 11px; font-family: var(--font-mono);
    border: 1px solid var(--border); background: var(--background);
  }
  .step[data-state="active"] { color: var(--foreground); font-weight: 500; }
  .step[data-state="active"] .num { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  .step[data-state="done"] .num { background: var(--primary-soft); border-color: color-mix(in oklab, var(--primary) 35%, transparent); color: var(--primary-ink); }
  .step-sep { width: 14px; height: 1px; background: var(--border); flex: none; }

  /* 类型选择卡片 */
  .type-group { display: flex; flex-direction: column; gap: 8px; }
  .type-group-label { font-size: 11.5px; font-weight: 600; letter-spacing: .04em; color: var(--muted-foreground); text-transform: uppercase; }
  .type-cards { display: grid; gap: 8px; }
  .type-cards.two { grid-template-columns: repeat(2, 1fr); }
  .type-cards.three { grid-template-columns: repeat(3, 1fr); }
  .type-card {
    position: relative; display: flex; align-items: flex-start; gap: 8px; text-align: left;
    padding: 10px; border-radius: 12px; border: 1px solid var(--input);
    background: var(--popover); cursor: pointer; transition: border-color .12s, background .12s, box-shadow .12s;
  }
  .type-card:hover { border-color: color-mix(in oklab, var(--primary) 55%, var(--input)); background: color-mix(in oklab, var(--primary-soft) 45%, var(--popover)); }
  .type-card[aria-checked="true"] {
    border-color: var(--primary); background: color-mix(in oklab, var(--primary-soft) 70%, var(--popover));
    box-shadow: 0 0 0 1px var(--primary);
  }
  .type-card .tc-icon {
    width: 28px; height: 28px; flex: none; border-radius: 8px; display: grid; place-items: center;
    background: var(--muted); color: var(--muted-foreground);
  }
  .type-card[aria-checked="true"] .tc-icon { background: var(--primary); color: var(--primary-foreground); }
  .type-card .tc-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .type-card .tc-title { font-size: 13px; font-weight: 500; }
  .type-card .tc-desc { font-size: 11px; line-height: 1.45; color: var(--muted-foreground); }
  .type-card[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
  .type-card[aria-disabled="true"]:hover { border-color: var(--input); background: var(--popover); }
  .soon {
    display: inline-block; margin-left: 4px; padding: 0 5px; border-radius: 9999px;
    font-size: 10px; font-weight: 500; line-height: 15px; vertical-align: 1px;
    color: var(--muted-foreground); background: var(--muted); border: 1px solid var(--border);
  }
  .type-card .tc-check { position: absolute; top: 8px; right: 8px; color: var(--primary-ink); display: none; }
  .type-card[aria-checked="true"] .tc-check { display: block; }

  /* 折叠区 */
  .section {
    border: 1px solid var(--border); border-radius: 12px; padding: 12px;
    display: flex; flex-direction: column; gap: 12px; min-width: 0;
  }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .section-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
  .section-title .idx {
    width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center;
    background: var(--primary-soft); color: var(--primary-ink); font-size: 11px; font-family: var(--font-mono);
  }
  .section-hint { font-size: 11.5px; color: var(--muted-foreground); line-height: 1.55; }
  .repeat-row {
    display: flex; align-items: flex-start; gap: 8px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 30%, var(--popover));
  }
  .repeat-rows { display: flex; flex-direction: column; gap: 8px; }
  .rr-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rr-title { font-size: 12.5px; font-weight: 600; color: var(--muted-foreground); }
  .adv-toggle { display: flex; align-items: center; gap: 6px; background: transparent; border: 0; padding: 0; font-size: 12.5px; color: var(--primary-ink); cursor: pointer; }
  .adv-toggle .chev { transition: transform .12s; }
  .adv-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .adv-body { display: grid; gap: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .adv-body[hidden] { display: none; }

  /* 开关 */
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
  .switch .track {
    width: 32px; height: 18px; border-radius: 9999px; background: var(--input); position: relative;
    transition: background .15s; flex: none;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 9999px;
    background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .25);
  }
  .switch[aria-checked="true"] .track { background: var(--primary); }
  .switch[aria-checked="true"] .track::after { transform: translateX(14px); }

  /* 试探测结果 */
  .trial {
    border-radius: 12px; border: 1px solid var(--success-border);
    background: color-mix(in oklab, var(--success-soft) 55%, var(--popover));
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .trial.fail { border-color: var(--danger-border); background: color-mix(in oklab, var(--danger-soft) 55%, var(--popover)); }
  .trial-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .trial-head strong { font-size: 13px; }
  .trial-metrics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .trial-metric { background: color-mix(in oklab, var(--popover) 70%, transparent); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  .trial-metric .k { font-size: 11px; color: var(--muted-foreground); display: block; }
  .trial-metric .v { font-family: var(--font-mono); font-size: 13px; }
  .trial-verdict { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .spinner { width: 14px; height: 14px; border-radius: 9999px; border: 2px solid color-mix(in oklab, var(--primary) 30%, transparent); border-top-color: var(--primary); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* 判定条件里的换算提示 */
  .convert-hint { font-size: 11.5px; color: var(--primary-ink); background: var(--primary-soft); border-radius: 6px; padding: 2px 6px; display: inline-flex; align-items: center; gap: 4px; }

  /* 详情抽屉 */
  .sheet-overlay { position: fixed; inset: 0; z-index: 40; background: var(--overlay); animation: fade .12s ease; }
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(100%, 38rem);
    background: var(--popover); border-left: 1px solid var(--border); display: flex; flex-direction: column;
    box-shadow: -24px 0 60px -24px rgb(2 6 23 / .35);
  }
  .sheet-head { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; flex: none; }
  .sheet-body { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; flex: 1; }
  .kv { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 8px 12px; font-size: 13px; }
  .kv dt { color: var(--muted-foreground); }
  .kv dd { margin: 0; min-width: 0; }
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: color-mix(in oklab, var(--muted) 30%, var(--popover)); }
  .stat .k { font-size: 11.5px; color: var(--muted-foreground); }
  .stat .v { font-family: var(--font-mono); font-size: 18px; font-weight: 500; margin-top: 2px; }
  .spark { width: 100%; height: 44px; display: block; }
  .mini-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .mini-tbl th { text-align: left; font-weight: 500; color: var(--muted-foreground); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .mini-tbl td { padding: 7px 8px; border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent); white-space: nowrap; }
  .mini-tbl td.mono { font-family: var(--font-mono); font-size: 12px; }

  /* 原型控制条（截图时隐藏） */
  .proto-bar {
    position: fixed; z-index: 90; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 12px;
    border: 1px dashed color-mix(in oklab, var(--foreground) 30%, transparent);
    background: color-mix(in oklab, var(--popover) 92%, transparent); backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px -12px rgb(2 6 23 / .35); font-size: 11.5px; max-width: calc(100vw - 24px);
    overflow-x: auto;
  }
  .proto-bar .label { color: var(--muted-foreground); padding: 0 4px; white-space: nowrap; }
  .proto-bar button {
    height: 24px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--background); font-size: 11.5px; cursor: pointer; white-space: nowrap;
  }
  .proto-bar button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  .shot .proto-bar { display: none; }
  .shot.full .dialog { max-height: none; }
  .shot.full .dialog-body { overflow: visible; }
  .shot.full .overlay { align-items: flex-start; }
  .shot.full body { overflow: visible; }

  @media (max-width: 1180px) {
    .rules-grid { grid-template-columns: 1fr; }
    .trial-metrics { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .step { white-space: nowrap; }
    .step-label { display: none; }
    .step[data-state="active"] .step-label { display: inline; }
    .trial-metrics { grid-template-columns: repeat(2, 1fr) !important; }
    .stat-row { grid-template-columns: 1fr; }
    .row2, .row3, .type-cards.two, .type-cards.three { grid-template-columns: 1fr; }
    .content { padding: 12px; }
  }
  /* ============================================================
     6. 巡检原型增量样式（复用上面的令牌与基础组件）
     ============================================================ */

  /* 列表页概览统计 */
  .stat-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat-card {
    border: 1px solid color-mix(in oklab, var(--border) 55%, transparent);
    border-radius: 14px; padding: 14px 16px; background: var(--card);
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
    backdrop-filter: blur(4px);
  }
  .stat-card .k { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); }
  .stat-card .v { font-family: var(--font-heading); font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .stat-card .v small { font-size: 12px; font-weight: 400; color: var(--muted-foreground); margin-left: 4px; font-family: var(--font-sans); }
  .stat-card .delta { font-size: 11.5px; color: var(--muted-foreground); display: flex; align-items: center; gap: 4px; }
  .stat-card .delta.up { color: var(--success); }
  .stat-card .delta.down { color: var(--danger); }
  .stat-card.warn { border-color: var(--warning-border); background: color-mix(in oklab, var(--warning-soft) 45%, var(--card)); }
  .stat-card.brand { border-color: color-mix(in oklab, var(--primary) 30%, var(--border)); background: color-mix(in oklab, var(--primary-soft) 40%, var(--card)); }

  .filter-card .card-body { padding: 12px; }
  .filter-grid { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .filter-grid .input, .filter-grid .select { width: auto; }
  .filter-grid .input { min-width: 220px; }
  .filter-grid .grow { flex: 1; }

  .name-cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .name-cell .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .name-cell .top strong { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name-cell .sub { font-size: 12px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .inline-badges { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .cell-stack { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 13px; align-items: flex-start; }
  .cell-stack .sub { font-size: 11.5px; color: var(--muted-foreground); }
  .muted { color: var(--muted-foreground); }
  .nowrap { white-space: nowrap; }
  .tnum { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .row-status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }

  .run-spinner { width: 12px; height: 12px; border-width: 2px; }

  /* 向导 */
  .dialog.xl { width: min(calc(100% - 2rem), 68rem); max-height: 88vh; }
  .wizard-body { display: flex; flex-direction: column; gap: 16px; }
  .wizard-intro { display: flex; flex-direction: column; gap: 4px; }
  .wizard-intro .t { font-size: 13.5px; font-weight: 600; }
  .wizard-intro .d { font-size: 12px; color: var(--muted-foreground); line-height: 1.55; }
  .wizard-foot-note { margin-right: auto; font-size: 12px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
  .step-body { display: flex; flex-direction: column; gap: 16px; }
  .step-body[hidden] { display: none; }

  .item-workspace { display: grid; grid-template-columns: 252px minmax(0, 1fr); gap: 12px; align-items: start; }
  .item-list { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; padding: 2px; }
  .item-row {
    display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--popover); cursor: pointer;
    text-align: left; width: 100%; transition: border-color .12s, background .12s;
  }
  .item-row:hover { background: var(--muted); }
  .item-row.active { border-color: var(--primary); background: color-mix(in oklab, var(--primary-soft) 60%, var(--popover)); }
  .item-row .ico { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--muted); color: var(--muted-foreground); flex: none; }
  .item-row.active .ico { background: var(--primary); color: var(--primary-foreground); }
  .item-row .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .item-row .txt .n { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-row .txt .m { font-size: 10.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-row .ord { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted-foreground); }
  .item-add { border: 1px dashed var(--input); background: transparent; justify-content: center; color: var(--muted-foreground); }
  .item-add:hover { color: var(--primary-ink); border-color: var(--primary); background: var(--primary-soft); }

  .kind-picker { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .kind-picker .type-card { flex-direction: column; gap: 6px; padding: 10px; }
  .kind-picker .type-card .tc-icon { width: 26px; height: 26px; }
  .kind-picker .type-card .tc-title { font-size: 12.5px; }
  .kind-picker .type-card .tc-desc { font-size: 10.5px; }

  .item-editor { border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--popover); }
  .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .editor-head .t { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }

  .trial-panel { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in oklab, var(--muted) 35%, var(--popover)); }
  .trial-panel.ok { border-color: var(--success-border); background: color-mix(in oklab, var(--success-soft) 45%, var(--popover)); }
  .trial-panel .th { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
  .trial-panel .th .spinner { margin-left: auto; }
  .trial-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .trial-kpi { background: color-mix(in oklab, var(--popover) 80%, transparent); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
  .trial-kpi .k { display: block; font-size: 10.5px; color: var(--muted-foreground); }
  .trial-kpi .v { font-family: var(--font-mono); font-size: 13px; }

  /* 模板选择卡 */
  .tpl-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tpl-card { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--input); border-radius: 12px; background: var(--popover); cursor: pointer; text-align: left; }
  .tpl-card[aria-checked="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); background: color-mix(in oklab, var(--primary-soft) 55%, var(--popover)); }
  .tpl-card .mini-paper { border-radius: 6px; border: 1px solid var(--border); background: #fff; padding: 8px; display: flex; flex-direction: column; gap: 4px; height: 92px; overflow: hidden; }
  .tpl-card .mini-paper i { display: block; height: 3px; border-radius: 2px; background: #e2e8f0; }
  .tpl-card .mini-paper i.t { height: 5px; width: 55%; background: #cbd5e1; }
  .tpl-card .mini-paper i.c { background: #f1c28b; }
  .tpl-card .mt { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
  .tpl-card .md { font-size: 10.5px; color: var(--muted-foreground); line-height: 1.4; }
  .checkbox-row { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; }
  .checkbox-row input { margin-top: 2px; accent-color: var(--primary); }
  .checkbox-row .ch { display: flex; flex-direction: column; gap: 1px; }
  .checkbox-row .ch b { font-weight: 500; }
  .checkbox-row .ch span { font-size: 11.5px; color: var(--muted-foreground); }

  .wiz-preview { border: 1px solid var(--border); border-radius: 12px; background: color-mix(in oklab, var(--muted) 40%, var(--background)); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .wiz-preview .lbl { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); }
  .wiz-preview .paper { background: #fff; color: #1f2937; border-radius: 8px; padding: 14px; font-size: 10.5px; line-height: 1.6; box-shadow: 0 6px 20px -12px rgb(2 6 23 / .35); }
  .wiz-preview .paper h4 { margin: 0 0 2px; font-size: 13px; }
  .wiz-preview .paper .pm { color: #6b7280; font-size: 9.5px; margin-bottom: 8px; }
  .wiz-preview .paper .pbanner { border-radius: 5px; background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; padding: 5px 7px; font-size: 9.5px; margin-bottom: 8px; }
  .wiz-preview .paper .prow { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding: 3px 0; font-size: 9.5px; }
  .wiz-preview .paper .prow b { font-weight: 600; }

  .notify-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .notify-card { border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: var(--popover); display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .notify-card[data-checked="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); background: color-mix(in oklab, var(--primary-soft) 45%, var(--popover)); }
  .notify-card .nt { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; }
  .notify-card .nc { display: flex; gap: 4px; flex-wrap: wrap; }
  .schedule-preview { font-size: 12px; color: var(--primary-ink); background: var(--primary-soft); border: 1px solid color-mix(in oklab, var(--primary) 25%, transparent); border-radius: 8px; padding: 8px 10px; display: flex; align-items: center; gap: 6px; }
  .radio-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .radio-card { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--input); border-radius: 10px; padding: 10px; cursor: pointer; background: var(--popover); font-size: 12.5px; }
  .radio-card[data-checked="true"] { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); background: color-mix(in oklab, var(--primary-soft) 40%, var(--popover)); }
  .radio-card input { margin-top: 2px; accent-color: var(--primary); }
  .radio-card b { font-weight: 500; }
  .radio-card span { display: block; font-size: 11px; color: var(--muted-foreground); margin-top: 2px; line-height: 1.4; }

  /* 模板管理 */
  .tpl-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
  .tpl-list { display: flex; flex-direction: column; gap: 6px; }
  .tpl-item { display: flex; flex-direction: column; gap: 4px; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--popover); text-align: left; cursor: pointer; }
  .tpl-item:hover { background: var(--muted); }
  .tpl-item.active { border-color: var(--primary); background: color-mix(in oklab, var(--primary-soft) 55%, var(--popover)); }
  .tpl-item .r1 { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; min-width: 0; }
  .tpl-item .r1 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tpl-item .r2 { font-size: 11px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
  .editor-card { display: flex; flex-direction: column; gap: 12px; }
  .editor-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .editor-toolbar .grow { flex: 1; }
  .code-area {
    width: 100%; height: 360px; padding: 12px; font-family: var(--font-mono); font-size: 12px; line-height: 1.7;
    color: var(--foreground); background: color-mix(in oklab, var(--muted) 55%, var(--popover));
    border: 1px solid var(--input); border-radius: 10px; resize: vertical; tab-size: 2;
  }
  .code-area:focus { outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring); }
  .vars { display: flex; flex-wrap: wrap; gap: 4px; }

  .rp-banner.bad b { color: #991b1b; }

  .rp-summary .c .k { font-size: 10.5px; color: #6b7280; }

  .rp-section { margin-top: 26px; }

  .rp-section h3 .no { font-family: var(--font-mono); font-size: 10.5px; color: #9a6a2f; background: #fdf6ec; border: 1px solid #f3e0c4; border-radius: 5px; padding: 1px 5px; }

  .rp-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }

  /* ============================================================

  /* 类别标签：与状态徽标分开，避免所有信息都像可点击 */

  .share-url { display: flex; gap: 6px; }

  .public-view {
    position: fixed; inset: 0; z-index: 75; overflow-y: auto;

  .public-top {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; border-bottom: 1px solid var(--border);

  }
  .public-main { padding: 28px 16px 40px; }
  .public-main .report-paper { width: min(100%, 760px); margin: 0 auto; }
  .public-foot { max-width: 760px; margin: 14px auto 0; text-align: center; font-size: 12px; color: var(--muted-foreground); }

  @media (max-width: 720px) {
    .tip-panel { width: min(280px, calc(100vw - 48px)); }

    .public-main { padding: 16px 10px 32px; }
    .share-url { flex-direction: column; }
    .share-url .btn { width: 100%; }

  /* tooltip 放到信息图标右侧，避免盖住 cron 输入框 */
  .tip-panel { left: calc(100% + 10px); top: -10px; }
  @media (max-width: 720px) {
    .tip-panel { left: auto; right: 0; top: calc(100% + 8px); }

  /* ============================================================
     检查项编辑器
     ============================================================ */
  .steps.page-steps { margin: 0; justify-content: flex-start; }
  .plan-summary {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;

  .item-accordion { display: flex; flex-direction: column; gap: 10px; }

  .item-card.open .item-head { background: color-mix(in oklab, var(--primary-soft) 28%, var(--popover)); }
  .item-head .idx { font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); width: 18px; }

    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    background: var(--muted); color: var(--muted-foreground); flex: none;
  }
  .item-card.open .item-head .icon { background: var(--primary-soft); color: var(--primary-ink); }
  .item-head .main { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .item-head .title { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-head .meta { font-size: 11.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .item-head .chev { flex: none; color: var(--muted-foreground); display: inline-flex; transition: transform .15s; }

  .item-body { border-top: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .type-switch { width: fit-content; height: auto; min-height: 34px; display: flex; flex-wrap: wrap; }

  .config-pane .segmented { width: fit-content; min-width: 220px; }
  .type-switch button { gap: 5px; height: 30px; }
  .editor-grid { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 16px; align-items: start; }
  .config-pane { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .preview-pane {
    border: 1px solid var(--border); border-radius: 12px; background: color-mix(in oklab, var(--muted) 35%, var(--popover));
    padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; position: sticky; top: 0;
  }
  .preview-head { display: flex; align-items: center; gap: 8px; }
  .preview-head .lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted-foreground); font-weight: 600; }
  .preview-head .grow { flex: 1; }
  .preview-body { min-height: 220px; display: flex; flex-direction: column; gap: 10px; }
  .preview-empty { margin: auto; text-align: center; color: var(--muted-foreground); font-size: 12px; line-height: 1.7; }

  .config-group { display: flex; flex-direction: column; gap: 10px; }
  .config-group + .config-group { border-top: 1px solid var(--border); padding-top: 12px; }
  .group-label { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
  .query-box { border: 1px solid var(--input); border-radius: 10px; overflow: hidden; background: var(--popover); }
  .query-box-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--muted) 40%, var(--popover)); }
  .query-box-head .dialect { font-family: var(--font-mono); font-size: 10.5px; color: var(--primary-ink); background: var(--primary-soft); border: 1px solid color-mix(in oklab, var(--primary) 25%, transparent); padding: 1px 6px; border-radius: 5px; }
  .query-box-head .grow { flex: 1; }
  .query-editor {
    width: 100%; min-height: 132px; border: 0; outline: none; resize: vertical;
    background: transparent; color: var(--foreground); padding: 10px 12px;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.75;
  }
  .query-editor:focus { box-shadow: inset 0 0 0 2px color-mix(in oklab, var(--ring) 45%, transparent); }
  .syntax-hint { font-size: 11px; color: var(--muted-foreground); line-height: 1.6; }

  .threshold-row { display: grid; grid-template-columns: 92px 110px 110px 32px; gap: 6px; align-items: center; }
  .threshold-row select, .threshold-row input { height: 30px; }
  .add-line { align-self: flex-start; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-toggle {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px;
    border: 1px solid var(--input); border-radius: 9999px; background: var(--popover);
    font-size: 11.5px; color: var(--muted-foreground); cursor: pointer;
  }
  .chip-toggle:hover { border-color: var(--primary); color: var(--primary-ink); }
  .chip-toggle[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-ink); }
  .chip-toggle .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .metric-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .metric-card { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; background: var(--popover); }
  .metric-card .k { font-size: 10.5px; color: var(--muted-foreground); }
  .metric-card .v { font-family: var(--font-mono); font-size: 16px; font-weight: 600; margin-top: 2px; }
  .metric-card .v small { font-size: 10px; color: var(--muted-foreground); font-weight: 400; }
  .metric-card .d { font-size: 10.5px; color: var(--warning); }
  .sparkline { width: 100%; height: 74px; display: block; }
  .mini-head { font-size: 11px; color: var(--muted-foreground); display: flex; justify-content: space-between; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .mini-table th { text-align: left; font-weight: 500; color: var(--muted-foreground); padding: 4px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .mini-table td { padding: 5px 6px; border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent); vertical-align: top; }
  .mini-table tr:last-child td { border-bottom: 0; }
  .log-line { display: grid; grid-template-columns: 64px 58px minmax(0, 1fr); gap: 6px; padding: 5px 6px; border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent); font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; }
  .log-line:last-child { border-bottom: 0; }
  .log-line .t { color: var(--muted-foreground); }
  .log-line .lv-error { color: var(--danger); }
  .log-line .lv-warn { color: var(--warning); }
  .log-line .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview-flag { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; padding: 1px 6px; border-radius: 9999px; }
  .preview-flag.ok { color: var(--success); background: var(--success-soft); border: 1px solid var(--success-border); }
  .preview-flag.warn { color: var(--warning); background: var(--warning-soft); border: 1px solid var(--warning-border); }

  .item-footer { display: flex; align-items: center; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); }
  .item-footer .dirty { margin-right: auto; font-size: 11.5px; color: var(--warning); display: inline-flex; align-items: center; gap: 6px; }
  .item-footer .dirty .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); }
  .item-footer .dirty.clean { color: var(--muted-foreground); }
  .item-footer .dirty.clean .dot { background: var(--success); }

  .add-item {
    width: 100%; height: 44px; border: 1px dashed var(--input); border-radius: 12px;
    background: transparent; color: var(--muted-foreground); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .add-item:hover { border-color: var(--primary); color: var(--primary-ink); background: var(--primary-soft); }

  .wizard-footer {
    position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
    padding: 12px 0; border-top: 1px solid var(--border);
    background: color-mix(in oklab, var(--background) 92%, transparent); backdrop-filter: blur(8px);
  }
  .wizard-footer .note { margin-right: auto; font-size: 12px; color: var(--muted-foreground); }

  .md-preview { font-size: 12px; line-height: 1.75; color: var(--foreground); }
  .md-preview h3 { font-size: 13px; margin: 6px 0 4px; }
  .md-preview h4 { font-size: 12px; margin: 6px 0 3px; }
  .md-preview p { margin: 0 0 6px; }
  .md-preview ul { margin: 4px 0; padding-left: 18px; }
  .md-preview code { font-family: var(--font-mono); background: var(--muted); padding: 1px 4px; border-radius: 4px; }

  @media (max-width: 1180px) {
    .editor-grid { grid-template-columns: 1fr; }
    .preview-pane { position: static; }
    .type-switch { width: 100%; }
  }
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .metric-cards { grid-template-columns: 1fr; }
    .threshold-row { grid-template-columns: 1fr 1fr; }
    .item-body { padding: 10px; }
    .item-head { padding: 10px 12px; }
    .config-pane .segmented { width: 100%; min-width: 0; }
    .wizard-footer { position: static; }
    .proto-bar { display: none; }
    .page-head-actions { width: 100%; }
    .page-head-actions .btn { flex: 1; }
    .step-label { display: none; }
    .step[data-state="active"] .step-label { display: inline; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">A</div><span class="brand-name">Alioth</span></div>
    <nav class="nav">
      <button class="nav-item" type="button"><span class="icon">▦</span>概览</button>
      <button class="nav-item" type="button" aria-expanded="false"><span class="icon">◔</span>告警<span class="chev">›</span></button>
      <button class="nav-item" type="button" aria-expanded="false"><span class="icon">✉</span>通知<span class="chev">›</span></button>
      <button class="nav-item" type="button" aria-expanded="false"><span class="icon">◎</span>探测与可用性<span class="chev">›</span></button>
      <button class="nav-item active" type="button" aria-expanded="true"><span class="icon">☑</span>巡检<span class="chev">›</span></button>
      <div class="nav-sub">
        <button class="nav-item active" type="button">巡检任务</button>
        <button class="nav-item" type="button">报告模板</button>
        <button class="nav-item" type="button">执行记录</button>
      </div>
      <button class="nav-item" type="button" aria-expanded="false"><span class="icon">⬡</span>Kubernetes<span class="chev">›</span></button>
      <button class="nav-item" type="button"><span class="icon">▤</span>边缘</button>
      <button class="nav-item" type="button"><span class="icon">⚙</span>系统管理</button>
    </nav>
    <div class="sidebar-foot">检查项编辑器原型 · 静态数据</div>
  </aside>

  <div class="inset">
    <header class="topbar">
      <button class="icon-btn" type="button" aria-label="收起侧边栏">▥</button>
      <div class="crumb">巡检<span class="muted"> / </span>新建巡检<span class="muted"> / </span>检查项</div>
      <div class="right">
        <button class="icon-btn" type="button" id="theme-toggle" onclick="toggleTheme()" aria-label="切换深浅色">◐</button>
        <button class="tenant-chip" type="button"><span class="badge tone-primary" style="height:18px;padding:0 6px">租户</span>星环科技</button>
        <div class="avatar">H</div>
      </div>

    <main class="content">
      <div class="page-head">
        <div>
          <h1 class="page-title">新建巡检</h1>
          <p class="page-desc">按类型配置每个检查项，保存前可直接测试结果；检查项先进入本地草稿，随计划一起保存。</p>

        <span class="step-sep"></span>
        <div class="step"><span class="num">4</span><span class="step-label">调度与通知</span></div>
      </div>

      <div class="plan-summary">
        <div>
          <div class="p-name">核心业务每日巡检</div>
          <div class="p-meta">每天 09:00 · Asia/Shanghai · 6 个检查项 · 自动投递运维值班组</div>
        </div>
        <span class="grow"></span>
        <span class="badge tone-neutral">本地草稿</span>
      </div>

      <div class="item-accordion" id="items"></div>
      <button class="add-item" type="button" onclick="addItem()">＋ 添加检查项</button>

      <div class="wizard-footer">
        <span class="note">检查项保存后才会进入计划草稿；未保存修改会在切换时提示。</span>
        <button class="btn btn-outline" type="button" onclick="toast('原型演示：回到第 1 步','','info')">上一步</button>
        <button class="btn btn-primary" type="button" onclick="toast('原型演示：进入第 3 步报告','','info')">下一步</button>

</div>

<div class="overlay" id="confirm" hidden>
  <div class="dialog" style="width:min(calc(100% - 2rem),30rem)" role="dialog" aria-modal="true">

<script>
const KIND_META = {
  METRICS_QUERY: { label: "指标查询", icon: '<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>' },
  LOGS_QUERY: { label: "日志查询", icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/>' },
  PROBE_TARGET: { label: "探测目标", icon: '<circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="10"/>' },
  ALERT_EVENTS: { label: "告警事件", icon: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>' },
  NOTE: { label: "静态说明", icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/>' },
};

function baseItem(title, kind, extra = {}) {
  return Object.assign({
    title, kind, source: "", query: "", window: "24h", step: "60s", display: "指标卡 + 表格",
    unit: "s", thresholdOp: ">", thresholdValue: "0.8", thresholdStatus: "警告",
    levels: ["ERROR"], limit: "50", direction: "backward", warnAbove: "100",
    groups: ["核心交易 API", "边缘节点（华东）"], metric: "可用率", availabilityBelow: "99.5",
    alertStatus: "FIRING", alertLevels: ["P1", "P2"], labels: 'service="order"', warnLevels: ["CRITICAL"],
    note: "## 值班建议\n\n- 关注订单服务延迟与边缘节点探测\n- 证书到期纳入专项巡检", queryMode: "promql",
    warnOnDown: true,
    tested: "untested", testMs: 0, summary: "",
  }, extra);
}

let items = [
  baseItem("核心指标概览", "METRICS_QUERY", {
    source: "Prometheus 生产（指标）", query: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="order"}[5m])))',
    tested: "ok", testMs: 182, summary: "指标查询 · Prometheus 生产",
  }),
  baseItem("订单服务延迟", "METRICS_QUERY", {
    source: "VictoriaMetrics 灾备（指标）", query: 'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="order"}[5m])))',
    tested: "ok", testMs: 96, summary: "指标查询 · VictoriaMetrics 灾备",
  }),
  baseItem("网关错误日志", "LOGS_QUERY", {
    source: "Loki 生产（日志）", query: '{app="gateway"} |= "ERROR" | json | level="error"', display: "日志样本",
    tested: "ok", testMs: 74, summary: "日志查询 · Loki 生产", warnAbove: "100",

function markdown(raw) {
  const lines = escapeHTML(raw).split("\n");
  let html = "";
  let inList = false;
  for (const line of lines) {
    const text = line.trim();
    if (!text) { if (inList) { html += "</ul>"; inList = false; } continue; }
    if (text.startsWith("## ")) { if (inList) { html += "</ul>"; inList = false; } html += `<h3>${inline(text.slice(3))}</h3>`; continue; }
    if (text.startsWith("# ")) { if (inList) { html += "</ul>"; inList = false; } html += `<h3>${inline(text.slice(2))}</h3>`; continue; }
    if (text.startsWith("- ")) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(text.slice(2))}</li>`; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    html += `<p>${inline(text)}</p>`;
  }
  if (inList) html += "</ul>";
  return html || '<p class="muted">还没有说明内容。</p>';
}

function inline(text) {
  return text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>");
}

function setField(index, field, value) {
  items[index][field] = value;
  markDirty();
}

function markDirty() {
  dirty = true;
  const footer = document.querySelector(".item-card.open .item-footer .dirty");
  if (footer) {
    footer.classList.remove("clean");
    footer.innerHTML = '<span class="dot"></span>有未保存的修改';
  }
}

function toggleChip(index, field, value) {
  const list = items[index][field];
  const position = list.indexOf(value);
  if (position >= 0) list.splice(position, 1); else list.push(value);
  markDirty();
  render();
}

function toggleGroup(index, group) {
  const list = items[index].groups;
  const position = list.indexOf(group);
  if (position >= 0) list.splice(position, 1); else list.push(group);
  markDirty();
  render();
}

function revealOpen() {
  requestAnimationFrame(() => {
    document.querySelector(".item-card.open")?.scrollIntoView({ block: "start", behavior: "smooth" });
  });
}

function toggleItem(index) {
  if (index === openIndex) {
    guard(() => { openIndex = -1; dirty = false; render(); }, "收起当前检查项会丢弃未保存的修改。");
    return;
  }
  guard(() => { openIndex = index; dirty = false; render(); revealOpen(); }, "切换检查项会丢弃当前项未保存的修改。");
}

function openKind(index) {
  guard(() => { openIndex = index; dirty = false; render(); revealOpen(); }, "切换检查项会丢弃当前项未保存的修改。");
}

function switchKind(index, kind) {
  if (items[index].kind === kind) return;
  guard(() => {
    const item = items[index];
    item.kind = kind;
    item.query = "";
    item.tested = "untested";
    if (kind === "METRICS_QUERY") item.source = "Prometheus 生产（指标）";
    if (kind === "LOGS_QUERY") { item.source = "Loki 生产（日志）"; item.display = "日志样本"; item.query = '{app="gateway"} |= "ERROR"'; }
    if (kind === "PROBE_TARGET") { item.source = ""; item.display = "表格"; }
    if (kind === "ALERT_EVENTS") { item.source = ""; item.display = "表格"; }
    if (kind === "NOTE") { item.source = ""; item.display = "Markdown"; item.query = ""; }
    dirty = true;
    render();
    toast("已切换类型", "不兼容字段已清空，标题与时间窗保留", "info");
  }, "切换类型会清空数据源、查询、目标组和阈值等不兼容字段。");
}

function runTest(index) {
  const item = items[index];
  if ((item.kind === "METRICS_QUERY" || item.kind === "LOGS_QUERY") && !item.query.trim()) {
    item.tested = "failed";
    render();
    toast("测试失败", "查询语句不能为空", "warn");
    return;
  }
  item.tested = "running";
  render();
  clearTimeout(testTimer);
  testTimer = setTimeout(() => {
    item.tested = "ok";
    item.testMs = 60 + Math.floor(Math.random() * 180);
    render();
    toast("测试成功", `${KIND_META[item.kind].label} · ${item.testMs}ms`, "info");
  }, 900);
}

function saveItem(index) {
  const item = items[index];
  if (!item.title.trim()) {
    toast("无法保存", "章节标题不能为空", "warn");
    return;
  }
  dirty = false;
  saved[index] = clone(item);
  openIndex = index;
  render();
  toast("检查项已保存", "已写入计划草稿，尚未提交整份计划", "info");
}

function restoreItem(index) {
  if (!saved[index]) return;
  items[index] = clone(saved[index]);
  dirty = false;
  render();
  toast("已还原", "恢复到上次保存到草稿的内容", "info");
}

function addItem() {
  guard(() => {
    items.push(baseItem("新检查项", "METRICS_QUERY", { source: "Prometheus 生产（指标）", summary: "指标查询 · Prometheus 生产" }));
    saved.push(clone(items[items.length - 1]));
    openIndex = items.length - 1;
    dirty = false;
    render();
    revealOpen();
    toast("已添加检查项", "先选择类型并填写标题", "info");
  }, "添加检查项会丢弃当前项未保存的修改。");
}

function guard(action, text) {
  if (!dirty) { action(); return; }
  pendingAction = action;
  els.confirmText.textContent = text;
  els.confirm.hidden = false;
}

function closeConfirm() {
  els.confirm.hidden = true;
  pendingAction = null;
}

els.confirmOk.addEventListener("click", () => {
  const action = pendingAction;
  dirty = false;
  els.confirm.hidden = true;
  pendingAction = null;
  if (action) action();
});

function toast(title, sub, kind) {
  const node = document.createElement("div");
  node.className = `toast ${kind || ""}`;
  node.innerHTML = `<span class="ti">${kind === "warn" ? "!" : "✓"}</span><span class="tt"><b>${escapeHTML(title)}</b>${sub ? `<span>${escapeHTML(sub)}</span>` : ""}</span>`;
  els.toasts.appendChild(node);
  setTimeout(() => node.remove(), 3600);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
}
function escapeAttr(value) { return escapeHTML(value); }

function toggleTheme() {
  const dark = document.documentElement.classList.toggle("dark");
  document.getElementById("proto-theme").textContent = dark ? "浅色" : "深色";
}

render();
</script>
</body>
</html>
