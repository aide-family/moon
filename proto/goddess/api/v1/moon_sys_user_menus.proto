syntax = "proto3";

package goddess.api.v1;

import "google/api/annotations.proto";
import "buf/validate/validate.proto";
import "goddess/api/v1/moon_sys_menus.proto";

option go_package = "github.com/aide-family/goddess/pkg/api/v1;v1";
option java_multiple_files = true;
option java_package = "goddess.api.v1";

// SysUserMenu 系统用户菜单直授服务
service SysUserMenu {
    // ListUserMenu 查询用户直授的系统菜单列表
    rpc ListUserMenu(ListUserMenuRequest) returns (ListUserMenuReply) {
        option (google.api.http) = {
            get: "/v1/sys/users/{userUID}/menus"
        };
    }
    // GrantUserMenus 直授系统菜单给用户
    rpc GrantUserMenus(GrantUserMenusRequest) returns (GrantUserMenusReply) {
        option (google.api.http) = {
            post: "/v1/sys/users/{userUID}/menus"
            body: "*"
        };
    }
    // RevokeUserMenus 撤销直授系统菜单
    rpc RevokeUserMenus(RevokeUserMenusRequest) returns (RevokeUserMenusReply) {
        option (google.api.http) = {
            delete: "/v1/sys/users/{userUID}/menus"
        };
    }
}

// UserMenuItem 用户直授菜单项
message UserMenuItem {
    string menuCode       = 1;
    string parentMenuCode = 2;
    string menuName       = 3;
    int32 menuStatus      = 4;
}

// ListUserMenuRequest 查询用户直授菜单请求
message ListUserMenuRequest {
    // userUID 用户 UID
    int64 userUID = 1 [(buf.validate.field).required = true];
    // asTree 是否返回树形结构
    bool asTree = 2;
    // menuStatus 菜单状态筛选（可选）
    optional int32 menuStatus = 3;
}

// ListUserMenuReply 查询用户直授菜单响应
message ListUserMenuReply {
    // items 扁平列表（asTree=false 时返回）
    repeated UserMenuItem items = 1;
    // tree 树形结构（asTree=true 时返回）
    repeated SysMenuTreeItem tree = 2;
}

// GrantUserMenusRequest 直授系统菜单请求
message GrantUserMenusRequest {
    // userUID 用户 UID
    int64 userUID = 1 [(buf.validate.field).required = true];
    // menuCodes 菜单编码列表
    repeated string menuCodes = 2 [(buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "menuCodes must not be empty",
    }];
    // autoAddAncestors 是否自动补全祖先菜单
    bool autoAddAncestors = 3;
}

// GrantUserMenusReply 直授系统菜单响应
message GrantUserMenusReply {
    int32 grantedCount = 1;
    repeated string autoAddedMenuCodes = 2;
}

// RevokeUserMenusRequest 撤销直授菜单请求
message RevokeUserMenusRequest {
    // userUID 用户 UID
    int64 userUID = 1 [(buf.validate.field).required = true];
    // menuCodes 菜单编码列表
    repeated string menuCodes = 2 [(buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "menuCodes must not be empty",
    }];
    // cascadeDescendants 是否级联撤销子孙菜单
    bool cascadeDescendants = 3;
}

// RevokeUserMenusReply 撤销直授菜单响应
message RevokeUserMenusReply {
    int32 revokedCount = 1;
    repeated string cascadeRevokedMenuCodes = 2;
}
