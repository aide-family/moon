syntax = "proto3";

package goddess.api.v1;

import "google/api/annotations.proto";
import "buf/validate/validate.proto";
import "goddess/api/v1/moon_sys_role_functions.proto";

option go_package = "github.com/aide-family/goddess/pkg/api/v1;v1";
option java_multiple_files = true;
option java_package = "goddess.api.v1";

// NmspacesRoleFunction 租户角色功能权限服务
service NmspacesRoleFunction {
    // ListNmspacesRoleFunction 分页查询租户角色拥有的功能列表
    rpc ListNmspacesRoleFunction(ListNmspacesRoleFunctionRequest) returns (ListNmspacesRoleFunctionReply) {
        option (google.api.http) = {
            get: "/v1/nmspaces/roles/{roleCode}/functions"
        };
    }
    // GrantNmspacesRoleFunctions 授予租户角色功能
    rpc GrantNmspacesRoleFunctions(GrantNmspacesRoleFunctionsRequest) returns (GrantNmspacesRoleFunctionsReply) {
        option (google.api.http) = {
            post: "/v1/nmspaces/roles/{roleCode}/functions"
            body: "*"
        };
    }
    // RevokeNmspacesRoleFunctions 撤销租户角色功能
    rpc RevokeNmspacesRoleFunctions(RevokeNmspacesRoleFunctionsRequest) returns (RevokeNmspacesRoleFunctionsReply) {
        option (google.api.http) = {
            delete: "/v1/nmspaces/roles/{roleCode}/functions"
        };
    }
}

// NmspacesRoleFunctionItem 租户角色功能项
message NmspacesRoleFunctionItem {
    string menuCode          = 1;
    string functionCode      = 2;
    string functionName      = 3;
    int32 functionSortOrder  = 4;
    int32 functionStatus     = 5;
    int64 creator            = 6;
    string createdAt         = 7;
}

// ListNmspacesRoleFunctionRequest 查询租户角色功能列表请求
message ListNmspacesRoleFunctionRequest {
    // roleCode 角色编码
    string roleCode = 1 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "roleCode is required",
    }];
    // menuCode 按菜单编码过滤（可选）
    string menuCode = 2;
    // page 页码
    int32 page = 3 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this >= 1",
        message: "page must be greater than or equal to 1",
    }];
    // pageSize 每页数量
    int32 pageSize = 4 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this >= 1 && this <= 200",
        message: "pageSize must be between 1 and 200",
    }];
}

// ListNmspacesRoleFunctionReply 查询租户角色功能列表响应
message ListNmspacesRoleFunctionReply {
    repeated NmspacesRoleFunctionItem items = 1;
    int64 total    = 2;
    int32 page     = 3;
    int32 pageSize = 4;
}

// GrantNmspacesRoleFunctionsRequest 授予租户角色功能请求
message GrantNmspacesRoleFunctionsRequest {
    // roleCode 角色编码
    string roleCode = 1 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "roleCode is required",
    }];
    // functionKeys 功能键列表
    repeated FunctionKey functionKeys = 2 [(buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "functionKeys must not be empty",
    }];
    // autoGrantMenu 是否自动追加对应菜单授权
    bool autoGrantMenu = 3;
}

// GrantNmspacesRoleFunctionsReply 授予租户角色功能响应
message GrantNmspacesRoleFunctionsReply {
    int32 grantedCount = 1;
    repeated string autoGrantedMenuCodes = 2;
}

// RevokeNmspacesRoleFunctionsRequest 撤销租户角色功能请求
message RevokeNmspacesRoleFunctionsRequest {
    // roleCode 角色编码
    string roleCode = 1 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "roleCode is required",
    }];
    // functionKeys 功能键列表
    repeated FunctionKey functionKeys = 2 [(buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "functionKeys must not be empty",
    }];
    // autoRevokeMenu 是否自动撤销无功能的菜单授权
    bool autoRevokeMenu = 3;
}

// RevokeNmspacesRoleFunctionsReply 撤销租户角色功能响应
message RevokeNmspacesRoleFunctionsReply {
    int32 revokedCount = 1;
    repeated string autoRevokedMenuCodes = 2;
}
