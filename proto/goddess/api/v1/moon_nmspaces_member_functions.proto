syntax = "proto3";

package goddess.api.v1;

import "google/api/annotations.proto";
import "buf/validate/validate.proto";
import "goddess/api/v1/moon_sys_role_functions.proto";

option go_package = "github.com/aide-family/goddess/pkg/api/v1;v1";
option java_multiple_files = true;
option java_package = "goddess.api.v1";

// NmspacesMemberFunction 租户成员功能直授服务
service NmspacesMemberFunction {
    // ListNmspacesMemberFunction 分页查询租户成员的直授功能列表
    rpc ListNmspacesMemberFunction(ListNmspacesMemberFunctionRequest) returns (ListNmspacesMemberFunctionReply) {
        option (google.api.http) = {
            get: "/v1/nmspaces/members/{memberUID}/functions"
        };
    }
    // GrantNmspacesMemberFunctions 直授租户功能给成员
    rpc GrantNmspacesMemberFunctions(GrantNmspacesMemberFunctionsRequest) returns (GrantNmspacesMemberFunctionsReply) {
        option (google.api.http) = {
            post: "/v1/nmspaces/members/{memberUID}/functions"
            body: "*"
        };
    }
    // RevokeNmspacesMemberFunctions 撤销直授租户功能
    rpc RevokeNmspacesMemberFunctions(RevokeNmspacesMemberFunctionsRequest) returns (RevokeNmspacesMemberFunctionsReply) {
        option (google.api.http) = {
            delete: "/v1/nmspaces/members/{memberUID}/functions"
        };
    }
}

// NmspacesMemberFunctionItem 租户成员直授功能项
message NmspacesMemberFunctionItem {
    string menuCode          = 1;
    string functionCode      = 2;
    string functionName      = 3;
    int32 functionSortOrder  = 4;
    int32 functionStatus     = 5;
    int64 creator            = 6;
    string createdAt         = 7;
}

// ListNmspacesMemberFunctionRequest 查询租户成员直授功能请求
message ListNmspacesMemberFunctionRequest {
    // memberUID 成员 UID
    string memberUID = 1 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "memberUID is required",
    }];
    // menuCode 按菜单编码过滤（可选）
    string menuCode = 2;
    // page 页码
    int32 page = 3 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this >= 1",
        message: "page must be greater than or equal to 1",
    }];
    // pageSize 每页数量
    int32 pageSize = 4 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this >= 1 && this <= 200",
        message: "pageSize must be between 1 and 200",
    }];
}

// ListNmspacesMemberFunctionReply 查询租户成员直授功能响应
message ListNmspacesMemberFunctionReply {
    repeated NmspacesMemberFunctionItem items = 1;
    int64 total    = 2;
    int32 page     = 3;
    int32 pageSize = 4;
}

// GrantNmspacesMemberFunctionsRequest 直授租户功能请求
message GrantNmspacesMemberFunctionsRequest {
    // memberUID 成员 UID
    string memberUID = 1 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "memberUID is required",
    }];
    // functionKeys 功能键列表
    repeated FunctionKey functionKeys = 2 [(buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "functionKeys must not be empty",
    }];
    // autoGrantMenu 是否自动追加对应菜单授权
    bool autoGrantMenu = 3;
}

// GrantNmspacesMemberFunctionsReply 直授租户功能响应
message GrantNmspacesMemberFunctionsReply {
    int32 grantedCount = 1;
    repeated string autoGrantedMenuCodes = 2;
}

// RevokeNmspacesMemberFunctionsRequest 撤销直授租户功能请求
message RevokeNmspacesMemberFunctionsRequest {
    // memberUID 成员 UID
    string memberUID = 1 [(buf.validate.field).required = true, (buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "memberUID is required",
    }];
    // functionKeys 功能键列表
    repeated FunctionKey functionKeys = 2 [(buf.validate.field).cel = {
        expression: "this.size() > 0",
        message: "functionKeys must not be empty",
    }];
    // autoRevokeMenu 是否自动撤销无功能的菜单授权
    bool autoRevokeMenu = 3;
}

// RevokeNmspacesMemberFunctionsReply 撤销直授租户功能响应
message RevokeNmspacesMemberFunctionsReply {
    int32 revokedCount = 1;
    repeated string autoRevokedMenuCodes = 2;
}
