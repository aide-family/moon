services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alioth
      POSTGRES_PASSWORD: alioth
      POSTGRES_DB: alioth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alioth -d alioth"]
      interval: 2s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
