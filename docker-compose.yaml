services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alioth
      POSTGRES_PASSWORD: alioth
      POSTGRES_DB: alioth
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alioth -d alioth"]
      interval: 2s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
  alkaid:
    profiles: ["alkaid"]
    build:
      context: ./deploy/alkaid
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./deploy/alkaid/alkaid.env
    environment:
      ALKAID_ALIOTH_GRPC_ADDR: host.docker.internal:9000
    volumes:
      - ./bin/alkaid-linux:/usr/local/bin/alkaid:ro
      - ./deploy/alkaid/alkaid.yaml:/etc/alioth/alkaid.yaml:ro
    ports:
      - "2222:22"
