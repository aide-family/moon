name: alioth

# 本地全栈：docker compose up 即可获得 PostgreSQL、Redis、邮件沙箱、Prometheus、Loki、一次迁移，
# 以及 alioth / megrez / merak / web。数据保存在命名卷里，down 不会丢。
x-service-env: &service-env
  # 根目录 .env 与这些默认值一一对应：留空或未设置时保持本地开发行为。
  ALIOTH_DATABASE_URL: ${ALIOTH_DATABASE_URL:-postgres://alioth:alioth@postgres:5432/alioth?sslmode=disable}
  ALIOTH_REDIS_ADDR: ${ALIOTH_REDIS_ADDR:-redis:6379}
  ALIOTH_REDIS_PASSWORD: ${ALIOTH_REDIS_PASSWORD:-}
  ALIOTH_JWT_SECRET: ${ALIOTH_JWT_SECRET:-dev-only-change-me}
  ALIOTH_ENCRYPT_KEY: ${ALIOTH_ENCRYPT_KEY:-dev-only-encrypt-key}
  MEGREZ_SERVICE_KEY: ${MEGREZ_SERVICE_KEY:-sk-megrez-dev}
  MERAK_SERVICE_KEY: ${MERAK_SERVICE_KEY:-sk-merak-dev}
  ALIOTH_WEB_URL: ${ALIOTH_WEB_URL:-http://127.0.0.1:8080}
  # 本地默认投递到 compose 自带的 Mailpit；.env 里填真实 SMTP 时自动改投。
  ALIOTH_SMTP_HOST: ${ALIOTH_SMTP_HOST:-mailpit}
  ALIOTH_SMTP_PORT: ${ALIOTH_SMTP_PORT:-1025}
  ALIOTH_SMTP_USERNAME: ${ALIOTH_SMTP_USERNAME:-}
  ALIOTH_SMTP_PASSWORD: ${ALIOTH_SMTP_PASSWORD:-}
  ALIOTH_SMTP_FROM: ${ALIOTH_SMTP_FROM:-alioth@localhost}
  ALIOTH_HISTORY_DATABASE_PREFIX: ${ALIOTH_HISTORY_DATABASE_PREFIX:-alioth_alert_}
  ALIOTH_HISTORY_TABLE_PREFIX: ${ALIOTH_HISTORY_TABLE_PREFIX:-alert_events_}
  ALIOTH_HISTORY_MESSAGE_TABLE_PREFIX: ${ALIOTH_HISTORY_MESSAGE_TABLE_PREFIX:-message_logs_}
  # 第三方登录：配置客户端后登录页才显示 GitHub / Gitee 入口，回调地址为 <web_url>/auth/callback。
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITEE_CLIENT_ID: ${GITEE_CLIENT_ID:-}
  GITEE_CLIENT_SECRET: ${GITEE_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alioth
      POSTGRES_PASSWORD: alioth
      POSTGRES_DB: alioth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alioth -d alioth"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/loki/config.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    restart: unless-stopped

  # VictoriaLogs 单机版。日志查询和告警评测共用 /select/logsql/* 接口。
  victorialogs:
    image: victoriametrics/victoria-logs:v1.46.0
    command:
      - -storageDataPath=/vlogs
      - -httpListenAddr=:9428
      - -retentionPeriod=7d
    ports:
      - "9428:9428"
    volumes:
      - vlogsdata:/vlogs
    restart: unless-stopped

  # Opt-in synthetic logs; leave the normal local stack free of demo noise.
  loki-demo-logs:
    profiles: ["loki-demo"]
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "/scripts/loki-demo-logs.sh"]
    environment:
      LOKI_URL: http://loki:3100
      LOKI_DEMO_INTERVAL: "5"
    volumes:
      - ./scripts/loki-demo-logs.sh:/scripts/loki-demo-logs.sh:ro
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  # Opt-in synthetic VictoriaLogs data, mirroring the Loki demo.
  vlogs-demo-logs:
    profiles: ["vlogs-demo"]
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "/scripts/vlogs-demo-logs.sh"]
    environment:
      VLOGS_URL: http://victorialogs:9428
      VLOGS_DEMO_INTERVAL: "5"
    volumes:
      - ./scripts/vlogs-demo-logs.sh:/scripts/vlogs-demo-logs.sh:ro
    depends_on:
      victorialogs:
        condition: service_started
    restart: unless-stopped

  # 一次性迁移：先于四个服务完成，避免新代码遇到旧 schema。
  migrate:
    build:
      context: .
      dockerfile: deploy/alioth/Dockerfile
    image: ${IMAGE_PREFIX:-alioth}/alioth:${VERSION:-dev}
    command: ["migrate", "--conf", "/app/configs/config.yaml"]
    environment: *service-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  alioth:
    build:
      context: .
      dockerfile: deploy/alioth/Dockerfile
    image: ${IMAGE_PREFIX:-alioth}/alioth:${VERSION:-dev}
    environment:
      <<: *service-env
      ALIOTH_HTTP_ADDR: 0.0.0.0:8000
      ALIOTH_GRPC_ADDR: 0.0.0.0:9000
    ports:
      - "8000:8000"
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  megrez:
    build:
      context: .
      dockerfile: deploy/megrez/Dockerfile
    image: ${IMAGE_PREFIX:-alioth}/megrez:${VERSION:-dev}
    environment:
      MEGREZ_HTTP_ADDR: 0.0.0.0:8001
      ALIOTH_GRPC_ADDR: alioth:9000
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MEGREZ_SERVICE_KEY: ${MEGREZ_SERVICE_KEY:-sk-megrez-dev}
    depends_on:
      alioth:
        condition: service_started
      redis:
        condition: service_healthy

  merak:
    build:
      context: .
      dockerfile: deploy/merak/Dockerfile
    image: ${IMAGE_PREFIX:-alioth}/merak:${VERSION:-dev}
    environment:
      MERAK_HTTP_ADDR: 0.0.0.0:8002
      ALIOTH_GRPC_ADDR: alioth:9000
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MERAK_SERVICE_KEY: ${MERAK_SERVICE_KEY:-sk-merak-dev}
    depends_on:
      alioth:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    image: ${IMAGE_PREFIX:-alioth}/web:${VERSION:-dev}
    ports:
      - "8080:8080"
    depends_on:
      alioth:
        condition: service_started

  # 把本机当作被管机器时启用：docker compose --profile alkaid up -d alkaid
  alkaid:
    profiles: ["alkaid"]
    build:
      context: .
      dockerfile: deploy/alkaid/Dockerfile
    image: ${IMAGE_PREFIX:-alioth}/alkaid:${VERSION:-dev}
    environment:
      ALKAID_AGENT_TOKEN: ${ALKAID_AGENT_TOKEN:-}
      ALKAID_ALIOTH_GRPC_ADDR: alioth:9000
    ports:
      - "2222:22"
    depends_on:
      alioth:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  lokidata:
  vlogsdata:
