name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: |
            pkg/go.sum
            api/go.sum
            app/alioth/go.sum
            app/megrez/go.sum
            app/merak/go.sum
            app/alkaid/go.sum
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
      - name: buf deps
        run: buf dep update
      # gofmt + buf lint；与本地 `make lint` 同一条命令，避免两套真相。
      - name: lint
        run: make lint

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alioth
          POSTGRES_PASSWORD: alioth
          POSTGRES_DB: alioth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alioth -d alioth_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: |
            pkg/go.sum
            api/go.sum
            app/alioth/go.sum
            app/megrez/go.sum
            app/merak/go.sum
            app/alkaid/go.sum
      - name: vet
        run: make vet
      # -race 才能暴露多副本/并发状态机问题（通知回写、验证码消费）。
      - name: test
        env:
          ALIOTH_TEST_DSN: postgres://alioth:alioth@127.0.0.1:5432/alioth_test?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
        run: make test-race

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: |
            pkg/go.sum
            api/go.sum
            app/alioth/go.sum
            app/megrez/go.sum
            app/merak/go.sum
            app/alkaid/go.sum
      # 只构建 Go 服务；web 在下一个 job。确保 -ldflags 注入的版本戳不会让构建失败。
      - name: build binaries
        run: make build-alioth build-megrez build-merak build-alkaid VERSION=${GITHUB_SHA::12}

  # release.yml 只在 main 与 v* tag 上打摇光包；这里在 PR 上先验证 spec 和打包脚本
  # 两个架构都还能出 RPM，免得坏掉的 spec 到发版那天才发现。
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/alkaid/go.mod
          cache-dependency-path: |
            pkg/go.sum
            api/go.sum
            app/alkaid/go.sum
      - name: 安装 rpmbuild
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          rpmbuild --version
      - name: 打包 tar.gz 与 RPM
        env:
          RPM: "1"
        run: make package-alkaid VERSION="sha-${GITHUB_SHA::12}" OUT="${PWD}/dist"
      - name: 列出产物
        run: |
          ls -l dist
          cat dist/SHA256SUMS

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run lint --prefix web
      - run: npm run build --prefix web

  # PR 上验证五个 Dockerfile 可构建；推送分支/tag 的镜像构建与推送由 release.yml 负责，
  # 这里再跑一遍只会重复烧 CI 时间。
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build alioth image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/alioth/Dockerfile
          push: false
          build-args: |
            VERSION=${{ github.sha }}
      - name: build megrez image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/megrez/Dockerfile
          push: false
          build-args: |
            VERSION=${{ github.sha }}
      - name: build merak image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/merak/Dockerfile
          push: false
          build-args: |
            VERSION=${{ github.sha }}
      - name: build alkaid image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/alkaid/Dockerfile
          push: false
          build-args: |
            VERSION=${{ github.sha }}
      - name: build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: false
