name: release

# 在 main 与 v* tag 上构建项目镜像并发布产物：
#   - 镜像推送到 GHCR，带 org.opencontainers.image.source 标签，包因此关联本仓库；
#   - tag 上额外把摇光（alkaid）的二进制 + systemd 一键部署包作为 Release 资产发布，
#     并记录产物来源证明（attestation），下载后可校验。
# PR 上的 Dockerfile 验证仍然留在 ci.yml，避免同一份镜像构建两遍。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 覆盖版本号（默认：tag 名；main 上是 sha-<12 位>）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  # tag 发布 amd64 + arm64；main 只出 amd64，省 QEMU 仿真时间。
  PLATFORMS: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

jobs:
  version:
    name: 版本与发布判定
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
      # GHCR 镜像名必须全小写；namespace 取小写后的 owner/repo，再按服务分下一级。
      # 包名跟随仓库名，仓库改名（Alioth → moon）或同一份代码推到两个仓库时都不会撞包。
      image_prefix: ${{ steps.version.outputs.image_prefix }}
    steps:
      - id: version
        name: 计算版本戳
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          is_release=false
          case "${GITHUB_REF}" in
            refs/tags/v*) is_release=true ;;
          esac
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION}"
          elif [ "${is_release}" = "true" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="sha-${GITHUB_SHA:0:12}"
          fi
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          # 镜像包跟着仓库名走：包只能由关联的仓库写入，写死 alioth 会让 moon 仓库
          # 在 push 时拿到 permission_denied: write_package。
          repo="$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${version}"
            echo "is_release=${is_release}"
            echo "image_prefix=ghcr.io/${owner}/${repo}"
          } >> "${GITHUB_OUTPUT}"
          echo "版本戳：\`${version}\`，镜像前缀 \`ghcr.io/${owner}/${repo}\`" >> "${GITHUB_STEP_SUMMARY}"

  images:
    name: 镜像 ${{ matrix.service }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [alioth, megrez, merak, alkaid, web]
    steps:
      - uses: actions/checkout@v4
      # arm64 走 QEMU 仿真，只在 tag 发布时启用。
      - uses: docker/setup-qemu-action@v3
        if: needs.version.outputs.is_release == 'true'
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: 生成 tag 与 OCI 标签
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.version.outputs.image_prefix }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ needs.version.outputs.version }}
            type=ref,event=branch
            # 预发布 tag（v1.2.3-rc1）不覆盖 latest。
            type=raw,value=latest,enable=${{ needs.version.outputs.is_release == 'true' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.title=Alioth ${{ matrix.service }}
            org.opencontainers.image.description=Alioth 运维平台 ${{ matrix.service }} 服务
      - id: build
        name: 构建并推送 ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.service }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建来源证明与 SBOM 以 OCI attestation 形式随镜像推送。
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          # 多架构镜像的 cache 很大，只有 min 不会把 GHA cache 撑爆。
          cache-to: type=gha,mode=min,scope=${{ matrix.service }}
      - name: 记录镜像 digest
        if: steps.build.outputs.digest != ''
        run: |
          {
            echo "### ${{ needs.version.outputs.image_prefix }}/${{ matrix.service }}"
            echo
            echo "| 服务 | 镜像 | digest |"
            echo "| --- | --- | --- |"
            echo "| ${{ matrix.service }} | \`${{ needs.version.outputs.image_prefix }}/${{ matrix.service }}\` | \`${{ steps.build.outputs.digest }}\` |"
          } >> "${GITHUB_STEP_SUMMARY}"

  alkaid-package:
    name: 摇光部署包（二进制 + systemd + RPM）
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/alkaid/go.mod
          cache-dependency-path: |
            pkg/go.sum
            api/go.sum
            app/alkaid/go.sum
      # rpmbuild 由 Ubuntu 的 rpm 包提供（Fedora/openEuler 叫 rpm-build）。
      - name: 安装 rpmbuild
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          rpmbuild --version
      # 与本地 `make package-alkaid` 同一条命令，CI 和手工打包不会长出两套真相。
      # RPM=1：缺 rpmbuild 时直接失败，不让 Release 悄悄只发 tar.gz。
      - name: 打包 linux/amd64 与 linux/arm64（tar.gz + RPM）
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RPM: "1"
        run: make package-alkaid VERSION="${VERSION}" OUT="${PWD}/dist"
      # dist/* 会被整个上传到 Release，先确认 RPM 真有两个架构，而不是被静默跳过。
      - name: 校验 RPM 产物
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(dist/*.rpm)
          if [ "${#rpms[@]}" -ne 2 ]; then
            echo "期望 2 个 RPM（x86_64 + aarch64），实际 ${#rpms[@]} 个" >&2
            ls -l dist >&2
            exit 1
          fi
          for rpm in "${rpms[@]}"; do
            echo "$(basename "${rpm}") → $(rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}' "${rpm}")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: alkaid-dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [version, images, alkaid-package]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      IMAGE_PREFIX: ${{ needs.version.outputs.image_prefix }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alkaid-dist
          path: dist
      - name: 为全部产物附加来源证明
        uses: actions/attest-build-provenance@v2
        # 私有仓库未启用 Artifact Attestations 时该步骤不可用；发布内容不依赖它。
        continue-on-error: true
        with:
          subject-path: dist/*
      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          notes="$(mktemp)"
          {
            echo "## 镜像（GHCR）"
            echo
            echo "| 服务 | 镜像 |"
            echo "| --- | --- |"
            for service in alioth megrez merak alkaid web; do
              echo "| ${service} | \`${IMAGE_PREFIX}/${service}:${VERSION}\` |"
            done
            echo
            echo "镜像带 \`org.opencontainers.image.source\` 标签，已在 GHCR 关联本仓库；来源证明与 SBOM 随镜像推送。"
            echo
            echo "## 摇光（alkaid）二进制、systemd 部署包与 RPM"
            echo
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`alkaid_${VERSION}_linux_amd64\`、\`alkaid_${VERSION}_linux_arm64\` | 裸二进制，自带 systemd 单元时用 |"
            echo "| \`alkaid_${VERSION}_linux_amd64.tar.gz\`、\`alkaid_${VERSION}_linux_arm64.tar.gz\` | 二进制 + \`alkaid.service\` + \`alkaid.yaml\` + \`alkaid.env.example\` + \`install.sh\` |"
            for rpm in dist/*.rpm; do
              echo "| \`$(basename "${rpm}")\` | RPM：二进制 + systemd 单元 + 配置模板，升级保留现场配置 |"
            done
            echo "| \`SHA256SUMS\` | 下载后先校验 |"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS        # macOS 用 shasum -a 256 -c SHA256SUMS"
            echo
            echo "# RPM（RHEL / openEuler；arm64 换成 aarch64 包）"
            echo "sudo dnf install ./alkaid-*.x86_64.rpm"
            echo "sudoedit /etc/alioth/alkaid.env      # 填 ALKAID_AGENT_TOKEN"
            echo "sudo systemctl restart alkaid"
            echo
            echo "# tar.gz + install.sh"
            echo "tar -xzf alkaid_${VERSION}_linux_amd64.tar.gz"
            echo "cd alkaid_${VERSION}_linux_amd64 && sudo ./install.sh"
            echo '```'
            echo
            echo "手工安装步骤与配置说明见 [deploy/alkaid/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/deploy/alkaid/README.md)。"
          } > "${notes}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${GITHUB_REF_NAME}" --notes-file "${notes}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "${notes}"
          fi
