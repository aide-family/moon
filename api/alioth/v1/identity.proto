message MemberInviteItem {
  // 标识。
  string uid = 1;
  // 租户标识。
  string namespace_uid = 2 [json_name = "namespaceUid"];
  // 租户名称。
  string namespace_name = 3 [json_name = "namespaceName"];
  // 被邀请邮箱。
  string email = 4;
  // 角色标识。
  string role_uid = 5 [json_name = "roleUid"];
  // 角色名称。
  string role_name = 6 [json_name = "roleName"];
  // 邀请人名称。
  string inviter_name = 7 [json_name = "inviterName"];
  // 状态：PENDING、ACCEPTED、DECLINED、REVOKED、EXPIRED。
  string status = 8;
  // 过期时间，Unix 秒。
  int64 expires_at = 9 [json_name = "expiresAt"];
  // 创建时间，Unix 秒。
  int64 created_at = 10 [json_name = "createdAt"];
  // 邀请发出时邮箱是否已注册。
  bool registered = 11;
}

