message DeleteFeaturePackageResponse {}

// 读取租户功能的参数。
message GetNamespaceFeaturesRequest {
  // 租户标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 租户的能力开通情况。有效能力 = 套餐能力 + 租户额外能力（只增不减）。
message GetNamespaceFeaturesResponse {
  // 当前套餐标识。
  string package_uid = 1 [json_name = "packageUid"];
  // 当前套餐名称。
  string package_name = 2 [json_name = "packageName"];
  // 目标有效能力编码列表。
  repeated string features = 3;
  // 套餐自带的能力编码列表。
  repeated string package_features = 4 [json_name = "packageFeatures"];
  // 授权到期时间，Unix 秒。0 表示永久。
  int64 expires_at = 5 [json_name = "expiresAt"];
  // 授权是否已过期。已过期时租户实际能力为空。
  bool expired = 6;
  // 租户额外增加的能力编码列表（套餐能力之外）。
  repeated string extra_features = 7 [json_name = "extraFeatures"];
  // 套餐的授权时长（天），0 表示永久。
  int32 duration_days = 8 [json_name = "durationDays"];
}

// 设置租户能力的参数。features 是目标有效能力，服务端换算相对套餐的差异。
message UpdateNamespaceFeaturesRequest {
  // 租户标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  // 目标套餐标识。
  string package_uid = 2 [json_name = "packageUid", (buf.validate.field).string.min_len = 1];
  // 目标有效能力编码列表，必须包含套餐的全部能力。
  repeated string features = 3;
  // 授权到期时间，Unix 秒。0 表示按套餐时长计算，仍为 0 则永久。
  int64 expires_at = 4 [json_name = "expiresAt", (buf.validate.field).int64.gte = 0];
}

// 设置后的租户能力开通情况。
message UpdateNamespaceFeaturesResponse {
  // 当前套餐标识。
  string package_uid = 1 [json_name = "packageUid"];
  // 当前套餐名称。
  string package_name = 2 [json_name = "packageName"];
  // 目标有效能力编码列表。
  repeated string features = 3;
  // 套餐自带的能力编码列表。
  repeated string package_features = 4 [json_name = "packageFeatures"];
  // 授权到期时间，Unix 秒。0 表示永久。
  int64 expires_at = 5 [json_name = "expiresAt"];
  // 授权是否已过期。已过期时租户实际能力为空。
  bool expired = 6;
  // 租户额外增加的能力编码列表（套餐能力之外）。
  repeated string extra_features = 7 [json_name = "extraFeatures"];
  // 套餐的授权时长（天），0 表示永久。
  int32 duration_days = 8 [json_name = "durationDays"];
}
