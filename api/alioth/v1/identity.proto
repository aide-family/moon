syntax = "proto3";

package alioth.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/aide-family/moon/api/alioth/v1;v1";

// 图形验证码。
service CaptchaService {
  // 获取数学计算图形验证码。算式只出现在图片里，答案不回传明文。
  rpc GetCaptcha(GetCaptchaRequest) returns (GetCaptchaResponse) {
    option (google.api.http) = {get: "/v1/captcha"};
  }
}

// 注册和登录。全部走邮箱验证码，没有密码。
service AuthService {
  // 向未注册邮箱发送注册验证码。发码前要先通过图形验证码。
  rpc SendRegisterEmailCode(SendRegisterEmailCodeRequest) returns (SendRegisterEmailCodeResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register/code"
      body: "*"
    };
  }
  // 用邮箱、邮箱验证码和图形验证码注册，成功后返回会话。
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }
  // 向已注册邮箱发送登录验证码。发码前要先通过图形验证码。
  rpc SendEmailLoginCode(SendEmailLoginCodeRequest) returns (SendEmailLoginCodeResponse) {
    option (google.api.http) = {
      post: "/v1/auth/email/login/code"
      body: "*"
    };
  }
  // 用邮箱验证码和图形验证码登录。邮箱验证码只能使用一次。
  rpc EmailLogin(EmailLoginRequest) returns (EmailLoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/email/login"
      body: "*"
    };
  }
  // 列出已经配置客户端的第三方登录来源和授权地址。
  rpc ListOAuth2Providers(ListOAuth2ProvidersRequest) returns (ListOAuth2ProvidersResponse) {
    option (google.api.http) = {
      post: "/v1/auth/oauth2/providers"
      body: "*"
    };
  }
  // 用第三方授权码登录。第三方没有可用邮箱时返回待绑定凭证，前端引导用户补充并验证邮箱。
  rpc OAuth2Login(OAuth2LoginRequest) returns (OAuth2LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/oauth2/login"
      body: "*"
    };
  }
  // 给待绑定的第三方账号发送邮箱验证码。bind_token 来自 OAuth2Login 的待绑定响应，
  // 发码前先通过图形验证码，同一邮箱 60 秒内只能发一次。
  rpc SendOAuthBindEmailCode(SendOAuthBindEmailCodeRequest) returns (SendOAuthBindEmailCodeResponse) {
    option (google.api.http) = {
      post: "/v1/auth/oauth2/bind/code"
      body: "*"
    };
  }
  // 校验邮箱验证码，把第三方身份绑定到该邮箱并返回登录会话。
  // 邮箱已经属于本地账号时直接并入该账号；验证通过前不签发令牌。
  rpc BindOAuthEmail(BindOAuthEmailRequest) returns (BindOAuthEmailResponse) {
    option (google.api.http) = {
      post: "/v1/auth/oauth2/bind"
      body: "*"
    };
  }
}

// 当前登录用户的资料、租户和令牌。
service SelfService {
  // 获取当前登录用户的资料。
  rpc GetSelfInfo(GetSelfInfoRequest) returns (GetSelfInfoResponse) {
    option (google.api.http) = {get: "/v1/self/info"};
  }
  // 列出当前用户加入的租户。
  rpc ListSelfNamespaces(ListSelfNamespacesRequest) returns (ListSelfNamespacesResponse) {
    option (google.api.http) = {get: "/v1/self/namespaces"};
  }
  // 用刷新令牌换取新的访问令牌。
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {get: "/v1/self/refresh-token"};
  }
  // 给当前用户要换绑的新邮箱发送验证码。先通过图形验证码，同一邮箱 60 秒内只能发一次。
  rpc SendSelfChangeEmailCode(SendSelfChangeEmailCodeRequest) returns (SendSelfChangeEmailCodeResponse) {
    option (google.api.http) = {
      post: "/v1/self/change-email/code"
      body: "*"
    };
  }
  // 修改当前用户的邮箱。必须提供新邮箱收到的验证码和图形验证码，验证通过才生效。
  rpc ChangeEmail(ChangeEmailRequest) returns (ChangeEmailResponse) {
    option (google.api.http) = {
      put: "/v1/self/change-email"
      body: "*"
    };
  }
  // 修改当前用户的头像。
  rpc ChangeAvatar(ChangeAvatarRequest) returns (ChangeAvatarResponse) {
    option (google.api.http) = {
      put: "/v1/self/change-avatar"
      body: "*"
    };
  }
  // 修改当前用户的备注。
  rpc ChangeRemark(ChangeRemarkRequest) returns (ChangeRemarkResponse) {
    option (google.api.http) = {
      put: "/v1/self/change-remark"
      body: "*"
    };
  }
  // 修改当前用户的手机号。短信通知使用该号码。
  rpc ChangePhone(ChangePhoneRequest) returns (ChangePhoneResponse) {
    option (google.api.http) = {
      put: "/v1/self/change-phone"
      body: "*"
    };
  }
  // 获取当前用户在当前租户的权限名。未选租户时为空。
  rpc GetSelfPermissions(GetSelfPermissionsRequest) returns (GetSelfPermissionsResponse) {
    option (google.api.http) = {get: "/v1/self/permissions"};
  }
  // 列出当前账号已绑定的第三方身份。
  rpc ListSelfOAuthLinks(ListSelfOAuthLinksRequest) returns (ListSelfOAuthLinksResponse) {
    option (google.api.http) = {get: "/v1/self/oauth/links"};
  }
  // 用第三方授权码把身份绑定到当前账号。不签发会话，不改变登录身份。
  rpc BindSelfOAuth(BindSelfOAuthRequest) returns (BindSelfOAuthResponse) {
    option (google.api.http) = {
      post: "/v1/self/oauth/bind"
      body: "*"
    };
  }
  // 解绑当前账号的一条第三方身份。最后一个登录方式不能解绑。
  rpc UnbindSelfOAuth(UnbindSelfOAuthRequest) returns (UnbindSelfOAuthResponse) {
    option (google.api.http) = {delete: "/v1/self/oauth/links/{uid}"};
  }
}

// 租户管理。
service NamespaceService {
  // 创建租户，当前用户成为负责人。
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse) {
    option (google.api.http) = {
      post: "/v1/namespace"
      body: "*"
    };
  }
  // 修改当前租户的名称、备注和标志。
  rpc UpdateNamespace(UpdateNamespaceRequest) returns (UpdateNamespaceResponse) {
    option (google.api.http) = {
      put: "/v1/namespace/{uid}"
      body: "*"
    };
  }
  // 租户侧启停已由平台接管，该接口固定拒绝，避免租户自行解封。
  // 平台停用/启用走 UpdateSystemNamespaceStatus。
  rpc UpdateNamespaceStatus(UpdateNamespaceStatusRequest) returns (UpdateNamespaceStatusResponse) {
    option (google.api.http) = {
      put: "/v1/namespace/{uid}/status"
      body: "*"
    };
  }
  // 删除当前租户。需要 namespace:delete。
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse) {
    option (google.api.http) = {delete: "/v1/namespace/{uid}"};
  }
  // 获取当前租户。
  rpc GetNamespace(GetNamespaceRequest) returns (GetNamespaceResponse) {
    option (google.api.http) = {get: "/v1/namespace/{uid}"};
  }
  // 分页列出当前用户加入的租户。
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse) {
    option (google.api.http) = {get: "/v1/namespaces"};
  }
  // 按游标列出当前用户可切换的租户。
  rpc SelectNamespaces(SelectNamespacesRequest) returns (SelectNamespacesResponse) {
    option (google.api.http) = {get: "/v1/namespaces/select"};
  }
  // 按页返回租户简表。
  rpc ListSimpleNamespaces(ListSimpleNamespacesRequest) returns (ListSimpleNamespacesResponse) {
    option (google.api.http) = {get: "/v1/namespaces/simple"};
  }
  // 平台管理员分页列出全部租户。不读 X-Namespace，需要 system:namespace:read。
  rpc ListSystemNamespaces(ListSystemNamespacesRequest) returns (ListSystemNamespacesResponse) {
    option (google.api.http) = {get: "/v1/system/namespaces"};
  }
  // 平台停用或启用租户。不读 X-Namespace，需要 system:namespace:write。
  // 停用必须填写原因，成功后邮件通知租户负责人；启用会清空停用原因且不发邮件。
  rpc UpdateSystemNamespaceStatus(UpdateSystemNamespaceStatusRequest) returns (UpdateSystemNamespaceStatusResponse) {
    option (google.api.http) = {
      put: "/v1/system/namespace/{uid}/status"
      body: "*"
    };
  }
  // 归档租户：软删除租户及其全部业务数据。不读 X-Namespace，需要 system:namespace:write。
  // 归档不可恢复，也不提供取消归档的接口。
  rpc ArchiveSystemNamespace(ArchiveSystemNamespaceRequest) returns (ArchiveSystemNamespaceResponse) {
    option (google.api.http) = {put: "/v1/system/namespace/{uid}/archive"};
  }
  // 把当前租户的负责人移交给另一名成员。
  rpc TransferNamespaceOwner(TransferNamespaceOwnerRequest) returns (TransferNamespaceOwnerResponse) {
    option (google.api.http) = {
      put: "/v1/namespace/{uid}/owner"
      body: "*"
    };
  }

  // 列出代码维护的功能目录。不读 X-Namespace，需要 system:package:read。
  rpc ListFeatures(ListFeaturesRequest) returns (ListFeaturesResponse) {
    option (google.api.http) = {get: "/v1/system/features"};
  }
  // 平台管理员分页列出功能套餐。需要 system:package:read。
  rpc ListFeaturePackages(ListFeaturePackagesRequest) returns (ListFeaturePackagesResponse) {
    option (google.api.http) = {get: "/v1/system/packages"};
  }
  // 获取一个功能套餐。需要 system:package:read。
  rpc GetFeaturePackage(GetFeaturePackageRequest) returns (GetFeaturePackageResponse) {
    option (google.api.http) = {get: "/v1/system/package/{uid}"};
  }
  // 新建功能套餐。需要 system:package:write，仅超级管理员。
  rpc CreateFeaturePackage(CreateFeaturePackageRequest) returns (CreateFeaturePackageResponse) {
    option (google.api.http) = {
      post: "/v1/system/package"
      body: "*"
    };
  }
  // 修改功能套餐。需要 system:package:write；基础套餐不能改名。
  rpc UpdateFeaturePackage(UpdateFeaturePackageRequest) returns (UpdateFeaturePackageResponse) {
    option (google.api.http) = {
      put: "/v1/system/package/{uid}"
      body: "*"
    };
  }
  // 删除功能套餐。需要 system:package:write；基础套餐和被租户使用的套餐不能删除。
  rpc DeleteFeaturePackage(DeleteFeaturePackageRequest) returns (DeleteFeaturePackageResponse) {
    option (google.api.http) = {delete: "/v1/system/package/{uid}"};
  }
  // 读取租户开通的套餐、套餐功能和有效功能。需要 system:package:read。
  rpc GetNamespaceFeatures(GetNamespaceFeaturesRequest) returns (GetNamespaceFeaturesResponse) {
    option (google.api.http) = {get: "/v1/system/namespace/{uid}/features"};
  }
  // 原子设置租户的套餐和目标有效功能。需要 system:package:write。
  rpc UpdateNamespaceFeatures(UpdateNamespaceFeaturesRequest) returns (UpdateNamespaceFeaturesResponse) {
    option (google.api.http) = {
      put: "/v1/system/namespace/{uid}/features"
      body: "*"
    };
  }
}

// 租户成员管理。
service MemberService {
  // 分页列出当前租户的成员。
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option (google.api.http) = {get: "/v1/members"};
  }
  // 获取当前租户的一名成员。
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse) {
    option (google.api.http) = {get: "/v1/member/{uid}"};
  }
  // 按用户标识查找其在当前租户的成员身份。
  rpc ListUserMembers(ListUserMembersRequest) returns (ListUserMembersResponse) {
    option (google.api.http) = {get: "/v1/members/user/{user_uid}"};
  }
  // 按游标列出当前租户的成员，供选择。
  rpc SelectMembers(SelectMembersRequest) returns (SelectMembersResponse) {
    option (google.api.http) = {get: "/v1/members/select"};
  }
  // 邀请用户加入当前租户。被邀请人同意后才会成为成员。不能指定 owner。
  rpc InviteMember(InviteMemberRequest) returns (InviteMemberResponse) {
    option (google.api.http) = {
      post: "/v1/member/invite"
      body: "*"
    };
  }
  // 列出当前租户等待确认的邀请。
  rpc ListMemberInvites(ListMemberInvitesRequest) returns (ListMemberInvitesResponse) {
    option (google.api.http) = {get: "/v1/member-invites"};
  }
  // 撤销一条等待确认的邀请。
  rpc RevokeMemberInvite(RevokeMemberInviteRequest) returns (RevokeMemberInviteResponse) {
    option (google.api.http) = {delete: "/v1/member/invite/{uid}"};
  }
  // 把成员移出当前租户。
  rpc DeleteMember(DeleteMemberRequest) returns (DeleteMemberResponse) {
    option (google.api.http) = {delete: "/v1/member/{uid}"};
  }
  // 修改成员状态。
  rpc UpdateMemberStatus(UpdateMemberStatusRequest) returns (UpdateMemberStatusResponse) {
    option (google.api.http) = {
      put: "/v1/member/{uid}/status"
      body: "*"
    };
  }
  // 替换成员的角色。包含 owner 时需要移交权限。
  rpc UpdateMemberRoles(UpdateMemberRolesRequest) returns (UpdateMemberRolesResponse) {
    option (google.api.http) = {
      put: "/v1/member/{uid}/roles"
      body: "*"
    };
  }
}

// 全局用户管理。
service UserService {
  // 获取一名全局用户。
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {get: "/v1/user/{uid}"};
  }
  // 分页列出全局用户。
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/v1/users"};
  }
  // 按游标列出全局用户，供选择。
  rpc SelectUsers(SelectUsersRequest) returns (SelectUsersResponse) {
    option (google.api.http) = {get: "/v1/users/select"};
  }
  // 封禁用户。封禁后不能登录。
  rpc BanUser(BanUserRequest) returns (BanUserResponse) {
    option (google.api.http) = {put: "/v1/user/ban/{uid}"};
  }
  // 解除封禁，用户可以再次登录。
  rpc PermitUser(PermitUserRequest) returns (PermitUserResponse) {
    option (google.api.http) = {put: "/v1/user/permit/{uid}"};
  }
  // 授权或撤销系统管理员。只有超级管理员可以调用。
  rpc UpdateUserSystemRole(UpdateUserSystemRoleRequest) returns (UpdateUserSystemRoleResponse) {
    option (google.api.http) = {
      put: "/v1/user/{uid}/system-role"
      body: "*"
    };
  }
}

// 平台邀请消息。邀请独立于租户成员，必须由用户在平台确认。
service InvitationService {
  // 列出当前用户的平台邀请消息。
  rpc ListSelfInvitations(ListSelfInvitationsRequest) returns (ListSelfInvitationsResponse) {
    option (google.api.http) = {get: "/v1/self/invitations"};
  }
  // 按邮件链接里的令牌查看邀请函。此接口不需要登录。
  rpc GetInvitation(GetInvitationRequest) returns (GetInvitationResponse) {
    option (google.api.http) = {get: "/v1/invitation/{token}"};
  }
  // 同意邀请，成为租户成员。邮件链接用 token，平台消息用 uid。
  rpc AcceptInvitation(AcceptInvitationRequest) returns (AcceptInvitationResponse) {
    option (google.api.http) = {
      post: "/v1/invitation/accept"
      body: "*"
    };
  }
  // 拒绝邀请，不会创建成员。
  rpc DeclineInvitation(DeclineInvitationRequest) returns (DeclineInvitationResponse) {
    option (google.api.http) = {
      post: "/v1/invitation/decline"
      body: "*"
    };
  }
}

// 租户角色和权限。
service RoleService {
  // 在当前租户创建自定义角色。
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse) {
    option (google.api.http) = {
      post: "/v1/roles"
      body: "*"
    };
  }
  // 修改自定义角色的名称。系统角色不能改名。
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse) {
    option (google.api.http) = {
      put: "/v1/role/{uid}"
      body: "*"
    };
  }
  // 启用或停用角色。
  rpc UpdateRoleStatus(UpdateRoleStatusRequest) returns (UpdateRoleStatusResponse) {
    option (google.api.http) = {
      put: "/v1/role/{uid}/status"
      body: "*"
    };
  }
  // 删除自定义角色。系统角色不能删除。
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse) {
    option (google.api.http) = {delete: "/v1/role/{uid}"};
  }
  // 获取当前租户的一个角色。
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse) {
    option (google.api.http) = {get: "/v1/role/{uid}"};
  }
  // 分页列出当前租户的角色。
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/v1/roles"};
  }
  // 按游标列出当前租户的角色，供选择。
  rpc SelectRoles(SelectRolesRequest) returns (SelectRolesResponse) {
    option (google.api.http) = {get: "/v1/roles/select"};
  }
  // 替换自定义角色的权限。不能授予删除租户和移交负责人。
  rpc UpdateRolePermissions(UpdateRolePermissionsRequest) returns (UpdateRolePermissionsResponse) {
    option (google.api.http) = {
      put: "/v1/role/{uid}/permissions"
      body: "*"
    };
  }
  // 列出全部权限定义。
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {get: "/v1/permissions"};
  }
  // 修改角色备注。系统角色的备注也能改，它不影响预置的权限边界。
  rpc UpdateRoleRemark(UpdateRoleRemarkRequest) returns (UpdateRoleRemarkResponse) {
    option (google.api.http) = {
      put: "/v1/role/{uid}/remark"
      body: "*"
    };
  }
}

// 平台系统消息。邀请收到、同意和拒绝都会产生一条消息。
service SystemMessageService {
  // 分页列出当前用户的系统消息。
  rpc ListSelfMessages(ListSelfMessagesRequest) returns (ListSelfMessagesResponse) {
    option (google.api.http) = {get: "/v1/self/messages"};
  }
  // 当前用户的未读消息数。
  rpc GetUnreadMessageCount(GetUnreadMessageCountRequest) returns (GetUnreadMessageCountResponse) {
    option (google.api.http) = {get: "/v1/self/messages/unread-count"};
  }
  // 标记一条消息为已读。
  rpc MarkMessageRead(MarkMessageReadRequest) returns (MarkMessageReadResponse) {
    option (google.api.http) = {put: "/v1/self/messages/{uid}/read"};
  }
  // 标记全部消息为已读。
  rpc MarkAllMessagesRead(MarkAllMessagesReadRequest) returns (MarkAllMessagesReadResponse) {
    option (google.api.http) = {put: "/v1/self/messages/read-all"};
  }
}

// 用户资料。响应中不含密码。
message UserItem {
  // 标识。
  string uid = 1;
  // 名称。
  string name = 2;
  // 昵称。
  string nickname = 3;
  // 邮箱。
  string email = 4;
  // 头像地址。
  string avatar = 5;
  // 备注。
  string remark = 6;
  // 状态。
  string status = 7;
  // 平台角色：SUPER_ADMIN、SYSTEM_ADMIN、SYSTEM_READONLY 或 USER。
  string system_role = 8 [json_name = "systemRole"];
  // 授权该平台角色的超级管理员标识。
  string authorized_by = 9 [json_name = "authorizedBy"];
  // 手机号，用于短信通知。
  string phone = 10;
}

// 租户。
message NamespaceItem {
  // 标识。
  string uid = 1;
  // 名称。
  string name = 2;
  // 负责人的用户标识。
  string owner_uid = 3 [json_name = "ownerUid"];
  // 标志地址。
  string logo = 4;
  // 备注。
  string remark = 5;
  // 状态。
  string status = 6;
  // 负责人的名称。
  string owner_name = 7 [json_name = "ownerName"];
  // 负责人的邮箱。
  string owner_email = 8 [json_name = "ownerEmail"];
  // 成员数。只在平台租户列表和当前租户视角返回，按 JOINED 成员统计。
  int32 member_count = 9 [json_name = "memberCount"];
  // 创建时间，Unix 秒。
  int64 created_at = 10 [json_name = "createdAt"];
  // 当前套餐名称。只在平台租户列表返回。
  string package_name = 11 [json_name = "packageName"];
  // 套餐到期时间，Unix 秒。0 表示永久。只在平台租户列表返回。
  int64 package_expires_at = 12 [json_name = "packageExpiresAt"];
  // 停用原因。只在平台租户列表返回，租户启用时为空。
  string disable_reason = 13 [json_name = "disableReason"];
}

// 租户成员。
message MemberItem {
  // 标识。
  string uid = 1;
  // 租户标识。
  string namespace_uid = 2 [json_name = "namespaceUid"];
  // 用户标识。
  string user_uid = 3 [json_name = "userUid"];
  // 邮箱。
  string email = 4;
  // 名称。
  string name = 5;
  // 状态。
  string status = 6;
  // 角色标识列表。
  repeated string role_uids = 7 [json_name = "roleUids"];
  // 角色名称列表。
  repeated string role_names = 8 [json_name = "roleNames"];
  // 手机号，用于短信通知。
  string phone = 9;
}

// 租户角色。
message RoleItem {
  // 标识。
  string uid = 1;
  // 租户标识。
  string namespace_uid = 2 [json_name = "namespaceUid"];
  // 名称。
  string name = 3;
  // 状态。
  string status = 4;
  // 是否为系统预置角色。
  bool is_system = 5 [json_name = "isSystem"];
  // 权限名列表。
  repeated string permissions = 6;
  // 备注：说明这个角色能做什么、该分配给谁。
  string remark = 7;
}

// 权限定义。
message PermissionItem {
  // 标识。
  string uid = 1;
  // 名称。
  string name = 2;
  // 资源名。
  string resource = 3;
  // 动作名。
  string action = 4;
}

// 下拉选项。
message SelectItem {
  // 标识。
  string uid = 1;
  // 名称。
  string name = 2;
}

// 登录成功后的访问令牌和刷新令牌。
message TokenPair {
  // 访问令牌。
  string access_token = 1 [json_name = "accessToken"];
  // 刷新令牌。
  string refresh_token = 2 [json_name = "refreshToken"];
  // 用户资料。
  UserItem user = 3;
}

// 获取图形验证码不需要参数。
message GetCaptchaRequest {}

// 验证码标识和图片。
message GetCaptchaResponse {
  // 验证码标识。
  string id = 1;
  // 验证码图片，data URL。题目画在图片里。
  string image = 2;
  // 题型：NUMERIC 为随机 6 位数字码，MATH 为 100 以内四则运算。前端据此切换输入提示。
  string kind = 3;
}

// 注册参数。
message RegisterRequest {
  // 邮箱。
  string email = 1 [(buf.validate.field).string.email = true];
  // 图形验证码标识。
  string captcha_id = 3 [(buf.validate.field).string.min_len = 1, json_name = "captchaId"];
  // 图形验证码答案。
  string captcha_code = 4 [(buf.validate.field).string.min_len = 1, json_name = "captchaCode"];
  // 用户名：仅中英文和数字，最多 8 个字符；留空时由服务端从邮箱前缀派生。
  // 与后端 user.usernamePattern 保持一致。
  string name = 5 [(buf.validate.field).string = {max_len: 8, pattern: "^[\\p{L}\\p{N}]{0,8}$"}];
  // 邮箱验证码。
  string code = 6 [(buf.validate.field).string.min_len = 4];
  // 密码已经移除：注册只用邮箱验证码。
  reserved 2;
  reserved "password";
}

// 注册结果。
message RegisterResponse {
  // 登录会话。
  TokenPair session = 1;
}

// 发送注册验证码的参数。
message SendRegisterEmailCodeRequest {
  // 邮箱。
  string email = 1 [(buf.validate.field).string.email = true];
  // 图形验证码标识。
  string captcha_id = 2 [(buf.validate.field).string.min_len = 1, json_name = "captchaId"];
  // 图形验证码答案。
  string captcha_code = 3 [(buf.validate.field).string.min_len = 1, json_name = "captchaCode"];
}

// 注册验证码已受理。
message SendRegisterEmailCodeResponse {}

// 发送邮箱登录码的参数。
message SendEmailLoginCodeRequest {
  // 邮箱。
  string email = 1 [(buf.validate.field).string.email = true];
  // 图形验证码标识。
  string captcha_id = 2 [(buf.validate.field).string.min_len = 1, json_name = "captchaId"];
  // 图形验证码答案。
  string captcha_code = 3 [(buf.validate.field).string.min_len = 1, json_name = "captchaCode"];
}

// 验证码已受理。
message SendEmailLoginCodeResponse {}

// 邮箱验证码登录参数。
message EmailLoginRequest {
  // 邮箱。
  string email = 1 [(buf.validate.field).string.email = true];
  // 邮箱验证码。
  string code = 2 [(buf.validate.field).string.min_len = 4];
  // 图形验证码标识。
  string captcha_id = 3 [(buf.validate.field).string.min_len = 1, json_name = "captchaId"];
  // 图形验证码答案。
  string captcha_code = 4 [(buf.validate.field).string.min_len = 1, json_name = "captchaCode"];
}

// 邮箱登录结果。
message EmailLoginResponse {
  // 登录会话。
  TokenPair session = 1;
}

// 列出第三方登录来源的参数。
message ListOAuth2ProvidersRequest {
  // 授权回调地址，原样写进第三方授权地址。
  string redirect_uri = 1 [(buf.validate.field).string.uri = true, json_name = "redirectUri"];
  // 前端生成的一次性 state，原样写进第三方授权地址。
  string state = 2 [(buf.validate.field).string.min_len = 8];
}

// 已经配置客户端的第三方登录来源。
message OAuth2Provider {
  // 第三方，取值为 GITHUB、GITEE、FEISHU 或 DINGTALK。
  string provider = 1;
  // 展示名，例如 GitHub。
  string name = 2;
  // 完整授权地址，前端直接跳转。
  string authorize_url = 3 [json_name = "authorizeUrl"];
}

// 第三方登录来源列表。
message ListOAuth2ProvidersResponse {
  // 已配置客户端的第三方。
  repeated OAuth2Provider providers = 1;
}

// 第三方登录参数。
message OAuth2LoginRequest {
  // 第三方，取值为 GITHUB、GITEE、FEISHU 或 DINGTALK。
  string provider = 1 [(buf.validate.field).string = {in: ["GITHUB", "GITEE", "FEISHU", "DINGTALK"]}];
  // 第三方授权码。
  string code = 2 [(buf.validate.field).string.min_len = 1];
  // 授权回调地址。
  string redirect_uri = 3 [json_name = "redirectUri"];
}

// 第三方登录结果。
message OAuth2LoginResponse {
  // 登录会话。第三方返回可用邮箱，或该第三方账号已经绑定时返回。
  TokenPair session = 1;
  // 是否需要用户补充并验证邮箱。为 true 时 session 为空，前端展示邮箱绑定表单。
  bool email_binding_required = 2 [json_name = "emailBindingRequired"];
  // 待绑定凭证，15 分钟内有效，只用于发送绑定验证码和完成绑定。
  string bind_token = 3 [json_name = "bindToken"];
  // 第三方返回的未验证邮箱，用于预填表单；平台没有返回邮箱时为空。
  string suggested_email = 4 [json_name = "suggestedEmail"];
}

// 发送第三方登录邮箱绑定验证码的参数。
message SendOAuthBindEmailCodeRequest {
  // 待绑定凭证。
  string bind_token = 1 [(buf.validate.field).string.min_len = 1, json_name = "bindToken"];
  // 用户填写或确认的邮箱，验证码发到这个地址。
  string email = 2 [(buf.validate.field).string.email = true];
  // 图形验证码标识。
  string captcha_id = 3 [(buf.validate.field).string.min_len = 1, json_name = "captchaId"];
  // 图形验证码答案。
  string captcha_code = 4 [(buf.validate.field).string.min_len = 1, json_name = "captchaCode"];
}

// 绑定验证码已受理。
message SendOAuthBindEmailCodeResponse {}

// 完成第三方登录邮箱绑定的参数。
message BindOAuthEmailRequest {
  // 待绑定凭证。
  string bind_token = 1 [(buf.validate.field).string.min_len = 1, json_name = "bindToken"];
  // 完成验证的邮箱。
  string email = 2 [(buf.validate.field).string.email = true];
  // 邮箱验证码。
  string code = 3 [(buf.validate.field).string.min_len = 4];
  // 图形验证码标识。
  string captcha_id = 4 [(buf.validate.field).string.min_len = 1, json_name = "captchaId"];
  // 图形验证码答案。
  string captcha_code = 5 [(buf.validate.field).string.min_len = 1, json_name = "captchaCode"];
}

// 第三方登录邮箱绑定结果。
message BindOAuthEmailResponse {
  // 登录会话。
  TokenPair session = 1;
}

