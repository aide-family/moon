  // 租户标识。
  string namespace_uid = 4 [json_name = "namespaceUid"];
  // 租户名称。
  string namespace_name = 5 [json_name = "namespaceName"];
  // 邀请角色名称。
  string role_name = 6 [json_name = "roleName"];
  // 是否已读。
  bool read = 7;
  // 创建时间，Unix 秒。
  int64 created_at = 8 [json_name = "createdAt"];
}

