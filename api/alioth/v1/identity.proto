  // 名称，未删除记录上唯一。
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // 备注。
  string remark = 2;
  // 套餐能力编码列表。
  repeated string features = 3;
  // 授权时长（天），0 表示永久。
  int32 duration_days = 4 [json_name = "durationDays", (buf.validate.field).int32.gte = 0];
}

// 新建后的功能套餐。
message CreateFeaturePackageResponse {
  // 套餐。
  FeaturePackageItem package = 1;
}

// 修改功能套餐的参数。
message UpdateFeaturePackageRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  // 名称。基础套餐必须保持原名。
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // 备注。
  string remark = 3;
  // 套餐能力编码列表。
  repeated string features = 4;
  // 授权时长（天），0 表示永久。
  int32 duration_days = 5 [json_name = "durationDays", (buf.validate.field).int32.gte = 0];
}

