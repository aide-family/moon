message ListFeaturePackagesResponse {
  // 当前页数据。
  repeated FeaturePackageItem items = 1;
  // 符合条件的总数。
  int32 total = 2;
  // 页码。0 表示使用默认页。
  int32 page = 3;
  // 每页条数，最大 100。
  int32 page_size = 4 [json_name = "pageSize"];
}

