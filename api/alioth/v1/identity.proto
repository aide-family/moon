// 一个能力。权限名是该能力包含的租户权限，供角色授权页按能力分组。
message FeatureItem {
  // 能力编码，如 alert_realtime、k8s_node、web_shell。
  string code = 1;
  // 能力名称。
  string name = 2;
  // 能力说明。
  string description = 3;
  // 该能力包含的租户权限名。
  repeated string permissions = 4;
  // 能力所属的菜单模块编码，如 alert、cluster、ssh。
  string module = 5;
}

// 一个功能套餐。features 是套餐携带的能力编码。
message FeaturePackageItem {
  // 标识。
  string uid = 1;
  // 名称。
  string name = 2;
  // 备注。
  string remark = 3;
  // 套餐能力编码列表。
  repeated string features = 4;
  // 是否基础套餐。基础套餐只有一个，不能改名或删除。
  bool is_base = 5 [json_name = "isBase"];
  // 状态，取值为 ACTIVE 或 DISABLED。
  string status = 6;
  // 创建时间，Unix 秒。
  int64 created_at = 7 [json_name = "createdAt"];
  // 授权时长（天），0 表示永久。
  int32 duration_days = 8 [json_name = "durationDays"];
}

// 列出功能目录不需要参数。
message ListFeaturesRequest {}

// 功能目录。
message ListFeaturesResponse {
  // 功能列表。
  repeated FeatureItem items = 1;
}

