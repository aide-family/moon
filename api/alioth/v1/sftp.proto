syntax = "proto3";

package alioth.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/aide-family/Alioth/api/alioth/v1;v1";

// SFTP 文件操作与审计。
service SFTPService {
  // 列目录。需要 sftp:read。
  rpc ListSFTP(ListSFTPRequest) returns (ListSFTPResponse) {
    option (google.api.http) = {
      post: "/v1/sftp/list"
      body: "*"
    };
  }
  // 下载文件。需要 sftp:read。
  rpc DownloadSFTP(DownloadSFTPRequest) returns (DownloadSFTPResponse) {
    option (google.api.http) = {
      post: "/v1/sftp/download"
      body: "*"
    };
  }
  // 上传文件。需要 sftp:write。
  rpc UploadSFTP(UploadSFTPRequest) returns (UploadSFTPResponse) {
    option (google.api.http) = {
      post: "/v1/sftp/upload"
      body: "*"
    };
  }
  // 创建目录。需要 sftp:write。
  rpc MkdirSFTP(MkdirSFTPRequest) returns (MkdirSFTPResponse) {
    option (google.api.http) = {
      post: "/v1/sftp/mkdir"
      body: "*"
    };
  }
  // 删除路径。需要 sftp:write。
  rpc DeleteSFTP(DeleteSFTPRequest) returns (DeleteSFTPResponse) {
    option (google.api.http) = {
      post: "/v1/sftp/delete"
      body: "*"
    };
  }
  // 分页列出 SFTP 审计。
  rpc ListSFTPAudits(ListSFTPAuditsRequest) returns (ListSFTPAuditsResponse) {
    option (google.api.http) = {get: "/v1/sftp-audits"};
  }
}

// 目录项。
message SFTPEntry {
  // 名称。
  string name = 1;
  // 路径。
  string path = 2;
  // 是否目录。
  bool is_dir = 3 [json_name = "isDir"];
  // 大小。
  int64 size = 4;
  // 权限。
  string mode = 5;
  // 修改时间。
  string mod_time = 6 [json_name = "modTime"];
}

// SFTP 审计。
message SFTPAuditItem {
  // 标识。
  string uid = 1;
  // 机器标识。
  string agent_uid = 2 [json_name = "agentUid"];
  // 操作者。
  string operator_uid = 3 [json_name = "operatorUid"];
  // 路径。
  string path = 4;
  // 动作。
  string action = 5;
  // 结果，取值为 PENDING、OK 或 FAILED。
  string result = 6;
  // 详情。
  string detail = 7;
  // 创建时间。
  string created_at = 8 [json_name = "createdAt"];
}

message ListSFTPRequest {
  string agent_uid = 1 [json_name = "agentUid", (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).string.min_len = 1];
}

message ListSFTPResponse {
  repeated SFTPEntry entries = 1;
  SFTPAuditItem audit = 2;
}

message DownloadSFTPRequest {
  string agent_uid = 1 [json_name = "agentUid", (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).string.min_len = 1];
}

message DownloadSFTPResponse {
  bytes content = 1;
  SFTPAuditItem audit = 2;
}

message UploadSFTPRequest {
  string agent_uid = 1 [json_name = "agentUid", (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).string.min_len = 1];
  bytes content = 3;
}

message UploadSFTPResponse {
  SFTPAuditItem audit = 1;
}

message MkdirSFTPRequest {
  string agent_uid = 1 [json_name = "agentUid", (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).string.min_len = 1];
}

message MkdirSFTPResponse {
  SFTPAuditItem audit = 1;
}

message DeleteSFTPRequest {
  string agent_uid = 1 [json_name = "agentUid", (buf.validate.field).string.min_len = 1];
  string path = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteSFTPResponse {
  SFTPAuditItem audit = 1;
}

message ListSFTPAuditsRequest {
  int32 page = 1 [(buf.validate.field).int32.gte = 0];
  int32 page_size = 2 [json_name = "pageSize", (buf.validate.field).int32 = {gte: 0, lte: 100}];
  string agent_uid = 3 [json_name = "agentUid"];
}

message ListSFTPAuditsResponse {
  repeated SFTPAuditItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4 [json_name = "pageSize"];
}
