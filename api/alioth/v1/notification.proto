  string subscription_name = 13 [json_name = "subscriptionName"];
}

// 消息日志分页查询。
message ListMessageLogsRequest {
  // 页码。
  int32 page = 1 [(buf.validate.field).int32.gte = 0];
  // 每页条数。
  int32 page_size = 2 [json_name = "pageSize", (buf.validate.field).int32 = {gte: 0, lte: 100}];
  // 任务标识。
  string task_uid = 3 [json_name = "taskUid"];
  // 状态筛选，取值为 SENT 或 FAILED；为空表示全部。
  string status = 4;
  // 创建时间起点，Unix 秒，包含；0 表示不限。
  int64 start_time = 5 [json_name = "startTime", (buf.validate.field).int64.gte = 0];
  // 创建时间终点，Unix 秒，不包含；0 表示不限。
  int64 end_time = 6 [json_name = "endTime", (buf.validate.field).int64.gte = 0];
}

// 消息日志分页结果。
message ListMessageLogsResponse {
  // 当前页数据。
  repeated MessageLogItem items = 1;
  // 总数。
  int32 total = 2;
  // 页码。
  int32 page = 3;
  // 每页条数。
  int32 page_size = 4 [json_name = "pageSize"];
}

// 要查询的消息日志。
message GetMessageLogRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 消息日志详情。
message GetMessageLogResponse {
  // 消息日志。
  MessageLogItem log = 1;
}

// 一条通知任务。
message NotificationTaskItem {
  // 标识。
  string uid = 1;
  // 事件标识。
  string event_uid = 2 [json_name = "eventUid"];
  // 阶段，取值为 FIRING、RECOVERED 或 TEST。
  string phase = 3;
  // 状态，取值为 PENDING、SENDING、SENT、FAILED 或 CANCELLED。
  string status = 4;
  // 规则标识。
  string rule_uid = 5 [json_name = "ruleUid"];
  // 通知组标识。
  string group_uid = 6 [json_name = "groupUid"];
  // 渠道标识。
  string channel_uid = 7 [json_name = "channelUid"];
  // 模板标识。
  string template_uid = 8 [json_name = "templateUid"];
  // 接收方。
  string receivers = 9;
  // 主题。
  string subject = 10;
  // 剩余重试次数。
  int32 retries_left = 11 [json_name = "retriesLeft"];
  // 最近错误。
  string last_error = 12 [json_name = "lastError"];
  // 命中订阅的标识。规则绑定已移除，事件任务均由订阅产生。
  string subscription_uid = 13 [json_name = "subscriptionUid"];
  // 发送方标识（邮件地址或通知渠道名称）。
  string sender = 14;
  // 消息正文；投递完成后为最终渲染内容。
  string content = 15;
  // 通知组名称，供消息日志定位来源。
  string group_name = 16 [json_name = "groupName"];
  // 命中订阅的名称，供消息日志定位来源。
  string subscription_name = 17 [json_name = "subscriptionName"];
  // 渠道名称。
  string channel_name = 18 [json_name = "channelName"];
  // 模板名称。
  string template_name = 19 [json_name = "templateName"];
}

// 通知任务分页查询。
message ListNotificationTasksRequest {
  // 页码。
  int32 page = 1 [(buf.validate.field).int32.gte = 0];
  // 每页条数。
  int32 page_size = 2 [json_name = "pageSize", (buf.validate.field).int32 = {gte: 0, lte: 100}];
  // 状态筛选，取值为 PENDING、SENDING、SENT、FAILED 或 CANCELLED；为空表示全部。
  string status = 3;
  // 创建时间起点，Unix 秒，包含；0 表示不限。
  int64 start_time = 4 [json_name = "startTime", (buf.validate.field).int64.gte = 0];
  // 创建时间终点，Unix 秒，不包含；0 表示不限。
  int64 end_time = 5 [json_name = "endTime", (buf.validate.field).int64.gte = 0];
}

// 通知任务分页结果。
message ListNotificationTasksResponse {
  // 当前页数据。
  repeated NotificationTaskItem items = 1;
  // 总数。
  int32 total = 2;
  // 页码。
  int32 page = 3;
  // 每页条数。
  int32 page_size = 4 [json_name = "pageSize"];
}

// 重试任务。
message RetryNotificationTaskRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 重试已接受。
message RetryNotificationTaskResponse {
  // 任务。
  NotificationTaskItem task = 1;
}

// 取消任务。
message CancelNotificationTaskRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 取消已接受。
message CancelNotificationTaskResponse {
  // 任务。
  NotificationTaskItem task = 1;
}
