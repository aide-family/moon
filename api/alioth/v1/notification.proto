  // 创建值班路由。
  rpc CreateNotificationOnCall(CreateNotificationOnCallRequest) returns (CreateNotificationOnCallResponse) {
    option (google.api.http) = {
      post: "/v1/notification-oncall"
      body: "*"
    };
  }
  // 更新值班路由。通知组绑定保存时整体替换。
  rpc UpdateNotificationOnCall(UpdateNotificationOnCallRequest) returns (UpdateNotificationOnCallResponse) {
    option (google.api.http) = {
      put: "/v1/notification-oncall/{uid}"
      body: "*"
    };
  }
  // 启用或停用值班路由。
  rpc UpdateNotificationOnCallStatus(UpdateNotificationOnCallStatusRequest) returns (UpdateNotificationOnCallStatusResponse) {
    option (google.api.http) = {
      put: "/v1/notification-oncall/{uid}/status"
      body: "*"
    };
  }
  // 删除值班路由。
  rpc DeleteNotificationOnCall(DeleteNotificationOnCallRequest) returns (DeleteNotificationOnCallResponse) {
    option (google.api.http) = {delete: "/v1/notification-oncall/{uid}"};
  }
  // 获取值班路由详情。
  rpc GetNotificationOnCall(GetNotificationOnCallRequest) returns (GetNotificationOnCallResponse) {
    option (google.api.http) = {get: "/v1/notification-oncall/{uid}"};
  }
  // 分页列出值班路由。
  rpc ListNotificationOnCalls(ListNotificationOnCallsRequest) returns (ListNotificationOnCallsResponse) {
    option (google.api.http) = {get: "/v1/notification-oncalls"};
  }
}

// 消息日志与任务的查看、重试和取消。
service MessageLogService {
  // 分页列出消息日志。
  rpc ListMessageLogs(ListMessageLogsRequest) returns (ListMessageLogsResponse) {
    option (google.api.http) = {get: "/v1/message-logs"};
  }
  // 获取消息日志详情。
  rpc GetMessageLog(GetMessageLogRequest) returns (GetMessageLogResponse) {
    option (google.api.http) = {get: "/v1/message-log/{uid}"};
  }
  // 分页列出通知任务。
  rpc ListNotificationTasks(ListNotificationTasksRequest) returns (ListNotificationTasksResponse) {
    option (google.api.http) = {get: "/v1/notification-tasks"};
  }
  // 重试 FAILED 任务。
  rpc RetryNotificationTask(RetryNotificationTaskRequest) returns (RetryNotificationTaskResponse) {
    option (google.api.http) = {
      post: "/v1/notification-task/{uid}/retry"
      body: "*"
    };
  }
  // 取消尚未成功的任务。
  rpc CancelNotificationTask(CancelNotificationTaskRequest) returns (CancelNotificationTaskResponse) {
    option (google.api.http) = {
      post: "/v1/notification-task/{uid}/cancel"
      body: "*"
    };
  }
}

// 一条通知渠道。
message NotificationChannelItem {
  // 标识。
  string uid = 1;
  // 名称。
  string name = 2;
  // 类型，取值为 SMTP、WEBHOOK 或 SMS。
  string type = 3;
  // 应用，取值为 OTHER、DINGTALK、WECHAT、FEISHU 或 SMS_ALICLOUD。SMTP 固定 OTHER，SMS 固定 SMS_ALICLOUD。
  string app = 4;
  // 状态，取值为 ACTIVE 或 DISABLED。
  string status = 5;
  // 地址。
  string endpoint = 6;
  // 用户名。
  string username = 7;
  // 发件地址。
  string from_address = 8 [json_name = "fromAddress"];
  // 备注。
  string remark = 9;
  // 是否已配置密码。
  bool has_password = 10 [json_name = "hasPassword"];
  // 是否已配置签名。
  bool has_secret = 11 [json_name = "hasSecret"];
}

// 创建渠道。
message CreateNotificationChannelRequest {
  // 名称。
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // 类型，取值为 SMTP、WEBHOOK 或 SMS。
  string type = 2 [(buf.validate.field).string = {in: ["SMTP", "WEBHOOK", "SMS"]}];
  // 应用，取值为 OTHER、DINGTALK、WECHAT、FEISHU 或 SMS_ALICLOUD。SMTP 固定 OTHER，SMS 固定 SMS_ALICLOUD。
  string app = 3 [(buf.validate.field).string = {in: ["OTHER", "DINGTALK", "WECHAT", "FEISHU", "SMS_ALICLOUD"]}];
  // 地址。
  string endpoint = 4 [(buf.validate.field).string.min_len = 1];
  // 用户名。
  string username = 5;
  // 密码。
  string password = 6;
  // 签名。
  string secret = 7;
  // 发件地址。
  string from_address = 8 [json_name = "fromAddress"];
  // 备注。
  string remark = 9 [(buf.validate.field).string.max_len = 200];
}

// 创建渠道的结果。
message CreateNotificationChannelResponse {
  // 渠道。
  NotificationChannelItem channel = 1;
}

// 更新渠道。
message UpdateNotificationChannelRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  // 名称。
  string name = 2 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // 类型，取值为 SMTP、WEBHOOK 或 SMS。
  string type = 3 [(buf.validate.field).string = {in: ["SMTP", "WEBHOOK", "SMS"]}];
  // 应用，取值为 OTHER、DINGTALK、WECHAT、FEISHU 或 SMS_ALICLOUD。SMTP 固定 OTHER，SMS 固定 SMS_ALICLOUD。
  string app = 4 [(buf.validate.field).string = {in: ["OTHER", "DINGTALK", "WECHAT", "FEISHU", "SMS_ALICLOUD"]}];
  // 地址。
  string endpoint = 5 [(buf.validate.field).string.min_len = 1];
  // 用户名。
  string username = 6;
  // 密码。留空表示保持原值。
  string password = 7;
  // 签名。留空表示保持原值。
  string secret = 8;
  // 发件地址。
  string from_address = 9 [json_name = "fromAddress"];
  // 备注。
  string remark = 10 [(buf.validate.field).string.max_len = 200];
}

// 更新渠道的结果。
message UpdateNotificationChannelResponse {
  // 渠道。
  NotificationChannelItem channel = 1;
}

// 更新渠道状态。
message UpdateNotificationChannelStatusRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  // 状态，取值为 ACTIVE 或 DISABLED。
  string status = 2 [(buf.validate.field).string = {in: ["ACTIVE", "DISABLED"]}];
}

// 更新渠道状态的结果。
message UpdateNotificationChannelStatusResponse {
  // 渠道。
  NotificationChannelItem channel = 1;
}

// 要删除的渠道。
message DeleteNotificationChannelRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 渠道已删除。
message DeleteNotificationChannelResponse {}

// 要查询的渠道。
message GetNotificationChannelRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 渠道详情。
message GetNotificationChannelResponse {
  // 渠道。
  NotificationChannelItem channel = 1;
}

// 渠道分页查询。
message ListNotificationChannelsRequest {
  // 页码。
  int32 page = 1 [(buf.validate.field).int32.gte = 0];
  // 每页条数。
  int32 page_size = 2 [json_name = "pageSize", (buf.validate.field).int32 = {gte: 0, lte: 100}];
  // 名称。
  string name = 3;
  // 渠道类型，取值为 SMTP、WEBHOOK 或 SMS。留空表示不限制。
  string type = 4;
  // 应用。留空表示不限制。
  string app = 5;
}

// 渠道分页结果。
message ListNotificationChannelsResponse {
  // 当前页数据。
  repeated NotificationChannelItem items = 1;
  // 总数。
  int32 total = 2;
  // 页码。
  int32 page = 3;
  // 每页条数。
  int32 page_size = 4 [json_name = "pageSize"];
}

// 渠道下拉。
message SelectNotificationChannelsRequest {
  // 条数上限。
  int32 limit = 1;
  // 上一页最后一条标识。
  string last_uid = 2 [json_name = "lastUid"];
}

// 渠道下拉结果。
message SelectNotificationChannelsResponse {
  // 选项。
  repeated SelectItem items = 1;
  // 本页最后一条标识。
  string last_uid = 2 [json_name = "lastUid"];
}

// 试发渠道。
message TestNotificationChannelRequest {
  // 渠道标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  // 模板标识。可留空，此时使用 subject 和 body。
  string template_uid = 2 [json_name = "templateUid"];
  // 接收方。SMTP 必填，Webhook 可空。
  string receivers = 3;
  // 主题。
  string subject = 4;
  // 正文。
  string body = 5;
  // 参数 JSON。
  string params = 6;
}

// 试发已入库。
message TestNotificationChannelResponse {
  // 任务标识。
  string task_uid = 1 [json_name = "taskUid"];
}

// 一条通知模板。
message NotificationTemplateItem {
  // 标识。
  string uid = 1;
  // 名称。
  string name = 2;
  // 类型，取值为 EMAIL、WEBHOOK 或 SMS_ALICLOUD。
  string type = 3;
  // 状态，取值为 ACTIVE 或 DISABLED。
  string status = 4;
  // 主题。
  string subject = 5;
  // 正文。
  string body = 6;
  // 备注。
  string remark = 7;
  // 应用，取值为 OTHER、DINGTALK、WECHAT、FEISHU 或 SMS_ALICLOUD。
  // WEBHOOK 模板按应用区分；OTHER 表示通用 Webhook 模板。EMAIL 和 SMS_ALICLOUD 固定 OTHER。
  string app = 8;
}

// 创建模板。
message CreateNotificationTemplateRequest {
  // 名称。
  string name = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // 类型，取值为 EMAIL、WEBHOOK 或 SMS_ALICLOUD。
  string type = 2 [(buf.validate.field).string = {in: ["EMAIL", "WEBHOOK", "SMS_ALICLOUD"]}];
  // 主题。
  string subject = 3;
  // 正文。
  string body = 4;
  // 备注。
  string remark = 5 [(buf.validate.field).string.max_len = 200];
  // 应用，取值为 OTHER、DINGTALK、WECHAT、FEISHU 或 SMS_ALICLOUD。
  // WEBHOOK 模板按应用区分；OTHER 表示通用 Webhook 模板。EMAIL 和 SMS_ALICLOUD 固定 OTHER。
  string app = 6 [(buf.validate.field).string = {in: ["OTHER", "DINGTALK", "WECHAT", "FEISHU", "SMS_ALICLOUD"]}];
}

// 创建模板的结果。
message CreateNotificationTemplateResponse {
  // 模板。
  NotificationTemplateItem template = 1;
}

