syntax = "proto3";

package alioth.v1;

import "alioth/v1/identity.proto";
import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/aide-family/moon/api/alioth/v1;v1";

// 通知渠道的创建、查询和启停。
service NotificationChannelService {
  // 创建渠道。密码和签名只在这次请求里出现，响应不回明文。
  rpc CreateNotificationChannel(CreateNotificationChannelRequest) returns (CreateNotificationChannelResponse) {
    option (google.api.http) = {
      post: "/v1/notification-channel"
      body: "*"
    };
  }
  // 更新渠道。密码和签名留空表示保持原值。
  rpc UpdateNotificationChannel(UpdateNotificationChannelRequest) returns (UpdateNotificationChannelResponse) {
    option (google.api.http) = {
      put: "/v1/notification-channel/{uid}"
      body: "*"
    };
  }
  // 启用或停用渠道。
  rpc UpdateNotificationChannelStatus(UpdateNotificationChannelStatusRequest) returns (UpdateNotificationChannelStatusResponse) {
    option (google.api.http) = {
      put: "/v1/notification-channel/{uid}/status"
      body: "*"
    };
  }
  // 删除渠道。
  rpc DeleteNotificationChannel(DeleteNotificationChannelRequest) returns (DeleteNotificationChannelResponse) {
    option (google.api.http) = {delete: "/v1/notification-channel/{uid}"};
  }
  // 获取渠道详情。
  rpc GetNotificationChannel(GetNotificationChannelRequest) returns (GetNotificationChannelResponse) {
    option (google.api.http) = {get: "/v1/notification-channel/{uid}"};
  }
  // 分页列出渠道。
  rpc ListNotificationChannels(ListNotificationChannelsRequest) returns (ListNotificationChannelsResponse) {
    option (google.api.http) = {get: "/v1/notification-channels"};
  }
  // 下拉选择渠道。
  rpc SelectNotificationChannels(SelectNotificationChannelsRequest) returns (SelectNotificationChannelsResponse) {
    option (google.api.http) = {get: "/v1/notification-channels/select"};
  }
  // 试发。只写入 PENDING 任务，不等待投递。
  rpc TestNotificationChannel(TestNotificationChannelRequest) returns (TestNotificationChannelResponse) {
    option (google.api.http) = {
      post: "/v1/notification-channel/{uid}/test"
      body: "*"
    };
  }
}

// 通知模板的创建、查询和启停。
service NotificationTemplateService {
  // 创建模板。
  rpc CreateNotificationTemplate(CreateNotificationTemplateRequest) returns (CreateNotificationTemplateResponse) {
    option (google.api.http) = {
      post: "/v1/notification-template"
      body: "*"
    };
  }
  // 更新模板。
  rpc UpdateNotificationTemplate(UpdateNotificationTemplateRequest) returns (UpdateNotificationTemplateResponse) {
    option (google.api.http) = {
      put: "/v1/notification-template/{uid}"
      body: "*"
    };
  }
  // 启用或停用模板。
  rpc UpdateNotificationTemplateStatus(UpdateNotificationTemplateStatusRequest) returns (UpdateNotificationTemplateStatusResponse) {
    option (google.api.http) = {
      put: "/v1/notification-template/{uid}/status"
      body: "*"
    };
  }
  // 删除模板。
  rpc DeleteNotificationTemplate(DeleteNotificationTemplateRequest) returns (DeleteNotificationTemplateResponse) {
    option (google.api.http) = {delete: "/v1/notification-template/{uid}"};
  }
  // 获取模板详情。
  rpc GetNotificationTemplate(GetNotificationTemplateRequest) returns (GetNotificationTemplateResponse) {
    option (google.api.http) = {get: "/v1/notification-template/{uid}"};
  }
  // 分页列出模板。
  rpc ListNotificationTemplates(ListNotificationTemplatesRequest) returns (ListNotificationTemplatesResponse) {
    option (google.api.http) = {get: "/v1/notification-templates"};
  }
  // 下拉选择模板。
  rpc SelectNotificationTemplates(SelectNotificationTemplatesRequest) returns (SelectNotificationTemplatesResponse) {
    option (google.api.http) = {get: "/v1/notification-templates/select"};
  }
  // 按模板试发。
  rpc TestNotificationTemplate(TestNotificationTemplateRequest) returns (TestNotificationTemplateResponse) {
    option (google.api.http) = {
      post: "/v1/notification-template/{uid}/test"
      body: "*"
    };
  }
  // 用 mock 事件渲染模板，供编辑器和预设页预览使用，不写入任务。
  rpc PreviewNotificationTemplate(PreviewNotificationTemplateRequest) returns (PreviewNotificationTemplateResponse) {
    option (google.api.http) = {
      post: "/v1/notification-template/preview"
      body: "*"
    };
  }
  // 列出系统预设模板。预设只读，用户可从预设创建自己的模板。
  rpc ListNotificationPresets(ListNotificationPresetsRequest) returns (ListNotificationPresetsResponse) {
    option (google.api.http) = {get: "/v1/notification-presets"};
  }
}

