syntax = "proto3";

package alioth.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/aide-family/moon/api/alioth/v1;v1";

// 官网（公开站）的站点配置。
// 公开接口不需要登录与租户头，只返回展示必需字段；管理接口走平台权限，
// 读需要 system:site:read 或 system:login:read，写需要对应的 write。
service SiteService {
  // 读取公开站点配置：站点信息、页脚备案与登录方式开关。
  // 登录页、注册页与官网共用这一份配置，避免同一份备案号出现多个来源。
  rpc GetSiteConfig(GetSiteConfigRequest) returns (GetSiteConfigResponse) {
    option (google.api.http) = {get: "/v1/site/config"};
  }
  // 读取站点设置。
  rpc GetSiteSettings(GetSiteSettingsRequest) returns (GetSiteSettingsResponse) {
    option (google.api.http) = {get: "/v1/system/site"};
  }
  // 保存站点设置。全量覆盖，留空的备案字段表示官网页脚不展示该行。
  rpc UpdateSiteSettings(UpdateSiteSettingsRequest) returns (UpdateSiteSettingsResponse) {
    option (google.api.http) = {
      put: "/v1/system/site"
      body: "*"
    };
  }
  // 读取登录方式开关。
  rpc GetLoginMethods(GetLoginMethodsRequest) returns (GetLoginMethodsResponse) {
    option (google.api.http) = {get: "/v1/system/auth/login-methods"};
  }
  // 保存登录方式开关。邮箱验证码与第三方登录至少要保留一种。
  rpc UpdateLoginMethods(UpdateLoginMethodsRequest) returns (UpdateLoginMethodsResponse) {
    option (google.api.http) = {
      put: "/v1/system/auth/login-methods"
      body: "*"
    };
  }
  // 读取公开页面。只返回已发布快照，未发布或不存在一律 404，不泄露草稿存在性。
  rpc GetPublicSitePage(GetPublicSitePageRequest) returns (GetPublicSitePageResponse) {
    option (google.api.http) = {get: "/v1/site/pages/{slug}"};
  }
  // 读取公开导航：已发布且标记为展示在导航里的页面，按导航顺序排列。
  rpc ListPublicSiteNav(ListPublicSiteNavRequest) returns (ListPublicSiteNavResponse) {
    option (google.api.http) = {get: "/v1/site/nav"};
  }
  // 列出官网页面（草稿视角），需要 system:site:read。
  rpc ListSitePages(ListSitePagesRequest) returns (ListSitePagesResponse) {
    option (google.api.http) = {get: "/v1/system/site/pages"};
  }
  // 读取页面详情：草稿与已发布快照各一份，需要 system:site:read。
  rpc GetSitePage(GetSitePageRequest) returns (GetSitePageResponse) {
    option (google.api.http) = {get: "/v1/system/site/pages/{uid}"};
  }
  // 新建页面，写入草稿且状态为 DRAFT，需要 system:site:write。
  rpc CreateSitePage(CreateSitePageRequest) returns (CreateSitePageResponse) {
    option (google.api.http) = {
      post: "/v1/system/site/pages"
      body: "*"
    };
  }
  // 保存草稿，不改变发布状态，需要 system:site:write。
  // 请求带 updated_at 做乐观锁，冲突返回 409，不静默覆盖别人的修改。
  rpc UpdateSitePage(UpdateSitePageRequest) returns (UpdateSitePageResponse) {
    option (google.api.http) = {
      put: "/v1/system/site/pages/{uid}"
      body: "*"
    };
  }
  // 发布：把草稿复制为发布快照，官网立即生效，需要 system:site:write。
  rpc PublishSitePage(PublishSitePageRequest) returns (PublishSitePageResponse) {
    option (google.api.http) = {
      post: "/v1/system/site/pages/{uid}/publish"
      body: "*"
    };
  }
  // 下架：状态改为 ARCHIVED，官网立即 404，已发布内容仍保留，需要 system:site:write。
  rpc UnpublishSitePage(UnpublishSitePageRequest) returns (UnpublishSitePageResponse) {
    option (google.api.http) = {
      post: "/v1/system/site/pages/{uid}/unpublish"
      body: "*"
    };
  }
  // 删除页面（软删），首页不允许删除，需要 system:site:write。
  rpc DeleteSitePage(DeleteSitePageRequest) returns (DeleteSitePageResponse) {
    option (google.api.http) = {delete: "/v1/system/site/pages/{uid}"};
  }
  // 修改导航展示与顺序，需要 system:site:write。
  rpc UpdateSitePageNav(UpdateSitePageNavRequest) returns (UpdateSitePageNavResponse) {
    option (google.api.http) = {
      put: "/v1/system/site/pages/{uid}/nav"
      body: "*"
    };
  }
  // 读取邮件服务（SMTP）配置，需要 system:login:read。
  rpc GetEmailSettings(GetEmailSettingsRequest) returns (GetEmailSettingsResponse) {
    option (google.api.http) = {get: "/v1/system/auth/email-settings"};
  }
  // 保存邮件服务配置，需要 system:login:write。保存后立即用于发信，不需要重启。
  rpc UpdateEmailSettings(UpdateEmailSettingsRequest) returns (UpdateEmailSettingsResponse) {
    option (google.api.http) = {
      put: "/v1/system/auth/email-settings"
      body: "*"
    };
  }
  // 列出第三方登录来源配置，需要 system:login:read。
  rpc ListOAuthProviderSettings(ListOAuthProviderSettingsRequest) returns (ListOAuthProviderSettingsResponse) {
    option (google.api.http) = {get: "/v1/system/auth/oauth-providers"};
  }
  // 保存单个第三方登录来源，需要 system:login:write。
  rpc UpdateOAuthProviderSetting(UpdateOAuthProviderSettingRequest) returns (UpdateOAuthProviderSettingResponse) {
    option (google.api.http) = {
      put: "/v1/system/auth/oauth-providers/{provider}"
      body: "*"
    };
  }
  // 读取某个语言的官网首页文案与能力卡片，需要 system:site:read。
  rpc GetSiteHome(GetSiteHomeRequest) returns (GetSiteHomeResponse) {
    option (google.api.http) = {get: "/v1/system/site/home"};
  }
  // 保存某个语言的官网首页文案与能力卡片，需要 system:site:write。
  // 能力卡片整体替换，顺序即数组顺序，最多 6 张。
  rpc UpdateSiteHome(UpdateSiteHomeRequest) returns (UpdateSiteHomeResponse) {
    option (google.api.http) = {
      put: "/v1/system/site/home"
      body: "*"
    };
  }
}

// 站点设置。
message SiteSettingsItem {
  // 站点名称，留空时前端回落为 Alioth。
  string site_name = 1 [json_name = "siteName"];
  // logo 地址；只收 URL，不做文件上传。
  string logo_url = 2 [json_name = "logoUrl"];
  // favicon 地址。
  string favicon_url = 3 [json_name = "faviconUrl"];
  // 官方联系邮箱。
  string contact_email = 4 [json_name = "contactEmail"];
  // 代码仓库地址。
  string repository_url = 5 [json_name = "repositoryUrl"];
  // 页脚版权文案，留空时前端按当前年份回落。
  string copyright_text = 6 [json_name = "copyrightText"];
  // ICP 备案号，留空表示不展示。
  string filing_icp_number = 7 [json_name = "filingIcpNumber"];
  // ICP 备案查询地址，留空时前端用工信部备案系统地址。
  string filing_icp_url = 8 [json_name = "filingIcpUrl"];
  // 公安备案号，留空表示不展示。
  string filing_police_number = 9 [json_name = "filingPoliceNumber"];
  // 公安备案查询地址。
  string filing_police_url = 10 [json_name = "filingPoliceUrl"];
  // 备案补充说明，例如备案主体名称。
  string filing_extra_text = 11 [json_name = "filingExtraText"];
  // 最后修改人。
  string updated_by = 12 [json_name = "updatedBy"];
  // 最后修改时间，RFC3339。
  string updated_at = 13 [json_name = "updatedAt"];
}

// 登录方式开关。
message LoginMethodsItem {
  // 是否允许邮箱验证码登录。
  bool email_enabled = 1 [json_name = "emailEnabled"];
  // 是否允许第三方（OAuth2）登录。关闭后不再下发任何来源，直接调用登录接口也不签发凭证。
  bool oauth2_enabled = 2 [json_name = "oauth2Enabled"];
  // 最后修改人。
  string updated_by = 3 [json_name = "updatedBy"];
  // 最后修改时间，RFC3339。
  string updated_at = 4 [json_name = "updatedAt"];
}

// 读取公开站点配置请求。
message GetSiteConfigRequest {
  // 语言，取值为 zh 或 en；留空时按 zh 取。
  string locale = 1 [(buf.validate.field).string = {in: ["", "zh", "en"]}];
}

// 读取公开站点配置响应。
message GetSiteConfigResponse {
  // 站点设置。
  SiteSettingsItem site = 1;
  // 登录方式开关。
  LoginMethodsItem login_methods = 2 [json_name = "loginMethods"];
  // 当前语言的首页文案。
  SiteHomeContentItem home = 3;
  // 当前语言的能力卡片，按排序排列。
  repeated SiteFeatureItem features = 4;
}

// 读取站点设置请求。
message GetSiteSettingsRequest {}

// 读取站点设置响应。
message GetSiteSettingsResponse {
  // 站点设置。
  SiteSettingsItem site = 1;
}

// 保存站点设置请求。
message UpdateSiteSettingsRequest {
  // 站点名称，留空时前端回落为 Alioth。
  string site_name = 1 [json_name = "siteName", (buf.validate.field).string = {max_len: 64}];
  // logo 地址。
  string logo_url = 2 [json_name = "logoUrl", (buf.validate.field).string = {max_len: 512}];
  // favicon 地址。
  string favicon_url = 3 [json_name = "faviconUrl", (buf.validate.field).string = {max_len: 512}];
  // 官方联系邮箱。
  string contact_email = 4 [json_name = "contactEmail", (buf.validate.field).string = {max_len: 128}];
  // 代码仓库地址。
  string repository_url = 5 [json_name = "repositoryUrl", (buf.validate.field).string = {max_len: 512}];
  // 页脚版权文案。
  string copyright_text = 6 [json_name = "copyrightText", (buf.validate.field).string = {max_len: 160}];
  // ICP 备案号。
  string filing_icp_number = 7 [json_name = "filingIcpNumber", (buf.validate.field).string = {max_len: 64}];
  // ICP 备案查询地址，只接受 http(s)。
  string filing_icp_url = 8 [json_name = "filingIcpUrl", (buf.validate.field).string = {max_len: 512}];
  // 公安备案号。
  string filing_police_number = 9 [json_name = "filingPoliceNumber", (buf.validate.field).string = {max_len: 64}];
  // 公安备案查询地址，只接受 http(s)。
  string filing_police_url = 10 [json_name = "filingPoliceUrl", (buf.validate.field).string = {max_len: 512}];
  // 备案补充说明。
  string filing_extra_text = 11 [json_name = "filingExtraText", (buf.validate.field).string = {max_len: 160}];
}

// 保存站点设置响应。
message UpdateSiteSettingsResponse {
  // 保存后的站点设置。
  SiteSettingsItem site = 1;
}

// 读取登录方式开关请求。
message GetLoginMethodsRequest {}

// 读取登录方式开关响应。
message GetLoginMethodsResponse {
  // 登录方式开关。
  LoginMethodsItem login_methods = 1 [json_name = "loginMethods"];
}

// 保存登录方式开关请求。
message UpdateLoginMethodsRequest {
  // 是否允许邮箱验证码登录。
  bool email_enabled = 1 [json_name = "emailEnabled"];
  // 是否允许第三方（OAuth2）登录。
  bool oauth2_enabled = 2 [json_name = "oauth2Enabled"];
}

// 保存登录方式开关响应。
message UpdateLoginMethodsResponse {
  // 保存后的登录方式开关。
  LoginMethodsItem login_methods = 1 [json_name = "loginMethods"];
}

// 官网页面在列表里的展示信息（草稿视角）。
message SitePageItem {
  // 页面标识。
  string uid = 1;
  // 地址片段，同一语言内唯一；首页固定为 home。
  string slug = 2;
  // 语言，取值为 zh 或 en；创建后不可修改。
  string locale = 3;
  // 状态，取值为 DRAFT、PUBLISHED 或 ARCHIVED。
  string state = 4;
  // 是否展示在官网导航。
  bool show_in_nav = 5 [json_name = "showInNav"];
  // 导航顺序，同一语言内唯一。
  int32 sort_order = 6 [json_name = "sortOrder"];
  // 草稿标题。
  string title = 7;
  // 草稿摘要。
  string summary = 8;
  // 草稿与发布快照是否有差异，由服务端比较得出。
  bool has_unpublished_changes = 9 [json_name = "hasUnpublishedChanges"];
  // 最后更新时间，RFC3339。
  string updated_at = 10 [json_name = "updatedAt"];
  // 最近发布时间，RFC3339；从未发布时为空。
  string published_at = 11 [json_name = "publishedAt"];
}

// 页面内容。草稿与发布快照用同一套字段。
message SitePageContent {
  // 标题。
  string title = 1;
  // 摘要，列表与分享卡片使用。
  string summary = 2;
  // 正文 Markdown。
  string body_md = 3 [json_name = "bodyMd"];
  // 封面图地址。
  string cover_image_url = 4 [json_name = "coverImageUrl"];
  // 搜索引擎标题。
  string seo_title = 5 [json_name = "seoTitle"];
  // 搜索引擎描述。
  string seo_description = 6 [json_name = "seoDescription"];
}

// 后台页面详情：草稿与发布快照各一份。
message SitePageDetail {
  // 列表信息。
  SitePageItem item = 1;
  // 草稿内容。
  SitePageContent draft = 2;
  // 已发布内容；从未发布时各字段为空。
  SitePageContent published = 3;
  // 最近发布人。
  string published_by = 4 [json_name = "publishedBy"];
}

// 公开页面。只含已发布字段。
message PublicSitePage {
  // 地址片段。
  string slug = 1;
  // 实际返回内容的语言。
  string locale = 2;
  // 标题。
  string title = 3;
  // 摘要。
  string summary = 4;
  // 正文 Markdown。
  string body_md = 5 [json_name = "bodyMd"];
  // 封面图地址。
  string cover_image_url = 6 [json_name = "coverImageUrl"];
  // 搜索引擎标题。
  string seo_title = 7 [json_name = "seoTitle"];
  // 搜索引擎描述。
  string seo_description = 8 [json_name = "seoDescription"];
  // 发布时间，RFC3339。
  string published_at = 9 [json_name = "publishedAt"];
  // 请求的语言没有可用页面、回落到另一种语言时为 true。
  bool locale_fallback = 10 [json_name = "localeFallback"];
}

// 公开导航项。
message SiteNavItem {
  // 地址片段。
  string slug = 1;
  // 导航标题，取已发布标题。
  string title = 2;
  // 导航顺序。
  int32 sort_order = 3 [json_name = "sortOrder"];
}

// 读取公开页面请求。
message GetPublicSitePageRequest {
  // 地址片段。
  string slug = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  // 语言，取值为 zh 或 en；留空时按 zh 取，取不到回落到另一种语言。
  string locale = 2 [(buf.validate.field).string = {in: ["", "zh", "en"]}];
}

// 读取公开页面响应。
message GetPublicSitePageResponse {
  // 页面。
  PublicSitePage page = 1;
}

// 读取公开导航请求。
message ListPublicSiteNavRequest {
  // 语言，取值为 zh 或 en；留空时按 zh 取。
  string locale = 1 [(buf.validate.field).string = {in: ["", "zh", "en"]}];
}

// 读取公开导航响应。
message ListPublicSiteNavResponse {
  // 导航项，按导航顺序排列。
  repeated SiteNavItem items = 1;
}

// 列出官网页面请求。
message ListSitePagesRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32.gte = 1];
  // 每页数量。
  int32 page_size = 2 [json_name = "pageSize", (buf.validate.field).int32 = {gte: 1, lte: 100}];
  // 标题或 slug 模糊搜索，可空。
  string keyword = 3 [(buf.validate.field).string = {max_len: 64}];
  // 状态过滤，留空表示不限制。
  string state = 4 [(buf.validate.field).string = {in: ["", "DRAFT", "PUBLISHED", "ARCHIVED"]}];
  // 语言过滤，留空表示不限制。
  string locale = 5 [(buf.validate.field).string = {in: ["", "zh", "en"]}];
}

// 列出官网页面响应。
message ListSitePagesResponse {
  // 当前页的页面。
  repeated SitePageItem items = 1;
  // 总数量。
  int32 total = 2;
  // 当前页码。
  int32 page = 3;
  // 每页数量。
  int32 page_size = 4 [json_name = "pageSize"];
}

// 读取页面详情请求。
message GetSitePageRequest {
  // 页面标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 读取页面详情响应。
message GetSitePageResponse {
  // 详情。
  SitePageDetail page = 1;
}

// 新建页面请求。
message CreateSitePageRequest {
  // 地址片段，只允许小写字母、数字与连字符。
  string slug = 1 [(buf.validate.field).string = {min_len: 1, max_len: 64, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"}];
  // 语言，取值为 zh 或 en。
  string locale = 2 [(buf.validate.field).string = {in: ["zh", "en"]}];
  // 标题。
  string title = 3 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  // 摘要。
  string summary = 4 [(buf.validate.field).string = {max_len: 300}];
  // 正文 Markdown。
  string body_md = 5 [json_name = "bodyMd", (buf.validate.field).string = {max_len: 100000}];
  // 封面图地址。
  string cover_image_url = 6 [json_name = "coverImageUrl", (buf.validate.field).string = {max_len: 512}];
  // 搜索引擎标题。
  string seo_title = 7 [json_name = "seoTitle", (buf.validate.field).string = {max_len: 128}];
  // 搜索引擎描述。
  string seo_description = 8 [json_name = "seoDescription", (buf.validate.field).string = {max_len: 320}];
}

// 新建页面响应。
message CreateSitePageResponse {
  // 新建后的详情。
  SitePageDetail page = 1;
}

// 保存草稿请求。
message UpdateSitePageRequest {
  // 页面标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  // 标题。
  string title = 2 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  // 摘要。
  string summary = 3 [(buf.validate.field).string = {max_len: 300}];
  // 正文 Markdown。
  string body_md = 4 [json_name = "bodyMd", (buf.validate.field).string = {max_len: 100000}];
  // 封面图地址。
  string cover_image_url = 5 [json_name = "coverImageUrl", (buf.validate.field).string = {max_len: 512}];
  // 搜索引擎标题。
  string seo_title = 6 [json_name = "seoTitle", (buf.validate.field).string = {max_len: 128}];
  // 搜索引擎描述。
  string seo_description = 7 [json_name = "seoDescription", (buf.validate.field).string = {max_len: 320}];
  // 客户端读到的最后更新时间，RFC3339；用于乐观锁，留空表示不做冲突检查。
  string updated_at = 8 [json_name = "updatedAt"];
}

// 保存草稿响应。
message UpdateSitePageResponse {
  // 保存后的详情。
  SitePageDetail page = 1;
}

// 发布请求。
message PublishSitePageRequest {
  // 页面标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 发布响应。
message PublishSitePageResponse {
  // 发布后的详情。
  SitePageDetail page = 1;
}

// 下架请求。
message UnpublishSitePageRequest {
  // 页面标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 下架响应。
message UnpublishSitePageResponse {
  // 下架后的详情。
  SitePageDetail page = 1;
}

// 删除页面请求。
message DeleteSitePageRequest {
  // 页面标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 删除页面响应。
message DeleteSitePageResponse {}

// 修改导航请求。
message UpdateSitePageNavRequest {
  // 页面标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  // 是否展示在导航。
  bool show_in_nav = 2 [json_name = "showInNav"];
  // 导航顺序。
  int32 sort_order = 3 [json_name = "sortOrder", (buf.validate.field).int32 = {gte: 0, lte: 999}];
}

// 修改导航响应。
message UpdateSitePageNavResponse {
  // 修改后的详情。
  SitePageDetail page = 1;
}

// 邮件服务（SMTP）配置。
message EmailSettingsItem {
  // 是否使用后台配置发信；关闭时回落到服务器配置。
  bool enabled = 1;
  // SMTP 主机。
  string host = 2;
  // SMTP 端口。
  int32 port = 3;
  // SMTP 用户名。
  string username = 4;
  // 发件人地址，支持“显示名 <地址>”写法。
  string from = 5;
  // 是否已经保存过密码；密码本身不回显。
  bool password_set = 6 [json_name = "passwordSet"];
  // 最后修改人。
  string updated_by = 7 [json_name = "updatedBy"];
  // 最后修改时间，RFC3339。
  string updated_at = 8 [json_name = "updatedAt"];
  // 当前生效值的来源：DATABASE（后台配置）、CONFIG（服务器配置）、NONE（都没配）。
  string source = 9;
}

// 读取邮件服务配置请求。
message GetEmailSettingsRequest {}

// 读取邮件服务配置响应。
message GetEmailSettingsResponse {
  // 邮件服务配置。
  EmailSettingsItem email = 1;
}

// 保存邮件服务配置请求。
message UpdateEmailSettingsRequest {
  // 是否使用后台配置发信。
  bool enabled = 1;
  // SMTP 主机。
  string host = 2 [(buf.validate.field).string = {max_len: 255}];
  // SMTP 端口，1–65535。
  int32 port = 3 [(buf.validate.field).int32 = {gte: 0, lte: 65535}];
  // SMTP 用户名。
  string username = 4 [(buf.validate.field).string = {max_len: 255}];
  // 新密码；留空表示保留已存密码。
  string password = 5 [(buf.validate.field).string = {max_len: 512}];
  // 发件人地址。
  string from = 6 [(buf.validate.field).string = {max_len: 320}];
  // 是否清空已存密码。
  bool clear_password = 7 [json_name = "clearPassword"];
}

// 保存邮件服务配置响应。
message UpdateEmailSettingsResponse {
  // 保存后的邮件服务配置。
  EmailSettingsItem email = 1;
}

// 单个第三方登录来源的配置。
message OAuthProviderSettingItem {
  // 来源标识，取值为 GITHUB、GITEE、FEISHU 或 DINGTALK。
  string provider = 1;
  // 展示名。
  string name = 2;
  // 是否启用该来源。
  bool enabled = 3;
  // 客户端标识。
  string client_id = 4 [json_name = "clientId"];
  // 是否已经保存过客户端密钥；密钥本身不回显。
  bool secret_set = 5 [json_name = "secretSet"];
  // 最后修改人。
  string updated_by = 6 [json_name = "updatedBy"];
  // 最后修改时间，RFC3339。
  string updated_at = 7 [json_name = "updatedAt"];
  // 当前生效值的来源：DATABASE、CONFIG 或 NONE。
  string source = 8;
}

// 列出第三方登录来源请求。
message ListOAuthProviderSettingsRequest {}

// 列出第三方登录来源响应。
message ListOAuthProviderSettingsResponse {
  // 来源配置，按 GitHub、Gitee、飞书、钉钉的顺序。
  repeated OAuthProviderSettingItem items = 1;
}

// 保存单个第三方登录来源请求。
message UpdateOAuthProviderSettingRequest {
  // 来源标识。
  string provider = 1 [(buf.validate.field).string = {min_len: 1, max_len: 32}];
  // 是否启用该来源。
  bool enabled = 2;
  // 客户端标识。
  string client_id = 3 [json_name = "clientId", (buf.validate.field).string = {max_len: 256}];
  // 新的客户端密钥；留空表示保留已存密钥。
  string client_secret = 4 [json_name = "clientSecret", (buf.validate.field).string = {max_len: 512}];
  // 是否清空已存密钥。
  bool clear_secret = 5 [json_name = "clearSecret"];
}

// 保存单个第三方登录来源响应。
message UpdateOAuthProviderSettingResponse {
  // 保存后的来源配置。
  OAuthProviderSettingItem item = 1;
}

// 官网首页文案。版式固定，这里只有短文本与一个主视觉地址。
message SiteHomeContentItem {
  // 语言，取值为 zh 或 en。
  string locale = 1;
  // Hero 主标题，最多 16 个字符，不要以站点名开头。
  string hero_title = 2 [json_name = "heroTitle", (buf.validate.field).string = {max_len: 64}];
  // Hero 副标题。
  string hero_subtitle = 3 [json_name = "heroSubtitle", (buf.validate.field).string = {max_len: 256}];
  // Hero 主视觉地址，固定 4:3 槽位，只接受 http(s)。
  string hero_image_url = 4 [json_name = "heroImageUrl", (buf.validate.field).string = {max_len: 512}];
  // 主 CTA 文案；目标是系统槽位，后台改不了。
  string cta_primary_label = 5 [json_name = "ctaPrimaryLabel", (buf.validate.field).string = {max_len: 64}];
  // 次 CTA 文案；与地址同存同空。
  string cta_secondary_label = 6 [json_name = "ctaSecondaryLabel", (buf.validate.field).string = {max_len: 64}];
  // 次 CTA 地址，只允许 / 或 # 开头。
  string cta_secondary_href = 7 [json_name = "ctaSecondaryHref", (buf.validate.field).string = {max_len: 256}];
  // 能力卡片区标题。
  string features_title = 8 [json_name = "featuresTitle", (buf.validate.field).string = {max_len: 64}];
  // 能力卡片区导语。
  string features_subtitle = 9 [json_name = "featuresSubtitle", (buf.validate.field).string = {max_len: 256}];
  // 工作原理区块标题。
  string how_title = 10 [json_name = "howTitle", (buf.validate.field).string = {max_len: 64}];
  // 工作原理区块正文。
  string how_body = 11 [json_name = "howBody", (buf.validate.field).string = {max_len: 384}];
  // 权限模型区块标题。
  string perm_title = 12 [json_name = "permTitle", (buf.validate.field).string = {max_len: 64}];
  // 权限模型区块正文。
  string perm_body = 13 [json_name = "permBody", (buf.validate.field).string = {max_len: 384}];
  // 私有部署区块标题。
  string deploy_title = 14 [json_name = "deployTitle", (buf.validate.field).string = {max_len: 64}];
  // 私有部署区块正文。
  string deploy_body = 15 [json_name = "deployBody", (buf.validate.field).string = {max_len: 384}];
  // 产品说明摘要区标题。
  string doc_title = 16 [json_name = "docTitle", (buf.validate.field).string = {max_len: 64}];
  // 尾部 CTA 标题。
  string closing_title = 17 [json_name = "closingTitle", (buf.validate.field).string = {max_len: 96}];
  // 尾部 CTA 说明。
  string closing_description = 18 [json_name = "closingDescription", (buf.validate.field).string = {max_len: 256}];
  // 尾部 CTA 按钮文案。
  string closing_button_label = 19 [json_name = "closingButtonLabel", (buf.validate.field).string = {max_len: 64}];
  // 最后修改人。
  string updated_by = 20 [json_name = "updatedBy"];
  // 最后修改时间，RFC3339。
  string updated_at = 21 [json_name = "updatedAt"];
}

// 首页能力卡片。
message SiteFeatureItem {
  // 标识；保存时由服务端生成。
  string uid = 1;
  // 图标键名，必须是白名单里的值，例如 shield、bell、activity。
  string icon_key = 2 [json_name = "iconKey", (buf.validate.field).string = {max_len: 32}];
  // 卡片标题。
  string title = 3 [(buf.validate.field).string = {max_len: 64}];
  // 卡片描述。
  string description = 4 [(buf.validate.field).string = {max_len: 192}];
  // 展示顺序，由服务端按数组顺序回填。
  int32 sort_order = 5 [json_name = "sortOrder"];
}

// 读取首页内容请求。
message GetSiteHomeRequest {
  // 语言，取值为 zh 或 en；留空时按 zh 取。
  string locale = 1 [(buf.validate.field).string = {in: ["", "zh", "en"]}];
}

// 读取首页内容响应。
message GetSiteHomeResponse {
  // 首页文案。
  SiteHomeContentItem home = 1;
  // 能力卡片。
  repeated SiteFeatureItem features = 2;
}

// 保存首页内容请求。
message UpdateSiteHomeRequest {
  // 语言，取值为 zh 或 en。
  string locale = 1 [(buf.validate.field).string = {in: ["zh", "en"]}];
  // 首页文案。
  SiteHomeContentItem home = 2;
  // 能力卡片，最多 6 张，顺序即展示顺序。
  repeated SiteFeatureItem features = 3;
}

// 保存首页内容响应。
message UpdateSiteHomeResponse {
  // 保存后的首页文案。
  SiteHomeContentItem home = 1;
  // 保存后的能力卡片。
  repeated SiteFeatureItem features = 2;
}
