syntax = "proto3";

package alioth.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/aide-family/Alioth/api/alioth/v1;v1";

// 实时告警和历史告警的查询与人工处理。
service AlertEventService {
  // 按视图分页查询告警事件。
  rpc ListAlertEvents(ListAlertEventsRequest) returns (ListAlertEventsResponse) {
    option (google.api.http) = {get: "/v1/alert-events"};
  }
  // 获取一条告警事件。
  rpc GetAlertEvent(GetAlertEventRequest) returns (GetAlertEventResponse) {
    option (google.api.http) = {get: "/v1/alert-events/{uid}"};
  }
  // 查询事件开始至今的原始区间数据，用于事件图表。
  rpc GetAlertEventChart(GetAlertEventChartRequest) returns (GetAlertEventChartResponse) {
    option (google.api.http) = {get: "/v1/alert-events/{uid}/chart"};
  }
  // 统计当前租户的实时、抑制和已恢复数量。
  rpc AlertEventStats(AlertEventStatsRequest) returns (AlertEventStatsResponse) {
    option (google.api.http) = {get: "/v1/alert-event-stats"};
  }
  // 实时告警页刷新时一次返回已选 Tab 的数量和全局数量，列表不再为每个 Tab 单独查询。
  rpc AlertEventRealtimeStats(AlertEventRealtimeStatsRequest) returns (AlertEventRealtimeStatsResponse) {
    option (google.api.http) = {get: "/v1/alert-event-realtime-stats"};
  }
  // 概览页的区间聚合：按本地自然日的新增/恢复、级别分布与闭环时长。
  // 服务端一次算完，前端不再翻历史明细自行聚合。
  rpc GetAlertInsight(GetAlertInsightRequest) returns (GetAlertInsightResponse) {
    option (google.api.http) = {get: "/v1/alert-insight"};
  }
  // 历史分析页的顶部汇总：事件总数、去重指纹数与重复事件数。
  rpc GetAlertAnalysisSummary(GetAlertAnalysisSummaryRequest) returns (GetAlertAnalysisSummaryResponse) {
    option (google.api.http) = {get: "/v1/alert-analysis/summary"};
  }
  // 历史分析页的趋势：按小时、天、周或月分桶统计事件数，只返回非空桶。
  rpc GetAlertAnalysisTrend(GetAlertAnalysisTrendRequest) returns (GetAlertAnalysisTrendResponse) {
    option (google.api.http) = {get: "/v1/alert-analysis/trend"};
  }
  // 历史分析页的状态分布：按事件状态统计事件数。
  rpc GetAlertAnalysisStatus(GetAlertAnalysisStatusRequest) returns (GetAlertAnalysisStatusResponse) {
    option (google.api.http) = {get: "/v1/alert-analysis/status"};
  }
  // 历史分析页的级别分布：按告警级别统计事件数。
  rpc GetAlertAnalysisLevel(GetAlertAnalysisLevelRequest) returns (GetAlertAnalysisLevelResponse) {
    option (google.api.http) = {get: "/v1/alert-analysis/level"};
  }
  // 历史分析页的重复指纹：出现两次及以上的指纹、所属规则与事件数。
  rpc GetAlertAnalysisFingerprints(GetAlertAnalysisFingerprintsRequest) returns (GetAlertAnalysisFingerprintsResponse) {
    option (google.api.http) = {get: "/v1/alert-analysis/fingerprints"};
  }
  // 历史分析页的恢复时长：自动恢复与人工恢复的闭环时长中位数和 P90。
  rpc GetAlertAnalysisRecovery(GetAlertAnalysisRecoveryRequest) returns (GetAlertAnalysisRecoveryResponse) {
    option (google.api.http) = {get: "/v1/alert-analysis/recovery"};
  }
  // 介入一条实时告警。
  rpc InterveneAlertEvent(InterveneAlertEventRequest) returns (InterveneAlertEventResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/{uid}/intervene"
      body: "*"
    };
  }
  // 批量介入实时告警。
  rpc InterveneAlertEvents(InterveneAlertEventsRequest) returns (InterveneAlertEventsResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/intervene"
      body: "*"
    };
  }
  // 抑制一条实时告警。
  rpc SuppressAlertEvent(SuppressAlertEventRequest) returns (SuppressAlertEventResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/{uid}/suppress"
      body: "*"
    };
  }
  // 手工恢复一条实时告警。
  rpc RecoverAlertEvent(RecoverAlertEventRequest) returns (RecoverAlertEventResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/{uid}/recover"
      body: "*"
    };
  }
  // 批量手工恢复实时告警。
  rpc RecoverAlertEvents(RecoverAlertEventsRequest) returns (RecoverAlertEventsResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/recover"
      body: "*"
    };
  }
}

// 告警事件。
message AlertEventItem {
  // 标识。
  string uid = 1;
  // 规则标识。
  string rule_uid = 2;
  // 数据源标识。
  string datasource_uid = 3;
  // fingerprint。
  string fingerprint = 4;
  // 状态，取值为 FIRING、RECOVERED 或 RECOVERED_BY_MANUAL。
  string status = 5;
  // 表达式。
  string expr = 6;
  // 标签 JSON。
  string labels = 7;
  // 摘要。
  string summary = 8;
  // 描述。
  string description = 9;
  // 采样值。
  string sample_value = 10;
  // 告警级别标识。
  string level_uid = 11;
  // 开始时间，RFC3339。
  string starts_at = 12;
  // 结束时间，RFC3339。未结束时为空。
  string ends_at = 13;
  // 评测批次，RFC3339。
  string eval_slot = 14;
  // 是否抑制。
  bool suppressed = 15;
  // 介入人标识。
  string intervened_by = 16;
  // 创建时间，RFC3339。
  string created_at = 17;
  // 介入时间，RFC3339。未介入时为空。
  string intervened_at = 18 [json_name = "intervenedAt"];
  // 介入人展示名。优先昵称，其次姓名，再次邮箱。
  string intervened_name = 19 [json_name = "intervenedName"];
  // 数据源名称。数据源被删除后仍保留历史名称。
  string datasource_name = 20 [json_name = "datasourceName"];
  // 规则名称。规则被删除后仍保留历史名称。
  string rule_name = 21 [json_name = "ruleName"];
  // 规则所属规则组标识，用于跳转规则详情。
  string rule_group_uid = 22 [json_name = "ruleGroupUid"];
  // 告警级别名称。级别被删除后仍保留历史名称。
  string level_name = 23 [json_name = "levelName"];
  // 抑制结束时间，RFC3339。未抑制或未设置时长时为空。
  string suppressed_until = 24 [json_name = "suppressedUntil"];
}

// 告警分页查询。
message ListAlertEventsRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32 = {gte: 0}];
  // 每页条数，最大 100。
  int32 page_size = 2 [json_name = "pageSize", (buf.validate.field).int32 = {gte: 0, lte: 100}];
  // 视图，取值为 REALTIME 或 HISTORY。空值表示实时。
  string view = 3;
  // 按摘要或 fingerprint 过滤。
  string name = 4;
  // 为真时只返回当前用户作为通知接收方的实时告警。与 page_uid 互斥。
  bool mine = 5;
  // 按告警页面的标签匹配过滤。与 mine 互斥。
  string page_uid = 6 [json_name = "pageUid"];
  // 按告警等级过滤。空值表示全部等级。
  string level_uid = 7 [json_name = "levelUid"];
  // 按事件开始时间筛选，RFC3339，包含下界。
  string starts_at_from = 8 [json_name = "startsAtFrom"];
  // RFC3339 排他上界；选择日期范围时传结束日期之后的本地午夜。
  string starts_at_to = 9 [json_name = "startsAtTo"];
  // 仅 HISTORY 支持：FIRING、RECOVERED 或 RECOVERED_BY_MANUAL。
  string event_status = 10 [json_name = "eventStatus"];
  // 仅 HISTORY 支持：按规则名称进行不区分大小写的包含查询。
  string rule_name = 11 [json_name = "ruleName"];
  // 仅 HISTORY 支持：按数据源名称进行不区分大小写的包含查询。
  string datasource_name = 12 [json_name = "datasourceName"];
  // 仅 HISTORY 支持：空值表示全部，或 SUPPRESSED / UNSUPPRESSED。
  string suppression = 13;
}

// 告警分页结果。
message ListAlertEventsResponse {
  // 事件。
  repeated AlertEventItem items = 1;
  // 总数。
  int32 total = 2;
  // 页码。
  int32 page = 3;
  // 每页条数。
  int32 page_size = 4 [json_name = "pageSize"];
}

// 要查询的告警。
message GetAlertEventRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 告警详情。
message GetAlertEventResponse {
  // 事件。
  AlertEventItem event = 1;
}

// 要查询图表的告警。
message GetAlertEventChartRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 告警事件开始至今的原始区间数据。
message GetAlertEventChartResponse {
  // 数据源名称。
  string datasource_name = 1 [json_name = "datasourceName"];
  // 规则表达式。
  string expr = 2;
  // 开始时间，Unix 秒。
  int64 start = 3;
  // 结束时间，Unix 秒。
  int64 end = 4;
  // 查询步长，秒。
  int64 step = 5;
  // 数据源原始响应，通常是指标数据的 JSON 文本。
  string body = 6;
}

// 统计不需要参数。
message AlertEventStatsRequest {}

// 当前租户的告警数量。
message AlertEventStatsResponse {
  // 未抑制的 FIRING 数量。
  int32 firing = 1;
  // 已抑制且仍为 FIRING 的数量。
  int32 suppressed = 2;
  // 已恢复数量。
  int32 recovered = 3;
}

// 实时告警页刷新不需要参数。统计范围由当前用户已选择的 Tab 决定。
message AlertEventRealtimeStatsRequest {}

// 一个实时 Tab 的告警数量。
message AlertEventRealtimeTabStat {
  // Tab 标识，我的告警固定为 mine，其余为告警页面 uid。
  string id = 1;
  // 该 Tab 下未抑制的 FIRING 数量。
  int32 count = 2;
}

// 实时告警页一次刷新使用的数量统计。
message AlertEventRealtimeStatsResponse {
  // 已选择显示的 Tab 数量，首项为我的告警，与 ListMyRealtimeTabs 的顺序一致。
  repeated AlertEventRealtimeTabStat tabs = 1;
  // 未抑制的 FIRING 数量。
  int32 firing = 2;
  // 已抑制且仍为 FIRING 的数量。
  int32 suppressed = 3;
  // 已恢复数量。
  int32 recovered = 4;
}

// 要介入的告警。
message InterveneAlertEventRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 介入已记录。
message InterveneAlertEventResponse {}

// 要批量介入的告警。
message InterveneAlertEventsRequest {
  // 标识列表。
  repeated string uids = 1 [(buf.validate.field).repeated.min_items = 1];
}

// 批量介入已记录。
message InterveneAlertEventsResponse {}

// 要抑制的告警。
message SuppressAlertEventRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  // 抑制时长，秒。范围为 0 到 2592000（30 天）；0 表示沿用默认时长，permanent 为真时忽略。
  int64 suppressed_seconds = 2 [json_name = "suppressedSeconds", (buf.validate.field).int64 = {gte: 0, lte: 2592000}];
  // 永久抑制。为真时不设置到期时间，直到人工恢复。
  bool permanent = 3;
}

// 抑制已记录。
message SuppressAlertEventResponse {
  // 抑制结束时间，RFC3339。永久抑制时为空。
  string suppressed_until = 1 [json_name = "suppressedUntil"];
}

// 要手工恢复的告警。
message RecoverAlertEventRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 手工恢复已记录。
message RecoverAlertEventResponse {}

// 要批量手工恢复的告警。
message RecoverAlertEventsRequest {
  // 标识列表。
  repeated string uids = 1 [(buf.validate.field).repeated.min_items = 1];
}

// 批量手工恢复已记录。
message RecoverAlertEventsResponse {}

// 概览区间聚合的查询条件。
message GetAlertInsightRequest {
  // 统计天数，取值 1..30，0 表示默认 7 天（含今天）。
  int32 days = 1 [(buf.validate.field).int32 = {gte: 0, lte: 30}];
  // IANA 时区名，用于本地自然日分桶；空值使用 UTC。
  string time_zone = 2 [json_name = "timeZone"];
}

// 一天的聚合结果。
// 新增按 starts_at 分桶、闭环按 ends_at 分桶：同一天的两根柱不是同一批事件，
// 当天闭环的事件通常是前几天触发的，所以两根柱不构成合计。
message AlertInsightBucket {
  // 本地自然日零点，RFC3339。
  string start = 1;
  // 当天新增事件数（starts_at 落在当天）。
  int32 events = 2;
  // 当天闭环数（ends_at 落在当天）。
  int32 closed = 3;
  // 其中人工闭环的数量。
  int32 closed_by_manual = 4 [json_name = "closedByManual"];
  // 当天闭环事件的闭环时长中位数，秒；没有样本时为 0。
  double p50_seconds = 5 [json_name = "p50Seconds"];
  // 当天闭环事件的闭环时长 P90，秒；最近秩口径，与历史分析页一致。
  double p90_seconds = 6 [json_name = "p90Seconds"];
  // 参与分位数的闭环事件数。
  int32 recovery_samples = 7 [json_name = "recoverySamples"];
}

// 按告警级别的分布。
message AlertInsightLevel {
  // 级别标识。
  string level_uid = 1 [json_name = "levelUid"];
  // 该级别的事件数。
  int32 events = 2;
  // 其中仍未恢复的数量。
  int32 firing = 3;
}

// 概览区间聚合结果。
message GetAlertInsightResponse {
  // 实际使用的时区。
  string time_zone = 1 [json_name = "timeZone"];
  // 统计起始时间（含），RFC3339。
  string from = 2;
  // 统计结束时间（不含），RFC3339。
  string to = 3;
  // 每日聚合，按日期升序，缺失的日期补零。
  repeated AlertInsightBucket buckets = 4;
  // 级别分布，按事件数降序。
  repeated AlertInsightLevel levels = 5;
  // 区间内闭环事件的闭环时长中位数，秒。
  double p50_seconds = 6 [json_name = "p50Seconds"];
  // 区间内闭环事件的闭环时长 P90，秒。
  double p90_seconds = 7 [json_name = "p90Seconds"];
  // 参与分位数的闭环事件数。
  int32 recovery_samples = 8 [json_name = "recoverySamples"];
  // 区间内新增事件总数。
  int32 events_total = 9 [json_name = "eventsTotal"];
  // 区间内闭环事件总数。
  int32 closed_total = 10 [json_name = "closedTotal"];
  // 为假表示历史分库不可用，结果只含实时表数据。
  bool complete = 11;
}

// 历史告警分析的公共查询条件。
// from/to 是本地自然日，含首尾；统计窗口为 from 当天零点到 to 次日的本地零点（不含）。
// focus_start/focus_end 可选，成对出现时把整段聚合换成聚焦窗口。
// 各分析接口的请求按这些说明重复声明字段，因为 GET 查询参数需要平铺在请求上。
message GetAlertAnalysisSummaryRequest {
  // 起始本地自然日，格式 YYYY-MM-DD，含当天。
  string from = 1;
  // 结束本地自然日，格式 YYYY-MM-DD，含当天，不得晚于时区下的今天。
  string to = 2;
  // IANA 时区名，用于本地自然日与趋势分桶；空值使用 UTC。
  string time_zone = 3 [json_name = "timeZone"];
  // 事件状态过滤：空值表示全部历史事件，或 RECOVERED、RECOVERED_BY_MANUAL、SUPPRESSING。
  string status = 4;
  // 聚焦窗口起点，RFC3339；与 focus_end 成对出现，并且落在 from/to 窗口内。
  string focus_start = 5 [json_name = "focusStart"];
  // 聚焦窗口终点，RFC3339；必须晚于 focus_start。
  string focus_end = 6 [json_name = "focusEnd"];
}

// 历史告警分析的汇总指标。
message GetAlertAnalysisSummaryResponse {
  // 实际使用的统计窗口起点，本地时区 RFC3339；聚焦时是聚焦窗口起点。
  string from = 1;
  // 实际使用的统计窗口终点（不含），本地时区 RFC3339。
  string to = 2;
  // 实际使用的时区。
  string time_zone = 3 [json_name = "timeZone"];
  // 为假表示历史分库不可用，结果只含实时表数据。
  bool complete = 4;
  // 窗口内的事件总数。
  int64 events = 5;
  // 窗口内出现过的去重指纹数，空指纹不计入。
  int64 unique_fingerprints = 6 [json_name = "uniqueFingerprints"];
  // 重复事件数：同一指纹第 2 次及以后的出现次数。
  int64 repeated = 7;
}

// 历史告警趋势的查询条件。
message GetAlertAnalysisTrendRequest {
  // 起始本地自然日，格式 YYYY-MM-DD，含当天。
  string from = 1;
  // 结束本地自然日，格式 YYYY-MM-DD，含当天，不得晚于时区下的今天。
  string to = 2;
  // IANA 时区名，用于本地自然日与趋势分桶；空值使用 UTC。
  string time_zone = 3 [json_name = "timeZone"];
  // 事件状态过滤：空值表示全部历史事件，或 RECOVERED、RECOVERED_BY_MANUAL、SUPPRESSING。
  string status = 4;
  // 分桶粒度，取值为 hour、day、week 或 month；空值表示 day。
  // 周桶以周一为起点（PostgreSQL 的 ISO 周），趋势忽略 focusStart/focusEnd。
  string granularity = 5;
}

// 趋势的一个非空时间桶。
message AlertAnalysisBucket {
  // 桶起点，本地时区 RFC3339。周桶是周一零点，月桶是当月一日零点。
  string start = 1;
  // 桶内事件数。
  int64 events = 2;
}

// 历史告警趋势结果，按桶起点升序，只包含非空桶。
message GetAlertAnalysisTrendResponse {
  // 统计窗口起点，本地时区 RFC3339。
  string from = 1;
  // 统计窗口终点（不含），本地时区 RFC3339。
  string to = 2;
  // 实际使用的时区。
  string time_zone = 3 [json_name = "timeZone"];
  // 为假表示历史分库不可用，结果只含实时表数据。
  bool complete = 4;
  // 非空时间桶。
  repeated AlertAnalysisBucket buckets = 5;
}

// 历史告警状态分布的查询条件。
message GetAlertAnalysisStatusRequest {
  // 起始本地自然日，格式 YYYY-MM-DD，含当天。
  string from = 1;
  // 结束本地自然日，格式 YYYY-MM-DD，含当天，不得晚于时区下的今天。
  string to = 2;
  // IANA 时区名；空值使用 UTC。
  string time_zone = 3 [json_name = "timeZone"];
  // 事件状态过滤：空值表示全部历史事件，或 RECOVERED、RECOVERED_BY_MANUAL、SUPPRESSING。
  string status = 4;
  // 聚焦窗口起点，RFC3339；与 focus_end 成对出现，并且落在 from/to 窗口内。
  string focus_start = 5 [json_name = "focusStart"];
  // 聚焦窗口终点，RFC3339；必须晚于 focus_start。
  string focus_end = 6 [json_name = "focusEnd"];
}

// 一种状态的事件数。
message AlertAnalysisStatusItem {
  // 事件状态，取值为 FIRING、RECOVERED 或 RECOVERED_BY_MANUAL。
  string status = 1;
  // 该状态的事件数。
  int64 events = 2;
}

// 历史告警状态分布结果。
message GetAlertAnalysisStatusResponse {
  // 为假表示历史分库不可用，结果只含实时表数据。
  bool complete = 1;
  // 各状态事件数之和。
  int64 total = 2;
  // 状态分布，按事件数降序，事件数相同时按状态升序。
  repeated AlertAnalysisStatusItem items = 3;
}

// 历史告警级别分布的查询条件。
message GetAlertAnalysisLevelRequest {
  // 起始本地自然日，格式 YYYY-MM-DD，含当天。
  string from = 1;
  // 结束本地自然日，格式 YYYY-MM-DD，含当天，不得晚于时区下的今天。
  string to = 2;
  // IANA 时区名；空值使用 UTC。
  string time_zone = 3 [json_name = "timeZone"];
  // 事件状态过滤：空值表示全部历史事件，或 RECOVERED、RECOVERED_BY_MANUAL、SUPPRESSING。
  string status = 4;
  // 聚焦窗口起点，RFC3339；与 focus_end 成对出现，并且落在 from/to 窗口内。
  string focus_start = 5 [json_name = "focusStart"];
  // 聚焦窗口终点，RFC3339；必须晚于 focus_start。
  string focus_end = 6 [json_name = "focusEnd"];
}

// 一个告警级别的事件数。
message AlertAnalysisLevelItem {
  // 告警级别标识；空表示事件没有级别。
  string level_uid = 1 [json_name = "levelUid"];
  // 该级别的事件数。
  int64 events = 2;
}

// 历史告警级别分布结果。
message GetAlertAnalysisLevelResponse {
  // 为假表示历史分库不可用，结果只含实时表数据。
  bool complete = 1;
  // 各等级事件数之和。
  int64 total = 2;
  // 级别分布，按事件数降序，事件数相同时按级别标识升序。
  repeated AlertAnalysisLevelItem items = 3;
}

// 历史告警重复指纹的查询条件。
message GetAlertAnalysisFingerprintsRequest {
  // 起始本地自然日，格式 YYYY-MM-DD，含当天。
  string from = 1;
  // 结束本地自然日，格式 YYYY-MM-DD，含当天，不得晚于时区下的今天。
  string to = 2;
  // IANA 时区名；空值使用 UTC。
  string time_zone = 3 [json_name = "timeZone"];
  // 事件状态过滤：空值表示全部历史事件，或 RECOVERED、RECOVERED_BY_MANUAL、SUPPRESSING。
  string status = 4;
  // 聚焦窗口起点，RFC3339；与 focus_end 成对出现，并且落在 from/to 窗口内。
  string focus_start = 5 [json_name = "focusStart"];
  // 聚焦窗口终点，RFC3339；必须晚于 focus_start。
  string focus_end = 6 [json_name = "focusEnd"];
  // 返回条数，默认 5，取值 1..20。
  int32 limit = 7;
}

// 一个重复出现的指纹。
message AlertAnalysisFingerprintItem {
  // 事件指纹。
  string fingerprint = 1;
  // 指纹所属规则标识。
  string rule_uid = 2 [json_name = "ruleUid"];
  // 指纹所属规则名称；规则被删除后仍返回历史名称。
  string rule_name = 3 [json_name = "ruleName"];
  // 该指纹的事件数，只返回大于 1 的指纹。
  int64 events = 4;
}

// 历史告警重复指纹结果。
message GetAlertAnalysisFingerprintsResponse {
  // 为假表示历史分库不可用，结果只含实时表数据。
  bool complete = 1;
  // 重复指纹，按事件数降序，事件数相同时按指纹升序。
  repeated AlertAnalysisFingerprintItem items = 2;
}

// 历史告警恢复时长的查询条件。
message GetAlertAnalysisRecoveryRequest {
  // 起始本地自然日，格式 YYYY-MM-DD，含当天。
  string from = 1;
  // 结束本地自然日，格式 YYYY-MM-DD，含当天，不得晚于时区下的今天。
  string to = 2;
  // IANA 时区名；空值使用 UTC。
  string time_zone = 3 [json_name = "timeZone"];
  // 事件状态过滤：空值表示全部历史事件，或 RECOVERED、RECOVERED_BY_MANUAL、SUPPRESSING。
  string status = 4;
  // 聚焦窗口起点，RFC3339；与 focus_end 成对出现，并且落在 from/to 窗口内。
  string focus_start = 5 [json_name = "focusStart"];
  // 聚焦窗口终点，RFC3339；必须晚于 focus_start。
  string focus_end = 6 [json_name = "focusEnd"];
}

// 一类恢复方式的闭环时长统计。
message AlertAnalysisRecoveryStats {
  // 闭环时长中位数，秒；没有样本时为 0。
  double median_seconds = 1 [json_name = "medianSeconds"];
  // 闭环时长 P90，秒；最近秩口径，没有样本时为 0。
  double p90_seconds = 2 [json_name = "p90Seconds"];
  // 参与统计的闭环事件数，只统计 ends_at 非空的事件。
  int64 samples = 3;
}

// 历史告警恢复时长结果。
message GetAlertAnalysisRecoveryResponse {
  // 为假表示历史分库不可用，结果只含实时表数据。
  bool complete = 1;
  // 自动恢复（RECOVERED）的闭环时长。
  AlertAnalysisRecoveryStats auto = 2;
  // 人工恢复（RECOVERED_BY_MANUAL）的闭环时长。
  AlertAnalysisRecoveryStats manual = 3;
}
