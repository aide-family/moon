syntax = "proto3";

package alioth.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/aide-family/Alioth/api/alioth/v1;v1";

// 实时告警和历史告警的查询与人工处理。
service AlertEventService {
  // 按视图分页查询告警事件。
  rpc ListAlertEvents(ListAlertEventsRequest) returns (ListAlertEventsResponse) {
    option (google.api.http) = {get: "/v1/alert-events"};
  }
  // 获取一条告警事件。
  rpc GetAlertEvent(GetAlertEventRequest) returns (GetAlertEventResponse) {
    option (google.api.http) = {get: "/v1/alert-events/{uid}"};
  }
  // 查询事件开始至今的原始区间数据，用于事件图表。
  rpc GetAlertEventChart(GetAlertEventChartRequest) returns (GetAlertEventChartResponse) {
    option (google.api.http) = {get: "/v1/alert-events/{uid}/chart"};
  }
  // 统计当前租户的实时、抑制和已恢复数量。
  rpc AlertEventStats(AlertEventStatsRequest) returns (AlertEventStatsResponse) {
    option (google.api.http) = {get: "/v1/alert-event-stats"};
  }
  // 实时告警页刷新时一次返回已选 Tab 的数量和全局数量，列表不再为每个 Tab 单独查询。
  rpc AlertEventRealtimeStats(AlertEventRealtimeStatsRequest) returns (AlertEventRealtimeStatsResponse) {
    option (google.api.http) = {get: "/v1/alert-event-realtime-stats"};
  }
  // 介入一条实时告警。
  rpc InterveneAlertEvent(InterveneAlertEventRequest) returns (InterveneAlertEventResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/{uid}/intervene"
      body: "*"
    };
  }
  // 批量介入实时告警。
  rpc InterveneAlertEvents(InterveneAlertEventsRequest) returns (InterveneAlertEventsResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/intervene"
      body: "*"
    };
  }
  // 抑制一条实时告警。
  rpc SuppressAlertEvent(SuppressAlertEventRequest) returns (SuppressAlertEventResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/{uid}/suppress"
      body: "*"
    };
  }
  // 手工恢复一条实时告警。
  rpc RecoverAlertEvent(RecoverAlertEventRequest) returns (RecoverAlertEventResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/{uid}/recover"
      body: "*"
    };
  }
  // 批量手工恢复实时告警。
  rpc RecoverAlertEvents(RecoverAlertEventsRequest) returns (RecoverAlertEventsResponse) {
    option (google.api.http) = {
      post: "/v1/alert-events/recover"
      body: "*"
    };
  }
}

// 告警事件。
message AlertEventItem {
  // 标识。
  string uid = 1;
  // 规则标识。
  string rule_uid = 2;
  // 数据源标识。
  string datasource_uid = 3;
  // fingerprint。
  string fingerprint = 4;
  // 状态，取值为 FIRING、RECOVERED 或 RECOVERED_BY_MANUAL。
  string status = 5;
  // 表达式。
  string expr = 6;
  // 标签 JSON。
  string labels = 7;
  // 摘要。
  string summary = 8;
  // 描述。
  string description = 9;
  // 采样值。
  string sample_value = 10;
  // 告警级别标识。
  string level_uid = 11;
  // 开始时间，RFC3339。
  string starts_at = 12;
  // 结束时间，RFC3339。未结束时为空。
  string ends_at = 13;
  // 评测批次，RFC3339。
  string eval_slot = 14;
  // 是否抑制。
  bool suppressed = 15;
  // 介入人标识。
  string intervened_by = 16;
  // 创建时间，RFC3339。
  string created_at = 17;
  // 介入时间，RFC3339。未介入时为空。
  string intervened_at = 18 [json_name = "intervenedAt"];
  // 介入人展示名。优先昵称，其次姓名，再次邮箱。
  string intervened_name = 19 [json_name = "intervenedName"];
  // 数据源名称。数据源被删除后仍保留历史名称。
  string datasource_name = 20 [json_name = "datasourceName"];
  // 规则名称。规则被删除后仍保留历史名称。
  string rule_name = 21 [json_name = "ruleName"];
  // 规则所属规则组标识，用于跳转规则详情。
  string rule_group_uid = 22 [json_name = "ruleGroupUid"];
  // 告警级别名称。级别被删除后仍保留历史名称。
  string level_name = 23 [json_name = "levelName"];
  // 抑制结束时间，RFC3339。未抑制或未设置时长时为空。
  string suppressed_until = 24 [json_name = "suppressedUntil"];
}

// 告警分页查询。
message ListAlertEventsRequest {
  // 页码，从 1 开始。
  int32 page = 1 [(buf.validate.field).int32 = {gte: 0}];
  // 每页条数，最大 100。
  int32 page_size = 2 [json_name = "pageSize", (buf.validate.field).int32 = {gte: 0, lte: 100}];
  // 视图，取值为 REALTIME 或 HISTORY。空值表示实时。
  string view = 3;
  // 按摘要或 fingerprint 过滤。
  string name = 4;
  // 为真时只返回当前用户作为通知接收方的实时告警。与 page_uid 互斥。
  bool mine = 5;
  // 按告警页面的标签匹配过滤。与 mine 互斥。
  string page_uid = 6 [json_name = "pageUid"];
  // 按告警等级过滤。空值表示全部等级。
  string level_uid = 7 [json_name = "levelUid"];
}

// 告警分页结果。
message ListAlertEventsResponse {
  // 事件。
  repeated AlertEventItem items = 1;
  // 总数。
  int32 total = 2;
  // 页码。
  int32 page = 3;
  // 每页条数。
  int32 page_size = 4 [json_name = "pageSize"];
}

// 要查询的告警。
message GetAlertEventRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 告警详情。
message GetAlertEventResponse {
  // 事件。
  AlertEventItem event = 1;
}

// 要查询图表的告警。
message GetAlertEventChartRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 告警事件开始至今的原始区间数据。
message GetAlertEventChartResponse {
  // 数据源名称。
  string datasource_name = 1 [json_name = "datasourceName"];
  // 规则表达式。
  string expr = 2;
  // 开始时间，Unix 秒。
  int64 start = 3;
  // 结束时间，Unix 秒。
  int64 end = 4;
  // 查询步长，秒。
  int64 step = 5;
  // 数据源原始响应，通常是指标数据的 JSON 文本。
  string body = 6;
}

// 统计不需要参数。
message AlertEventStatsRequest {}

// 当前租户的告警数量。
message AlertEventStatsResponse {
  // 未抑制的 FIRING 数量。
  int32 firing = 1;
  // 已抑制且仍为 FIRING 的数量。
  int32 suppressed = 2;
  // 已恢复数量。
  int32 recovered = 3;
}

// 实时告警页刷新不需要参数。统计范围由当前用户已选择的 Tab 决定。
message AlertEventRealtimeStatsRequest {}

// 一个实时 Tab 的告警数量。
message AlertEventRealtimeTabStat {
  // Tab 标识，我的告警固定为 mine，其余为告警页面 uid。
  string id = 1;
  // 该 Tab 下未抑制的 FIRING 数量。
  int32 count = 2;
}

// 实时告警页一次刷新使用的数量统计。
message AlertEventRealtimeStatsResponse {
  // 已选择显示的 Tab 数量，首项为我的告警，与 ListMyRealtimeTabs 的顺序一致。
  repeated AlertEventRealtimeTabStat tabs = 1;
  // 未抑制的 FIRING 数量。
  int32 firing = 2;
  // 已抑制且仍为 FIRING 的数量。
  int32 suppressed = 3;
  // 已恢复数量。
  int32 recovered = 4;
}

// 要介入的告警。
message InterveneAlertEventRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 介入已记录。
message InterveneAlertEventResponse {}

// 要批量介入的告警。
message InterveneAlertEventsRequest {
  // 标识列表。
  repeated string uids = 1 [(buf.validate.field).repeated.min_items = 1];
}

// 批量介入已记录。
message InterveneAlertEventsResponse {}

// 要抑制的告警。
message SuppressAlertEventRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
  // 抑制时长，秒。范围为 0 到 2592000（30 天）；0 表示沿用默认时长，permanent 为真时忽略。
  int64 suppressed_seconds = 2 [json_name = "suppressedSeconds", (buf.validate.field).int64 = {gte: 0, lte: 2592000}];
  // 永久抑制。为真时不设置到期时间，直到人工恢复。
  bool permanent = 3;
}

// 抑制已记录。
message SuppressAlertEventResponse {
  // 抑制结束时间，RFC3339。永久抑制时为空。
  string suppressed_until = 1 [json_name = "suppressedUntil"];
}

// 要手工恢复的告警。
message RecoverAlertEventRequest {
  // 标识。
  string uid = 1 [(buf.validate.field).string.min_len = 1];
}

// 手工恢复已记录。
message RecoverAlertEventResponse {}

// 要批量手工恢复的告警。
message RecoverAlertEventsRequest {
  // 标识列表。
  repeated string uids = 1 [(buf.validate.field).repeated.min_items = 1];
}

// 批量手工恢复已记录。
message RecoverAlertEventsResponse {}
