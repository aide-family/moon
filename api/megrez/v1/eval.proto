syntax = "proto3";

package megrez.v1;

option go_package = "github.com/aide-family/moon/api/megrez/v1;v1";

// 评测领取和回写。只提供 gRPC，由玉衡实现，天权持 service key 调用。
service EvalService {
  // 领取已调度且尚未回写的规则快照。
  rpc ClaimRules(ClaimRulesRequest) returns (ClaimRulesResponse);
  // 回写命中、恢复，或标明驱动尚未实现。
  rpc ReportEval(ReportEvalRequest) returns (ReportEvalResponse);
  // 上报天权实例心跳与当前评测任务。
  rpc ReportWorkerStatus(ReportWorkerStatusRequest) returns (ReportWorkerStatusResponse);
  // 领取待探测的「规则 × 目标组 × 目标」。
  rpc ClaimProbeTasks(ClaimProbeTasksRequest) returns (ClaimProbeTasksResponse);
  // 回写一次探测结果，按目标逐条提交。
  rpc ReportProbeResults(ReportProbeResultsRequest) returns (ReportProbeResultsResponse);
}

// 执行器身份。一期只有 CLUSTER，EDGE 留给后续的边缘探测。
message ProbeExecutor {
  // 执行器类型，取值为 CLUSTER 或 EDGE。
  string kind = 1;
  // 执行器标签 JSON。集群内为空对象。
  string labels = 2;
}

// 领取探测任务。只接受 service key megrez。
message ClaimProbeTasksRequest {
  // 执行器身份。
  ProbeExecutor executor = 1;
}

// 本轮可执行的探测任务。
message ClaimProbeTasksResponse {
  repeated ProbeTask tasks = 1;
}

// 一条探测任务：一个规则在一个目标组的一批目标上的一次探测。
message ProbeTask {
  // 规则快照。
  ProbeRuleSnapshot rule = 1;
  // 目标组快照。
  ProbeGroupSnapshot group = 2;
  // 本批目标。
  repeated ProbeTargetRef targets = 3;
  // 计划时刻，RFC3339。
  string slot = 4;
}

// 探测任务里的规则快照。
message ProbeRuleSnapshot {
  string uid = 1;
  string namespace_uid = 2;
  string name = 3;
  string driver = 4;
  // 观测指标，取值为 UP、LATENCY_MS、STATUS_CODE、CERT_DAYS。
  string probe_metric = 5;
  int32 probe_interval_seconds = 6;
  string labels = 7;
  string summary = 8;
  string description = 9;
  repeated LevelCondition levels = 10;
}

// 探测任务里的目标组快照。
message ProbeGroupSnapshot {
  string uid = 1;
  string name = 2;
  string labels = 3;
  // 组内地址共用的请求参数。
  ProbeRequestSnapshot request = 4;
}

// 探测请求参数快照。
message ProbeRequestSnapshot {
  string method = 1;
  string expect_status = 2;
  int32 timeout_ms = 3;
  bool follow_redirects = 4;
  bool skip_tls_verify = 5;
  bool verify_cert = 6;
  string headers = 7;
  string body_keyword = 8;
}

// 一个待探测目标。
message ProbeTargetRef {
  string uid = 1;
  string spec = 2;
  string labels = 3;
}

// 回写探测结果。
message ReportProbeResultsRequest {
  // 规则标识。
  string rule_uid = 1;
  // 领取时的计划时刻，RFC3339。
  string slot = 2;
  // 本次结果，按目标逐条。
  repeated ProbeResult results = 3;
}

// 单个目标的探测结果。
message ProbeResult {
  string target_uid = 1;
  bool ok = 2;
  // 观测值：up 取 1/0，耗时为毫秒，状态码为整数，证书剩余天数为天数。
  string value = 3;
  int32 duration_ms = 4;
  int32 status_code = 5;
  // 失败分类：dns / connect / tls / timeout / status / keyword / redirect / protocol。
  string error_kind = 6;
  string error_message = 7;
  int32 dns_ms = 8;
  int32 tcp_ms = 9;
  int32 tls_ms = 10;
  int32 ttfb_ms = 11;
  int32 cert_days = 12;
  string resolved_ip = 13;
  // 执行器标识。
  string executor = 14;
}

// 回写已接受。
message ReportProbeResultsResponse {}

// 领取不需要参数，也不要求租户头。
message ClaimRulesRequest {}

// 本轮可评测的规则。
message ClaimRulesResponse {
  // 规则快照。
  repeated RuleSnapshot rules = 1;
}

// 一条待评测规则，含数据源连接信息和当前 FIRING fingerprint。
message RuleSnapshot {
  // 规则标识。
  string uid = 1;
  // 租户标识。
  string namespace_uid = 2;
  reserved 3;
  reserved "type";
  // 驱动。规则只保存驱动，类型由驱动推导。
  string driver = 4;
  // 表达式。
  string expr = 5;
  // 标签 JSON。
  string labels = 6;
  // 摘要。
  string summary = 7;
  // 描述。
  string description = 8;
  // 本轮评测批次，RFC3339 时间。
  string eval_slot = 9;
  // 数据源地址。
  string datasource_endpoint = 10;
  // 数据源用户名。
  string datasource_username = 11;
  // 数据源密码。只出现在这条内部响应里。
  string datasource_password = 12;
  // 数据源密钥。只出现在这条内部响应里。
  string datasource_secret = 13;
  // 级别条件，按保存顺序。
  repeated LevelCondition levels = 14;
  // 当前仍在触发的 fingerprint。
  repeated string firing_fingerprints = 15;
  // 数据源标识。
  string datasource_uid = 16;
  // 规则名称。
  string name = 17;
  // 数据源索引模式。Elasticsearch 用，空表示搜索全部索引。
  string datasource_index_pattern = 18;
  // 数据源时间字段。Elasticsearch 用，空表示 @timestamp。
  string datasource_time_field = 19;
  // 自定义查询变量，按保存顺序。
  repeated RuleVariable variables = 20;
  // 数据源名称，用于心跳里展示「规则 × 数据源」组合。
  string datasource_name = 21;
}

// 一条自定义查询变量。expr 是查询模板，展开时可用主查询命中序列的标签。
message RuleVariable {
  // 模板变量名。
  string name = 1;
  // 查询模板，可用 {{ $labels.xxx }} 继承主查询标签。
  string expr = 2;
  // 说明，只用于展示。
  string description = 3;
}

// 一条级别条件。
message LevelCondition {
  // 比较方式，取值为 EQ、NE、GT、GTE、LT、LTE、IN、NOT_IN。
  string condition = 1;
  // 采样方式，取值为 FOR、MAX、MIN。
  string sample = 2;
  // 阈值。IN 和 NOT_IN 用逗号分隔多个值。
  string threshold = 3;
  // FOR 持续秒数。
  int32 for_seconds = 4;
  // 告警级别标识。
  string level_uid = 5;
}

// 一次评测回写。
message ReportEvalRequest {
  // 规则标识。
  string rule_uid = 1;
  // 领取时的评测批次，RFC3339 时间。
  string eval_slot = 2;
  // 为真表示驱动尚未实现，不产生 FIRING。
  bool skipped = 3;
  // 本次命中的序列。skipped 或 failed 为真时留空。
  repeated EvalHit hits = 4;
  // 本次评测的数据源标识。
  string datasource_uid = 5;
  // 为真表示本次向数据源的查询失败（连接失败、超时、上游错误或响应无法解析），
  // 用于数据源可用性判断；无效表达式等客户端错误不会置为 true。
  bool failed = 6;
  // 失败原因，failed 为真时有值，用于事件描述和排查。
  string failure_message = 7;
}

// 一条命中序列。
message EvalHit {
  // 规则和标签算出的 fingerprint。
  string fingerprint = 1;
  // 标签 JSON。
  string labels = 2;
  // 采样值。
  string value = 3;
  // 命中的告警级别。
  string level_uid = 4;
  // 摘要。
  string summary = 5;
  // 描述。
  string description = 6;
}

// 回写已接受。
message ReportEvalResponse {}

// 天权实例的一次状态心跳。
message ReportWorkerStatusRequest {
  // 进程实例唯一标识。
  string instance_uid = 1;
  // 运行主机或容器名称。
  string hostname = 2;
  // 是否正在评测。
  bool busy = 3;
  // 当前规则标识；空值表示空闲。
  string task_uid = 4;
  // 当前规则名称。
  string task_name = 5;
  // 当前任务开始时间，RFC3339；空值表示无活动任务。
  string task_started_at = 6;
  // 本批领取的规则 × 数据源组合，含状态。
  repeated WorkerTaskSnapshot tasks = 7;
  // 本批领取时间，RFC3339；空值表示还没有领取批次。
  string round_started_at = 8;
  // 本实例下一次轮询时间，RFC3339。
  string next_poll_at = 9;
  // 本实例的轮询周期秒数。
  int32 poll_interval_seconds = 10;
}

// 一个「规则 × 数据源」组合在本批里的状态。
message WorkerTaskSnapshot {
  // 组合状态：RUNNING（正在执行）、NEW（本轮新加入）、PENDING（本轮待执行）、
  // DONE（本轮已回写）、LEFT（上一批有、本批已离开）。
  string state = 1;
  // 规则标识。
  string rule_uid = 2;
  // 规则名称。
  string rule_name = 3;
  // 数据源标识。
  string datasource_uid = 4;
  // 数据源名称。
  string datasource_name = 5;
  // 本轮评测批次，RFC3339。
  string eval_slot = 6;
}

// 状态已记录。
message ReportWorkerStatusResponse {}
