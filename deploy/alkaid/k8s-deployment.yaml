# 令牌来自 Secret alkaid-token，不要内联在这里（apply 会覆盖线上真实令牌）：
#   kubectl -n alioth create secret generic alkaid-token \
#     --from-literal=ALKAID_AGENT_TOKEN='<控制台创建机器后复制的令牌>' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 令牌必须先由 alioth 控制台签发：迁移 seed 之后，登录管理台 → 机器 → 新建，才能拿到。
# 所以这里是 replicas: 0，控制台起来、拿到令牌并创建 Secret 之后再扩到 1。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alkaid
  namespace: alioth
spec:
  replicas: 0
  selector:
    matchLabels:
      app: alkaid
  template:
    metadata:
      labels:
        app: alkaid
    spec:
      containers:
        - name: alkaid
          image: ghcr.io/aide-family/moon/alkaid:sha-02f90de290a2
          ports:
            - name: http
              containerPort: 8022
            - name: grpc
              containerPort: 9022
          env:
            - name: ALKAID_HTTP_ADDR
              value: 0.0.0.0:8022
            - name: ALKAID_GRPC_ADDR
              value: 0.0.0.0:9022
            # 无头 Service 会解析出全部 alioth 副本，Agent 对每个副本各建一条出站流。
            - name: ALKAID_ALIOTH_GRPC_ADDR
              value: alioth-headless:9000
            - name: ALKAID_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alkaid-token
                  key: ALKAID_AGENT_TOKEN
          # alkaid 自带 sshd（Web Shell 用），必须以 root 启动，因此这里只收紧资源与探针。
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
# Use a DaemonSet instead when the agent must see node-local files:
# kind: DaemonSet, and keep the same container env.
