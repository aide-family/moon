apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: alioth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          # 节点访问不了 docker.io，沿用集群里其他组件在用的镜像站地址。
          image: docker.m.daocloud.io/redis:7
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: alioth
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
