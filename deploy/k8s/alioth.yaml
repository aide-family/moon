# Secret 见 secrets.example.yaml。真实值用 kubectl create secret 生成；
# 清单里不再内联 Secret，避免 `kubectl apply` 用占位值覆盖掉线上真实密钥。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alioth
  namespace: alioth
  labels:
    app: alioth
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: alioth
  template:
    metadata:
      labels:
        app: alioth
    spec:
      # 优雅退出：10s StopTimeout 之外再留出边缘请求与 shell 会话收尾时间。
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alioth
          image: ghcr.io/aide-family/alioth/alioth:sha-724d16ed08a8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 9000
          env:
            - name: ALIOTH_HTTP_ADDR
              value: 0.0.0.0:8000
            - name: ALIOTH_GRPC_ADDR
              value: 0.0.0.0:9000
            - name: ALIOTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: alioth-postgres
                  key: DATABASE_SOURCE
            - name: ALIOTH_REDIS_ADDR
              value: redis:6379
            - name: ALIOTH_HISTORY_DATABASE_PREFIX
              value: alioth_alert_
            - name: ALIOTH_HISTORY_TABLE_PREFIX
              value: alert_events_
            - name: ALIOTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: JWT_SECRET
            - name: ALIOTH_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: ENCRYPT_KEY
            - name: ALIOTH_WEB_URL
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: WEB_URL
            - name: MEGREZ_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: MEGREZ_SERVICE_KEY
            - name: MERAK_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: MERAK_SERVICE_KEY
            # 登录/注册验证码只能邮件下发，SMTP 不通就完全无法登录。
            # 实现是 net/smtp，只支持 STARTTLS（587/25），不支持 465 隐式 SSL。
            - name: ALIOTH_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: alioth-smtp
                  key: ALIOTH_SMTP_HOST
            - name: ALIOTH_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: alioth-smtp
                  key: ALIOTH_SMTP_PORT
            - name: ALIOTH_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: alioth-smtp
                  key: ALIOTH_SMTP_USERNAME
                  optional: true
            - name: ALIOTH_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alioth-smtp
                  key: ALIOTH_SMTP_PASSWORD
                  optional: true
            - name: ALIOTH_SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: alioth-smtp
                  key: ALIOTH_SMTP_FROM
            # 第三方登录可选：Secret 里没有这些键时不注入，登录页只保留邮箱验证码。
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: GITHUB_CLIENT_ID
                  optional: true
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: GITHUB_CLIENT_SECRET
                  optional: true
            - name: GITEE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: GITEE_CLIENT_ID
                  optional: true
            - name: GITEE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: GITEE_CLIENT_SECRET
                  optional: true
            - name: FEISHU_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: FEISHU_CLIENT_ID
                  optional: true
            - name: FEISHU_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: FEISHU_CLIENT_SECRET
                  optional: true
            - name: DINGTALK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: DINGTALK_CLIENT_ID
                  optional: true
            - name: DINGTALK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: DINGTALK_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          # readiness 查依赖（PG/Redis），liveness 只查进程，避免依赖抖动导致重启风暴。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: alioth
  namespace: alioth
spec:
  selector:
    app: alioth
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 9000
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: alioth-headless
  namespace: alioth
spec:
  clusterIP: None
  selector:
    app: alioth
  ports:
    - name: grpc
      port: 9000
      targetPort: grpc
