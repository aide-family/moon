# 示例 Secret。**不要直接 apply 这个文件**，也不要提交真实值。
# PostgreSQL / Redis 用 infra 命名空间的共享实例，这里只保存连接凭据。
# 生成真实值的命令见 deploy/k8s/README.md「密钥」：
#
#   kubectl -n alioth create secret generic alioth-postgres --from-literal=DATABASE_SOURCE=... --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n alioth create secret generic alioth-redis    --from-literal=REDIS_PASSWORD=...  --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n alioth create secret generic alioth-auth     --from-literal=...                 --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n alioth create secret generic alioth-smtp     --from-literal=...                 --dry-run=client -o yaml | kubectl apply -f -
#
# 数据库/Redis 凭据改完必须 kubectl rollout restart deploy/alioth；megrez、merak 也读 Redis，要一起重启。
---
apiVersion: v1
kind: Secret
metadata:
  name: alioth-postgres
  namespace: alioth
type: Opaque
stringData:
  # infra 命名空间的共享 PostgreSQL（postgres18）。账号需要 CREATEDB：
  # 历史告警/消息日志会按租户创建 alioth_alert_<uid> 等库。
  DATABASE_SOURCE: postgres://alioth:change-me@postgres18.infra.svc.cluster.local:5432/alioth?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: alioth-redis
  namespace: alioth
type: Opaque
stringData:
  # 与 infra 命名空间 redis 的 requirepass（redis-secret/REDIS_PASSWORD）保持一致。
  REDIS_PASSWORD: change-me
---
apiVersion: v1
kind: Secret
metadata:
  name: alioth-auth
  namespace: alioth
type: Opaque
stringData:
  JWT_SECRET: replace-me-with-32-bytes-of-random
  ENCRYPT_KEY: replace-me-with-32-bytes-of-random
  MEGREZ_SERVICE_KEY: sk-megrez-replace-me
  MERAK_SERVICE_KEY: sk-merak-replace-me
  WEB_URL: http://alioth.moon.com
  # 第三方登录可选。填入真实客户端后登录页才出现 GitHub / Gitee / 飞书 / 钉钉 入口，
  # 回调地址填 <WEB_URL>/auth/callback。
  # GITHUB_CLIENT_ID: ""
  # GITHUB_CLIENT_SECRET: ""
  # GITEE_CLIENT_ID: ""
  # GITEE_CLIENT_SECRET: ""
  # 飞书应用需在开放平台申请 contact:user.email:readonly，否则读不到邮箱。
  # FEISHU_CLIENT_ID: ""
  # FEISHU_CLIENT_SECRET: ""
  # 钉钉应用需在权限管理申请「通讯录个人信息读权限」，否则读不到用户资料。
  # DINGTALK_CLIENT_ID: ""
  # DINGTALK_CLIENT_SECRET: ""
---
# 登录/注册验证码、邀请邮件都走这里。缺失时 SendEmailLoginCode 返回 smtp is not configured，
# 也就是完全无法登录（系统没有密码登录）。
#
# 注意实现用的是 net/smtp：只支持 STARTTLS（587/25），**不支持 465 隐式 SSL**。
# 填了 username 就会走 smtp.PlainAuth，走明文且非 localhost 时会被拒发，
# 所以端口必须能协商出 STARTTLS。
apiVersion: v1
kind: Secret
metadata:
  name: alioth-smtp
  namespace: alioth
type: Opaque
stringData:
  ALIOTH_SMTP_HOST: smtp.example.com
  ALIOTH_SMTP_PORT: "587"
  ALIOTH_SMTP_USERNAME: ""
  ALIOTH_SMTP_PASSWORD: ""
  ALIOTH_SMTP_FROM: alioth@example.com
