apiVersion: v1
kind: Secret
metadata:
  name: alioth-postgres
  namespace: alioth
type: Opaque
stringData:
  POSTGRES_USER: alioth
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: alioth
  DATABASE_SOURCE: postgres://alioth:change-me@postgres:5432/alioth?sslmode=disable
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: alioth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: alioth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: alioth-postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "alioth", "-d", "alioth"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: alioth
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
