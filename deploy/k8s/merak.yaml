apiVersion: apps/v1
kind: Deployment
metadata:
  name: merak
  namespace: alioth
  labels:
    app: merak
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: merak
  template:
    metadata:
      labels:
        app: merak
    spec:
      # 一次通知投递最长 30s，SIGTERM 后不要立刻掐断正在发送的任务。
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: merak
          image: ghcr.io/aide-family/alioth/merak:sha-724d16ed08a8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: MERAK_HTTP_ADDR
              value: 0.0.0.0:8002
            - name: ALIOTH_GRPC_ADDR
              value: alioth:9000
            - name: MERAK_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: MERAK_SERVICE_KEY
            - name: REDIS_ADDR
              value: redis:6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            # 收到 SIGTERM 后先停 5 秒再退出：kube-proxy/iPtables 摘除 endpoint 有延迟，
            # 进程立刻关监听会让仍被调度过来的新连接被拒，nginx 就会回 502。
            # 这里是 k8s 1.30+ 的 preStop.sleep，distroless 镜像里没有 sleep 二进制也能用。
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: merak
  namespace: alioth
spec:
  selector:
    app: merak
  ports:
    - name: http
      port: 8002
      targetPort: http
