apiVersion: apps/v1
kind: Deployment
metadata:
  name: merak
  namespace: alioth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: merak
  template:
    metadata:
      labels:
        app: merak
    spec:
      containers:
        - name: merak
          image: alioth/merak:latest
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: MERAK_HTTP_ADDR
              value: 0.0.0.0:8002
            - name: MERAK_ALIOTH_GRPC_ADDR
              value: alioth:9000
            - name: MERAK_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: MERAK_SERVICE_KEY
            - name: MERAK_REDIS_ADDR
              value: redis:6379
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: merak
  namespace: alioth
spec:
  selector:
    app: merak
  ports:
    - name: http
      port: 8002
      targetPort: http
