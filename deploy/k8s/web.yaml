# nginx 配置由 web 镜像内置（web/nginx.conf），这里不再维护第二份 ConfigMap：
# 两份手写配置已经漂移过一次，k8s 版缺 Upgrade 头会让交互式 shell 无法握手。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: alioth
  labels:
    app: web
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/aide-family/alioth/web:sha-724d16ed08a8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            # 收到 SIGTERM 后先停 5 秒再退出：kube-proxy 摘除 endpoint 有延迟，
            # 进程立刻关监听会让仍被调度过来的连接被重置。
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            # nginx 需要可写的临时目录与 pid 文件；根文件系统保持只读。
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: alioth
spec:
  # 只走集群内域名（ingress.yaml 由 Kong 转发），不额外占用 MetalLB 的 IP。
  # 需要绕过网关直连时再改成 LoadBalancer。
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: http
