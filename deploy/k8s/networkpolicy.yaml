# 只收口数据面端口（PostgreSQL / Redis）：这两个端口的横向访问才是真正的风险。
# 应用 HTTP/gRPC 端口保持命名空间内互通，避免 kubelet 探针与 CNI 实现差异把 Pod 摘掉。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: alioth
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: alioth
        - podSelector:
            matchLabels:
              app: migrate
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: alioth
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: alioth
        - podSelector:
            matchLabels:
              app: megrez
        - podSelector:
            matchLabels:
              app: merak
      ports:
        - protocol: TCP
          port: 6379
