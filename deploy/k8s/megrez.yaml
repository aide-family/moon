apiVersion: apps/v1
kind: Deployment
metadata:
  name: megrez
  namespace: alioth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: megrez
  template:
    metadata:
      labels:
        app: megrez
    spec:
      containers:
        - name: megrez
          image: alioth/megrez:latest
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: MEGREZ_HTTP_ADDR
              value: 0.0.0.0:8001
            - name: MEGREZ_ALIOTH_GRPC_ADDR
              value: alioth:9000
            - name: MEGREZ_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: MEGREZ_SERVICE_KEY
            - name: MEGREZ_REDIS_ADDR
              value: redis:6379
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: megrez
  namespace: alioth
spec:
  selector:
    app: megrez
  ports:
    - name: http
      port: 8001
      targetPort: http
