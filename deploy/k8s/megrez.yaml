apiVersion: apps/v1
kind: Deployment
metadata:
  name: megrez
  namespace: alioth
  labels:
    app: megrez
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: megrez
  template:
    metadata:
      labels:
        app: megrez
    spec:
      # 评测 worker 收到 SIGTERM 后要先停掉当前轮次，给 30s 排空。
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: megrez
          image: ghcr.io/aide-family/alioth/megrez:sha-310475cced9f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: MEGREZ_HTTP_ADDR
              value: 0.0.0.0:8001
            - name: ALIOTH_GRPC_ADDR
              value: alioth:9000
            - name: MEGREZ_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: alioth-auth
                  key: MEGREZ_SERVICE_KEY
            - name: REDIS_ADDR
              value: redis:6379
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          lifecycle:
            # 收到 SIGTERM 后先停 5 秒再退出：kube-proxy/iPtables 摘除 endpoint 有延迟，
            # 进程立刻关监听会让仍被调度过来的新连接被拒，nginx 就会回 502。
            # 这里是 k8s 1.30+ 的 preStop.sleep，distroless 镜像里没有 sleep 二进制也能用。
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            # 评测进程直连数据源：接自签 HTTPS 数据源（例如 ECK Elasticsearch）时，
            # 信任库必须注入到这里，只给 alioth 挂是不够的。
            - name: ca-bundle
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
      volumes:
        - name: ca-bundle
          secret:
            secretName: alioth-ca-bundle
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: megrez
  namespace: alioth
spec:
  selector:
    app: megrez
  ports:
    - name: http
      port: 8001
      targetPort: http
