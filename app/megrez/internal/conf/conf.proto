syntax = "proto3";

package megrez.conf;

option go_package = "github.com/aide-family/moon/app/megrez/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Alioth alioth = 2;
  Redis redis = 3;
  Probe probe = 4;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
}

// 玉衡 gRPC 地址和天权自己的 service key。
message Alioth {
  // 玉衡 gRPC 地址。
  string grpc_addr = 1;
  // 调用领取和回写使用的 service key。
  string service_key = 2;
}

// Redis 只用于评测锁。
message Redis {
  // 地址。
  string addr = 1;
  // 密码。
  string password = 2;
}

// 探测执行器配置。一期只有 HTTP 探测，关闭后不再领取探测任务，
// 不影响指标与日志评测。
message Probe {
  // 是否启用探测 worker。
  bool enabled = 1;
  // 轮询周期。
  google.protobuf.Duration poll_interval = 2;
  // 单目标最大超时毫秒数，覆盖目标组里配置过大的值。
  int32 max_timeout_ms = 3;
}
