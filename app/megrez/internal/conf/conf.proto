syntax = "proto3";

package megrez.conf;

option go_package = "github.com/aide-family/moon/app/megrez/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Alioth alioth = 2;
  Redis redis = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
}

// 玉衡 gRPC 地址和天权自己的 service key。
message Alioth {
  // 玉衡 gRPC 地址。
  string grpc_addr = 1;
  // 调用领取和回写使用的 service key。
  string service_key = 2;
}

// Redis 只用于评测锁。
message Redis {
  // 地址。
  string addr = 1;
  // 密码。
  string password = 2;
}
