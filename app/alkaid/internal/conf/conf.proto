syntax = "proto3";

package alkaid.conf;

option go_package = "github.com/aide-family/moon/app/alkaid/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Alioth alioth = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Alioth {
  message GRPC {
    string addr = 1;
  }
  GRPC grpc = 1;
  // Agent 令牌，明文只放在配置里。
  string agent_token = 2;
  // 心跳间隔。
  google.protobuf.Duration heartbeat_interval = 3;
}
