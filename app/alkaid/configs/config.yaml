server:
  http:
    network: tcp
    addr: ${ALKAID_HTTP_ADDR:0.0.0.0:8022}
    timeout: 1s
  grpc:
    network: tcp
    addr: ${ALKAID_GRPC_ADDR:0.0.0.0:9022}
    timeout: 1s
alioth:
  grpc:
    # 支持逗号分隔多个控制面副本；Kubernetes 内建议指向无头 Service。
    addr: ${ALKAID_ALIOTH_GRPC_ADDR:127.0.0.1:9000}
  agent_token: ${ALKAID_AGENT_TOKEN:ag-65cdb4631c20a45210fcd5dd3eeeab9aaa24f637f524b52a}
  heartbeat_interval: 15s
