server:
  http:
    network: tcp
    addr: ${ALKAID_HTTP_ADDR:0.0.0.0:8022}
    timeout: 1s
  grpc:
    network: tcp
    addr: ${ALKAID_GRPC_ADDR:0.0.0.0:9022}
    timeout: 1s
alioth:
  grpc:
    # 支持逗号分隔多个控制面副本；Kubernetes 内建议指向无头 Service。
    addr: ${ALKAID_ALIOTH_GRPC_ADDR:127.0.0.1:9000}
  # 机器令牌由控制台创建机器时生成，只能用环境变量注入；这里的默认值不是可用令牌。
  # 这里曾经内置过一枚真实形态的默认令牌；如果它在任何环境用过，需要在控制台重置。
  agent_token: ${ALKAID_AGENT_TOKEN:ag-replace-me}
  heartbeat_interval: 15s
