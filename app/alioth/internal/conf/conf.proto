syntax = "proto3";

package alioth.conf;

option go_package = "github.com/aide-family/Alioth/app/alioth/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string addr = 1;
    string password = 2;
  }
  Database database = 1;
  Redis redis = 2;
}

message Auth {
  string jwt_secret = 1;
  int64 access_ttl_seconds = 2;
  int64 refresh_ttl_seconds = 3;
  message ServiceKey {
    string name = 1;
    string key = 2;
  }
  message OAuthClient {
    string provider = 1;
    string client_id = 2;
    string client_secret = 3;
  }
  message SMTP {
    string host = 1;
    int32 port = 2;
    string username = 3;
    string password = 4;
    string from = 5;
  }
  repeated ServiceKey service_keys = 4;
  repeated OAuthClient oauth = 5;
  SMTP smtp = 6;
  // 数据源密码和密钥的 AES-GCM 主密钥。
  string encrypt_key = 7;
}
