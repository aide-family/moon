syntax = "proto3";

package alioth.conf;

option go_package = "github.com/aide-family/moon/app/alioth/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Auth auth = 3;
  Deploy deploy = 4;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string addr = 1;
    string password = 2;
  }
  // History 是分库分表的命名规则。租户库名 = database_prefix + 租户标识；
  // 告警周表名 = table_prefix + 周一日期（YYYYMMDD），
  // 消息日志周表名 = message_table_prefix + 周一日期（YYYYMMDD）。
  message History {
    string database_prefix = 1;
    string table_prefix = 2;
    string message_table_prefix = 3;
  }
  Database database = 1;
  Redis redis = 2;
  History history = 3;
}

message Auth {
  string jwt_secret = 1;
  int64 access_ttl_seconds = 2;
  int64 refresh_ttl_seconds = 3;
  message ServiceKey {
    string name = 1;
    string key = 2;
  }
  message OAuthClient {
    string provider = 1;
    string client_id = 2;
    string client_secret = 3;
  }
  message SMTP {
    string host = 1;
    int32 port = 2;
    string username = 3;
    string password = 4;
    string from = 5;
  }
  repeated ServiceKey service_keys = 4;
  repeated OAuthClient oauth = 5;
  SMTP smtp = 6;
  // 数据源密码和密钥的 AES-GCM 主密钥。
  string encrypt_key = 7;
  // 管理台对外地址，用于邮件里的邀请快捷链接。
  string web_url = 8;
}

// Deploy 是机器页「自动安装摇光 Agent」使用的配置。
message Deploy {
  // 目标机器上安装的摇光版本。留空表示与控制面构建版本一致。
  string alkaid_version = 1;
  // 安装包下载地址模板，支持 {version} 和 {arch} 占位，指向官方发布的 tar.gz。
  string alkaid_download_url = 2;
  // 本地安装包路径。配置后优先使用，适合离线部署，跳过了下载步骤。
  string alkaid_package_path = 3;
  // 目标机器可访问的控制面 gRPC 地址，会写进目标机器的 alkaid.env。
  string alioth_grpc_addr = 4;
  // 单条 SSH 命令的执行超时，也用于建立连接。
  google.protobuf.Duration timeout = 5;
  // 启动服务后等待 Agent 出站注册上线的最长时间。
  google.protobuf.Duration online_timeout = 6;
}
