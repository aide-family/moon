server:
  http:
    network: tcp
    addr: ${ALIOTH_HTTP_ADDR:0.0.0.0:8000}
    # 边缘 SSH 执行内部等待 60s，超时必须大于它，否则审计来不及落库。
    timeout: 90s
  grpc:
    network: tcp
    addr: ${ALIOTH_GRPC_ADDR:0.0.0.0:9000}
    timeout: 90s
data:
  database:
    driver: postgres
    source: ${ALIOTH_DATABASE_URL:postgres://alioth:alioth@127.0.0.1:5432/alioth?sslmode=disable}
  redis:
    addr: ${ALIOTH_REDIS_ADDR:127.0.0.1:6379}
    password: ${ALIOTH_REDIS_PASSWORD:}
  # 历史告警与消息日志按租户库 + 周表归档。库名为 database_prefix + 32 位租户 UID（前缀最多 31 字符），
  # 表名为各自 table 前缀 + 周一日期（YYYYMMDD，前缀最多 55 字符）。
  history:
    database_prefix: ${ALIOTH_HISTORY_DATABASE_PREFIX:alioth_alert_}
    table_prefix: ${ALIOTH_HISTORY_TABLE_PREFIX:alert_events_}
    message_table_prefix: ${ALIOTH_HISTORY_MESSAGE_TABLE_PREFIX:message_logs_}
auth:
  jwt_secret: ${ALIOTH_JWT_SECRET:dev-only-change-me}
  access_ttl_seconds: 7200
  refresh_ttl_seconds: 604800
  service_keys:
    - name: megrez
      key: ${MEGREZ_SERVICE_KEY:sk-megrez-dev}
    - name: merak
      key: ${MERAK_SERVICE_KEY:sk-merak-dev}
  encrypt_key: ${ALIOTH_ENCRYPT_KEY:dev-only-encrypt-key}
  web_url: ${ALIOTH_WEB_URL:http://127.0.0.1:8080}
  smtp:
    host: ${ALIOTH_SMTP_HOST:127.0.0.1}
    port: ${ALIOTH_SMTP_PORT:1025}
    username: ${ALIOTH_SMTP_USERNAME:}
    password: ${ALIOTH_SMTP_PASSWORD:}
    from: ${ALIOTH_SMTP_FROM:alioth@localhost}
  oauth:
    - provider: GITHUB
      client_id: ${GITHUB_CLIENT_ID:}
      client_secret: ${GITHUB_CLIENT_SECRET:}
    - provider: GITEE
      client_id: ${GITEE_CLIENT_ID:}
      client_secret: ${GITEE_CLIENT_SECRET:}
    - provider: FEISHU
      client_id: ${FEISHU_CLIENT_ID:}
      client_secret: ${FEISHU_CLIENT_SECRET:}
